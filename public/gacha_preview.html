<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽑기 상자 프로토타입 v5</title>
<style>
:root { --rare: #8b8f98; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #f4f4f5; color: #18181b;
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  padding: 28px 16px 60px;
}
h1 { text-align: center; font-size: 1.35rem; margin: 0 0 18px; letter-spacing: -.02em; }
.wrap { max-width: 760px; margin: 0 auto; }

/* ── 상자 선택 탭 ── */
.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; position: relative; z-index: 10; }
.tabs button {
  border: 1.5px solid #e4e4e7; background: #fff; color: #52525b; border-radius: 999px;
  padding: 9px 18px; font-size: .9rem; font-weight: 700; cursor: pointer;
}
.tabs button.on { background: #18181b; color: #fff; border-color: #18181b; }
.tabs button.on.prem { background: linear-gradient(180deg, #f3d271, #c89b2a 60%, #a87e14); color: #2a1e00; border-color: #c89b2a; }

/* ── 스테이지 ── */
.stage { position: relative; }
.glow-bg {
  position: absolute; left: 50%; top: 60px; width: 420px; height: 420px; margin-left: -210px;
  border-radius: 50%; pointer-events: none; opacity: 0; z-index: 0;
  background: radial-gradient(circle, var(--rare) 0%, transparent 65%);
  transition: opacity .8s;
}
.open .glow-bg { opacity: .45; }

/* ── 상자 (3D) ── */
.box-area { position: relative; height: 230px; display: flex; align-items: flex-end; justify-content: center; z-index: 1; perspective: 650px; pointer-events: none; }  /* 장식 — 뚜껑·빛기둥이 탭을 가리지 않게 */
/* 상자 좌표계: 원점 = 앞면 윗변, y 아래, z 앞(화면 쪽). 깊이 D=72 */
.box { position: relative; width: 220px; height: 110px; margin-bottom: 14px; transform-style: preserve-3d; }
.shake .box { animation: shake .55s ease-in-out; }
@keyframes shake {
  0%,100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-7px) rotate(-3deg); }
  40% { transform: translateX(7px) rotate(3deg); }
  60% { transform: translateX(-5px) rotate(-2deg); }
  80% { transform: translateX(5px) rotate(2deg); }
}
.box3d { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-18deg) rotateY(-22deg); }  /* 살짝 위·옆에서 본 3/4 뷰 */
.face { position: absolute; left: 0; top: 0; width: 220px; backface-visibility: visible; }
/* 앞면 */
.front {
  height: 110px; border-radius: 0 0 3px 3px; border: 2.5px solid #18181b; border-top: 0; backface-visibility: hidden;
  background: linear-gradient(180deg, #ffffff, #e6e6eb);
  box-shadow: inset 0 -14px 0 rgba(0,0,0,.06);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
}
.front .lock { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #18181b; position: relative; background: #fff; }
.front .lock::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 10px; margin: -3px 0 0 -2.5px; background: #18181b; border-radius: 2px; }
.front .name { font-size: .78rem; font-weight: 800; letter-spacing: .18em; color: #18181b; }
/* 상자 속(윗구멍): 윗변에서 뒤쪽으로 눕힘 */
.hole {
  height: 72px; transform-origin: 50% 0; transform: translateY(3px) rotateX(-90deg);
  background: radial-gradient(ellipse at 50% 60%, #52525b, #1f1f23 70%); box-shadow: inset 0 0 0 2.5px #18181b;
}
.hole::after {
  content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .5s .25s;
  background: radial-gradient(ellipse at 50% 60%, var(--rare), transparent 72%);
}
.open .hole::after { opacity: .9; }
/* 양 옆면 */
.side { width: 72px; height: 110px; transform-origin: 0 0; background: linear-gradient(180deg, #e2e2e8, #cfcfd6); border: 2.5px solid #18181b; border-top: 0; backface-visibility: hidden; }
.side.l { transform: rotateY(-90deg) translateX(-72px); }     /* 왼쪽 모서리에서 뒤쪽으로, 바깥(-x) 향함 */
.side.r { left: 220px; transform: rotateY(90deg); }           /* 오른쪽 모서리에서 뒤쪽으로, 바깥(+x) 향함 */
/* 그림자 */
.shadow { position: absolute; left: 6px; right: -30px; top: 110px; height: 72px; background: rgba(0,0,0,.22); filter: blur(9px); transform-origin: 50% 0; transform: translateY(2px) rotateX(-90deg); }
/* 뚜껑: 경첩 = 뒷변(z=-72). 윗판(뒤→앞으로 눕힘) + 앞 덮개 */
.lid {
  position: absolute; left: 0; top: 0; width: 220px; height: 0; transform-style: preserve-3d;
  transform-origin: 50% 0; transform: translateZ(-72px) rotateX(0deg);
  transition: transform .9s cubic-bezier(.34,1.35,.4,1);
}
.open .lid { transform: translateZ(-72px) rotateX(104deg); }
.lid-top, .lid-under {
  position: absolute; left: -2px; top: 0; width: 224px; height: 76px; backface-visibility: hidden;
  border: 2.5px solid #18181b; border-radius: 3px;
}
.lid-top { transform-origin: 50% 0; transform: rotateX(90deg); background: linear-gradient(180deg, #f6f6f8, #e2e2e8); }
.lid-under {                                                   /* 같은 평면, 아래를 향한 안쪽 면 (열리면 보임) */
  transform-origin: 50% 100%; transform: translateY(-76px) rotateX(-90deg);
  background: linear-gradient(0deg, #d4d4d8, #b7b7c0);
}
.lid-front {
  position: absolute; left: -2px; top: 0; width: 224px; height: 24px; transform: translateZ(76px);
  background: linear-gradient(180deg, #ffffff, #dedee4); border: 2.5px solid #18181b; border-top: 0; border-radius: 0 0 4px 4px;
}
.lid-front::before { content: ""; position: absolute; left: 50%; bottom: -3px; width: 22px; height: 12px; margin-left: -11px; background: #18181b; border-radius: 0 0 6px 6px; }
/* 빛기둥: 상자 속에서 위로 */
.beam {
  position: absolute; left: 50%; top: 0; width: 130px; height: 0; margin-left: -65px;
  background: linear-gradient(0deg, var(--rare), transparent); opacity: .6;
  clip-path: polygon(22% 100%, 78% 100%, 100% 0, 0 0);
  transform-origin: 50% 100%; transform: translateZ(-36px) translateY(-100%);
  transition: height .7s ease-out .3s;
}
.open .beam { height: 200px; }

/* 고급 상자 */
.prem .front { background: linear-gradient(180deg, #2a2723, #0f0d0b); border-color: #d9ab3c; box-shadow: inset 0 -14px 0 rgba(255,255,255,.04); }
.prem .front .lock { border-color: #f3d271; background: #1a1714; }
.prem .front .lock::after { background: #f3d271; }
.prem .front .name { color: #f3d271; }
.prem .side { background: linear-gradient(180deg, #1c1917, #0a0908); border-color: #d9ab3c; }
.prem .hole { box-shadow: inset 0 0 0 2.5px #d9ab3c; background: radial-gradient(ellipse at 50% 60%, #3a3128, #0f0d0b 70%); }
.prem .lid-top { background: linear-gradient(180deg, #f6dc8a, #c89b2a 60%, #a87e14); border-color: #7a5a0e; }
.prem .lid-under { background: linear-gradient(0deg, #8a6a1a, #5c460f); border-color: #7a5a0e; }
.prem .lid-front { background: linear-gradient(180deg, #f3d271, #b98d20); border-color: #7a5a0e; }
.prem .lid-front::before { background: #3a2a05; }

/* ── 룰렛 ── */
.stack { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; position: relative; z-index: 1; }
.roulette-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s ease; }
.roulette-wrap.show { grid-template-rows: 1fr; }
.roulette-wrap > div { overflow: hidden; }
.roulette-label { font-size: .74rem; font-weight: 700; color: #71717a; letter-spacing: .08em; margin: 2px 0 6px 4px; }
.roulette {
  position: relative; height: 104px; background: #fff; border: 2px solid #18181b; border-radius: 14px; overflow: hidden;
}
.roulette::before, .roulette::after {
  content: ""; position: absolute; left: 50%; margin-left: -9px; border: 9px solid transparent; z-index: 3;
}
.roulette::before { top: -2px; border-top: 12px solid #18181b; }
.roulette::after { bottom: -2px; border-bottom: 12px solid #18181b; }
.roulette .line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #18181b; opacity: .35; z-index: 2; }
.roulette .fade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, #fff 0%, transparent 18%, transparent 82%, #fff 100%); }
.strip { display: flex; height: 100%; padding: 8px 0; will-change: transform; }
.tile {
  flex: 0 0 116px; margin: 0 4px; border-radius: 10px; color: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; font-weight: 800; font-size: .95rem; letter-spacing: .04em;
  background: var(--c); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); transition: transform .35s, filter .35s;
}
.tile small { font-size: .68rem; font-weight: 600; opacity: .85; letter-spacing: 0; }
.landed .tile { filter: saturate(.4) brightness(.92); }
.landed .tile.hit { filter: none; transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--c), 0 8px 22px rgba(0,0,0,.25); }

.prem .roulette { background: #141210; border-color: #d9ab3c; }
.prem .roulette::before { border-top-color: #f3d271; } .prem .roulette::after { border-bottom-color: #f3d271; }
.prem .roulette .line { background: #f3d271; }
.prem .roulette .fade { background: linear-gradient(90deg, #141210 0%, transparent 18%, transparent 82%, #141210 100%); }
.prem .landed .tile.hit { box-shadow: 0 0 0 3px #141210, 0 0 0 5px var(--c), 0 8px 22px rgba(0,0,0,.5); }

/* ── 결과 카드 ── */
.result {
  margin: 22px auto 0; max-width: 360px; background: #fff; border: 2.5px solid var(--rare); border-radius: 18px;
  padding: 18px 22px; text-align: center; transform: scale(0); transition: transform .55s cubic-bezier(.2,1.7,.4,1);
  box-shadow: 0 14px 40px rgba(0,0,0,.18);
}
.result.show { transform: scale(1); }
.result .tier { display: inline-block; background: var(--rare); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: .72rem; font-weight: 800; letter-spacing: .12em; }
.result .name { font-size: 1.25rem; font-weight: 900; margin-top: 8px; }
.result .sub { font-size: .78rem; color: #71717a; margin-top: 4px; }

/* ── 버튼 ── */
.ctrl { text-align: center; margin-top: 22px; }
button.pull {
  border: 0; background: #18181b; color: #fff; border-radius: 12px; padding: 14px 42px; font-size: 1rem; font-weight: 800;
  cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.2); transition: transform .12s;
}
button.pull:active { transform: scale(.96); }
button.pull:disabled { opacity: .45; cursor: default; }
.prem button.pull { background: linear-gradient(180deg, #f3d271, #c89b2a 60%, #a87e14); color: #2a1e00; box-shadow: 0 6px 18px rgba(200,155,42,.45); }
.hint { color: #a1a1aa; font-size: .76rem; margin-top: 10px; }

/* 확률표 */
/* 보상 목록 (등급별, 확률은 표시하지 않음) */
.rewards { max-width: 560px; margin: 26px auto 0; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.rw-tier { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1.5px solid #e4e4e7; border-radius: 12px; padding: 9px 12px; }
.rw-badge { flex: 0 0 52px; text-align: center; font-size: .7rem; font-weight: 800; letter-spacing: .06em; color: #fff; background: var(--c); border-radius: 999px; padding: 4px 0; margin-top: 1px; }
.rw-items { display: flex; flex-wrap: wrap; gap: 5px; }
.rw-items span { font-size: .76rem; font-weight: 600; color: #3f3f46; background: #f4f4f5; border-radius: 7px; padding: 3px 8px; }
.prem .rw-tier { background: #1a1714; border-color: #3a3128; }
.prem .rw-items span { background: #26221d; color: #e8dcc0; }

.spark { position: absolute; z-index: 5; pointer-events: none; font-size: 20px; opacity: 0; left: 50%; top: 120px; }
.spark.fly { animation: fly 1.1s ease-out forwards; }
@keyframes fly {
  0% { opacity: 1; transform: translate(0,0) scale(.5); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); }
}
</style>
</head>
<body>
<h1>🎁 뽑기 상자</h1>
<div class="wrap">
  <div class="tabs">
    <button id="tabNormal" class="on" onclick="selectBox('Normal')">일반 상자 · 200P</button>
    <button id="tabPremium" onclick="selectBox('Premium')">고급 상자 · 1,000원</button>
  </div>

  <div id="stage" class="stage">
    <div class="glow-bg"></div>
    <div class="box-area">
      <div class="box"><div class="box3d">
        <div class="shadow"></div>
        <div class="face side l"></div>
        <div class="face side r"></div>
        <div class="face hole"></div>
        <div class="beam"></div>
        <div class="face front"><div class="lock"></div><div class="name" id="boxName">NORMAL BOX</div></div>
        <div class="lid">
          <div class="lid-top"></div>
          <div class="lid-under"></div>
          <div class="lid-front"></div>
        </div>
      </div></div>
    </div>

    <div class="stack">
      <!-- 2차 뽑기(내용물) — 등급 룰렛 위에 나타남 -->
      <div class="roulette-wrap" id="wrap2"><div>
        <div class="roulette-label">2차 · 내용물</div>
        <div class="roulette"><div class="line"></div><div class="fade"></div><div class="strip" id="strip2"></div></div>
      </div></div>
      <!-- 1차 뽑기(등급) -->
      <div class="roulette-wrap" id="wrap1"><div>
        <div class="roulette-label">1차 · 등급</div>
        <div class="roulette"><div class="line"></div><div class="fade"></div><div class="strip" id="strip1"></div></div>
      </div></div>
    </div>

    <div class="result" id="result"></div>

    <div class="ctrl">
      <button class="pull" id="btn" onclick="pull()">🎁 200P 뽑기</button>
      <div class="hint">뽑기를 누르면 상자가 열리고 룰렛이 돌아갑니다</div>
      <div class="rewards" id="rewards"></div>
    </div>
  </div>
</div>

<script>
/* ── 프로토타입 데이터 (확률·내용물은 임시값, 실제 구현 시 관리자에서 설정) ── */
/* ── 확정 보상표 (2026-09-16). p = 등급 확률(%), w = 등급 안 가중치(없으면 동일) ── */
const C = { normal: "#8b8f98", rare: "#3b82f6", epic: "#8b5cf6", legend: "#f59e0b", hidden: "#e11d48" };
const BOXES = {
  Normal: {
    name: "NORMAL BOX", cost: "200P", prem: false,
    tiers: [
      { label: "노말",   p: 80,  color: C.normal, items: [
        { n: "300P", w: 10 }, { n: "200P", w: 15 }, { n: "100P", w: 25 }, { n: "50P", w: 25 }, { n: "꽝", w: 25 } ] },
      { label: "희귀",   p: 15,  color: C.rare, items: [
        { n: "잔액 100원", w: 17.5 }, { n: "잔액 300원", w: 17.5 }, { n: "300P", w: 17.5 }, { n: "400P", w: 17.5 }, { n: "꽝", w: 30 } ] },
      { label: "에픽",   p: 4,   color: C.epic, items: [
        { n: "잔액 500원", w: 25 }, { n: "잔액 1,000원", w: 5 }, { n: "500P", w: 25 }, { n: "600P", w: 25 }, { n: "꽝", w: 20 } ] },
      { label: "레전드", p: 0.8, color: C.legend, items: [
        { n: "잔액 3,000원" }, { n: "잔액 5,000원" }, { n: "1,000P" }, { n: "1,500P" } ] },
      { label: "히든",   p: 0.2, color: C.hidden, items: [
        { n: "잔액 30,000원" }, { n: "게임패스 30일권" } ] },
    ],
  },
  Premium: {
    name: "PREMIUM BOX", cost: "1,000원", prem: true,
    tiers: [
      { label: "노말",   p: 45,  color: C.normal, items: [
        { n: "100P" }, { n: "200P" }, { n: "300P" }, { n: "잔액 200원" }, { n: "잔액 300원" } ] },
      { label: "희귀",   p: 32,  color: C.rare, items: [
        { n: "잔액 500원" }, { n: "잔액 700원" }, { n: "500P" }, { n: "800P" } ] },
      { label: "에픽",   p: 15,  color: C.epic, items: [
        { n: "잔액 1,000원", w: 35 }, { n: "잔액 1,500원", w: 30 }, { n: "잔액 2,000원", w: 10 }, { n: "1,000P", w: 25 } ] },
      { label: "레전드", p: 6.5, color: C.legend, items: [
        { n: "잔액 3,000원", w: 30 }, { n: "잔액 5,000원", w: 30 }, { n: "잔액 10,000원", w: 5 }, { n: "게임패스 7일권", w: 25 }, { n: "2,000P", w: 10 } ] },
      { label: "히든",   p: 1.5, color: C.hidden, items: [
        { n: "게임패스 30일권", w: 70 }, { n: "잔액 30,000원", w: 20 }, { n: "잔액 50,000원", w: 10 } ] },
    ],
  },
};
/* 룰렛 띠에 깔리는 칸은 실제 확률과 무관한 고정 장식 비율 (확률 비공개 — 역산 방지) */
const DISPLAY_W = [50, 28, 14, 6, 2];

let cur = "Normal";
let busy = false;
const stage = document.getElementById("stage");

function selectBox(k) {
  if (busy) return;
  cur = k;
  const b = BOXES[k];
  document.getElementById("tabNormal").className = k === "Normal" ? "on" : "";
  document.getElementById("tabPremium").className = k === "Premium" ? "on prem" : "";
  stage.classList.toggle("prem", b.prem);
  document.getElementById("boxName").textContent = b.name;
  document.getElementById("btn").textContent = "🎁 " + b.cost + " 뽑기";
  document.getElementById("rewards").innerHTML = b.tiers.map((t) =>
    `<div class="rw-tier" style="--c:${t.color}"><span class="rw-badge">${t.label}</span><div class="rw-items">${
      t.items.filter((it) => it.n !== "꽝").map((it) => `<span>${it.n}</span>`).join("")}</div></div>`).join("");
  reset();
}

function reset() {
  stage.classList.remove("open", "shake");
  stage.style.setProperty("--rare", "#8b8f98");
  for (const id of ["wrap1", "wrap2"]) document.getElementById(id).classList.remove("show");
  for (const id of ["strip1", "strip2"]) {
    const s = document.getElementById(id);
    s.style.transition = "none"; s.style.transform = "translateX(0)"; s.innerHTML = "";
    s.parentElement.classList.remove("landed");
  }
  document.getElementById("result").className = "result";
  stage.querySelectorAll(".spark").forEach((e) => e.remove());
}

/* 가중치 추첨 */
function weightedPick(list, w) {
  const total = list.reduce((a, x, i) => a + w(x, i), 0);
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) { r -= w(list[i], i); if (r < 0) return i; }
  return list.length - 1;
}

/* 룰렛 채우기 + 회전. entries[resultIdx]가 화살표에 걸리도록 */
const TILE = 124, TOTAL = 64, TARGET = 52;
function spin(stripId, entries, weight, resultIdx, duration, displayW) {
  const dw = displayW ? ((e, i) => displayW[i] ?? 1) : (() => 1);
  const strip = document.getElementById(stripId);
  const wrap = strip.parentElement;
  wrap.classList.remove("landed");
  strip.innerHTML = "";
  const tiles = [];
  for (let i = 0; i < TOTAL; i++) {
    let e = entries[weightedPick(entries, dw)];
    if (i === TARGET) e = entries[resultIdx];
    else if (i === TARGET - 1 || i === TARGET + 1) {              // 바로 옆칸은 결과와 다르게 (아슬아슬 연출)
      let guard = 0;
      while (e === entries[resultIdx] && guard++ < 10) e = entries[weightedPick(entries, dw)];
    }
    tiles.push(e);
    const d = document.createElement("div");
    d.className = "tile"; d.style.setProperty("--c", e.color);
    d.innerHTML = `${e.label}${e.sub ? `<small>${e.sub}</small>` : ""}`;
    strip.append(d);
  }
  const box = wrap.getBoundingClientRect();
  const offset = (Math.random() - .5) * (TILE - 30);                // 칸 안에서 랜덤 위치에 멈춤
  const target = TARGET * TILE + TILE / 2 - box.width / 2 + offset;
  strip.style.transition = "none";
  strip.style.transform = "translateX(0)";
  void strip.offsetWidth;
  strip.style.transition = `transform ${duration}ms cubic-bezier(.1,.75,.1,1)`;
  strip.style.transform = `translateX(${-target}px)`;
  return new Promise((res) => setTimeout(() => {
    wrap.classList.add("landed");
    strip.children[TARGET].classList.add("hit");
    res();
  }, duration + 80));
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function pull() {
  if (busy) return;
  busy = true;
  const btn = document.getElementById("btn");
  btn.disabled = true;
  reset();
  const b = BOXES[cur];

  // 1) 상자 흔들림 → 뚜껑 열림
  stage.classList.add("shake");
  await wait(600);
  stage.classList.add("open");
  await wait(700);

  // 2) 1차 룰렛: 등급 (확률 추첨은 먼저, 룰렛은 그 결과에 맞춰 멈춤)
  const tierIdx = weightedPick(b.tiers, (t) => t.p);
  const tier = b.tiers[tierIdx];
  document.getElementById("wrap1").classList.add("show");
  await wait(550);
  await spin("strip1", b.tiers, (t) => t.p, tierIdx, 5200, DISPLAY_W);
  stage.style.setProperty("--rare", tier.color);
  await wait(700);

  // 3) 2차 룰렛: 그 등급의 내용물 (등급 룰렛 위에 나타남)
  const items = tier.items.map((it) => ({ label: it.n, color: it.n === "꽝" ? "#3f3f46" : tier.color, sub: tier.label, w: it.w }));
  const itemIdx = weightedPick(items, (it) => it.w || 1);
  document.getElementById("wrap2").classList.add("show");
  await wait(550);
  await spin("strip2", items, (it) => it.w || 1, itemIdx, 3600);
  await wait(300);

  // 4) 결과
  const r = document.getElementById("result");
  r.innerHTML = `<span class="tier">${tier.label.toUpperCase()}</span><div class="name">${items[itemIdx].label}</div><div class="sub">${b.name} · ${b.cost}</div>`;
  r.classList.add("show");
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("div");
    s.className = "spark fly"; s.textContent = "✦"; s.style.color = tier.color;
    s.style.setProperty("--dx", (Math.cos(i / 10 * 6.283) * 150) + "px");
    s.style.setProperty("--dy", (Math.sin(i / 10 * 6.283) * 110) + "px");
    stage.append(s);
  }
  await wait(900);
  btn.disabled = false;
  busy = false;
}

selectBox("Normal");
</script>
