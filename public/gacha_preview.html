<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽑기 상자 프로토타입 v4</title>
<style>
:root { --rare: #8b8f98; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #f4f4f5; color: #18181b;
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  padding: 28px 16px 60px;
}
h1 { text-align: center; font-size: 1.35rem; margin: 0 0 18px; letter-spacing: -.02em; }
.wrap { max-width: 760px; margin: 0 auto; }

/* ── 상자 선택 탭 ── */
.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
.tabs button {
  border: 1.5px solid #e4e4e7; background: #fff; color: #52525b; border-radius: 999px;
  padding: 9px 18px; font-size: .9rem; font-weight: 700; cursor: pointer;
}
.tabs button.on { background: #18181b; color: #fff; border-color: #18181b; }
.tabs button.on.prem { background: linear-gradient(180deg, #f3d271, #c89b2a 60%, #a87e14); color: #2a1e00; border-color: #c89b2a; }

/* ── 스테이지 ── */
.stage { position: relative; }
.glow-bg {
  position: absolute; left: 50%; top: 60px; width: 420px; height: 420px; margin-left: -210px;
  border-radius: 50%; pointer-events: none; opacity: 0; z-index: 0;
  background: radial-gradient(circle, var(--rare) 0%, transparent 65%);
  transition: opacity .8s;
}
.open .glow-bg { opacity: .45; }

/* ── 상자 (3D) ── */
.box-area { position: relative; height: 230px; display: flex; align-items: flex-end; justify-content: center; z-index: 1; perspective: 900px; }
.box { position: relative; width: 220px; height: 140px; transform-style: preserve-3d; }
.shake .box { animation: shake .55s ease-in-out; }
@keyframes shake {
  0%,100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-7px) rotate(-3deg); }
  40% { transform: translateX(7px) rotate(3deg); }
  60% { transform: translateX(-5px) rotate(-2deg); }
  80% { transform: translateX(5px) rotate(2deg); }
}
.body {
  position: absolute; inset: 0; border-radius: 12px;
  background: linear-gradient(180deg, #ffffff, #e9e9ee); border: 2.5px solid #18181b;
  box-shadow: 0 18px 30px rgba(0,0,0,.18), inset 0 -14px 0 rgba(0,0,0,.06);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
}
.body .lock { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #18181b; position: relative; background: #fff; }
.body .lock::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 10px; margin: -3px 0 0 -2.5px; background: #18181b; border-radius: 2px; }
.body .name { font-size: .78rem; font-weight: 800; letter-spacing: .18em; color: #18181b; }
.lid {
  position: absolute; left: -6px; right: -6px; top: -26px; height: 40px; border-radius: 10px;
  background: linear-gradient(180deg, #ffffff, #e2e2e8); border: 2.5px solid #18181b;
  transform-origin: 50% 0%; transition: transform .7s cubic-bezier(.3,1.4,.5,1);
  box-shadow: 0 6px 14px rgba(0,0,0,.15);
}
.open .lid { transform: rotateX(-118deg); }
.beam {
  position: absolute; left: 50%; bottom: 100%; width: 120px; height: 0; margin-left: -60px;
  background: linear-gradient(180deg, transparent, var(--rare)); opacity: .55;
  clip-path: polygon(20% 100%, 80% 100%, 100% 0, 0 0); transition: height .6s ease-out .15s;
}
.open .beam { height: 180px; }
.inside {
  position: absolute; left: 10px; right: 10px; top: 8px; height: 40px; border-radius: 8px;
  background: radial-gradient(ellipse at 50% 100%, var(--rare), transparent 70%); opacity: 0; transition: opacity .5s .2s;
}
.open .inside { opacity: .8; }

/* 고급 상자 */
.prem .body { background: linear-gradient(180deg, #2a2723, #0f0d0b); border-color: #d9ab3c; box-shadow: 0 18px 30px rgba(0,0,0,.35), inset 0 -14px 0 rgba(255,255,255,.04); }
.prem .body .lock { border-color: #f3d271; background: #1a1714; }
.prem .body .lock::after { background: #f3d271; }
.prem .body .name { color: #f3d271; }
.prem .lid { background: linear-gradient(180deg, #f3d271, #c89b2a 60%, #a87e14); border-color: #7a5a0e; }

/* ── 룰렛 ── */
.stack { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; position: relative; z-index: 1; }
.roulette-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s ease; }
.roulette-wrap.show { grid-template-rows: 1fr; }
.roulette-wrap > div { overflow: hidden; }
.roulette-label { font-size: .74rem; font-weight: 700; color: #71717a; letter-spacing: .08em; margin: 2px 0 6px 4px; }
.roulette {
  position: relative; height: 104px; background: #fff; border: 2px solid #18181b; border-radius: 14px; overflow: hidden;
}
.roulette::before, .roulette::after {
  content: ""; position: absolute; left: 50%; margin-left: -9px; border: 9px solid transparent; z-index: 3;
}
.roulette::before { top: -2px; border-top: 12px solid #18181b; }
.roulette::after { bottom: -2px; border-bottom: 12px solid #18181b; }
.roulette .line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #18181b; opacity: .35; z-index: 2; }
.roulette .fade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, #fff 0%, transparent 18%, transparent 82%, #fff 100%); }
.strip { display: flex; height: 100%; padding: 8px 0; will-change: transform; }
.tile {
  flex: 0 0 116px; margin: 0 4px; border-radius: 10px; color: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; font-weight: 800; font-size: .95rem; letter-spacing: .04em;
  background: var(--c); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); transition: transform .35s, filter .35s;
}
.tile small { font-size: .68rem; font-weight: 600; opacity: .85; letter-spacing: 0; }
.landed .tile { filter: saturate(.4) brightness(.92); }
.landed .tile.hit { filter: none; transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--c), 0 8px 22px rgba(0,0,0,.25); }

.prem .roulette { background: #141210; border-color: #d9ab3c; }
.prem .roulette::before { border-top-color: #f3d271; } .prem .roulette::after { border-bottom-color: #f3d271; }
.prem .roulette .line { background: #f3d271; }
.prem .roulette .fade { background: linear-gradient(90deg, #141210 0%, transparent 18%, transparent 82%, #141210 100%); }
.prem .landed .tile.hit { box-shadow: 0 0 0 3px #141210, 0 0 0 5px var(--c), 0 8px 22px rgba(0,0,0,.5); }

/* ── 결과 카드 ── */
.result {
  margin: 22px auto 0; max-width: 360px; background: #fff; border: 2.5px solid var(--rare); border-radius: 18px;
  padding: 18px 22px; text-align: center; transform: scale(0); transition: transform .55s cubic-bezier(.2,1.7,.4,1);
  box-shadow: 0 14px 40px rgba(0,0,0,.18);
}
.result.show { transform: scale(1); }
.result .tier { display: inline-block; background: var(--rare); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: .72rem; font-weight: 800; letter-spacing: .12em; }
.result .name { font-size: 1.25rem; font-weight: 900; margin-top: 8px; }
.result .sub { font-size: .78rem; color: #71717a; margin-top: 4px; }

/* ── 버튼 ── */
.ctrl { text-align: center; margin-top: 22px; }
button.pull {
  border: 0; background: #18181b; color: #fff; border-radius: 12px; padding: 14px 42px; font-size: 1rem; font-weight: 800;
  cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.2); transition: transform .12s;
}
button.pull:active { transform: scale(.96); }
button.pull:disabled { opacity: .45; cursor: default; }
.prem button.pull { background: linear-gradient(180deg, #f3d271, #c89b2a 60%, #a87e14); color: #2a1e00; box-shadow: 0 6px 18px rgba(200,155,42,.45); }
.hint { color: #a1a1aa; font-size: .76rem; margin-top: 10px; }

/* 확률표 */
.odds { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.odds span { font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: #fff; background: var(--c); }

.spark { position: absolute; z-index: 5; pointer-events: none; font-size: 20px; opacity: 0; left: 50%; top: 120px; }
.spark.fly { animation: fly 1.1s ease-out forwards; }
@keyframes fly {
  0% { opacity: 1; transform: translate(0,0) scale(.5); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); }
}
</style>
</head>
<body>
<h1>🎁 뽑기 상자</h1>
<div class="wrap">
  <div class="tabs">
    <button id="tabNormal" class="on" onclick="selectBox('Normal')">일반 상자 · 200P</button>
    <button id="tabPremium" onclick="selectBox('Premium')">고급 상자 · 1,000원</button>
  </div>

  <div id="stage" class="stage">
    <div class="glow-bg"></div>
    <div class="box-area">
      <div class="box">
        <div class="beam"></div>
        <div class="body"><div class="lock"></div><div class="name" id="boxName">NORMAL BOX</div></div>
        <div class="inside"></div>
        <div class="lid"></div>
      </div>
    </div>

    <div class="stack">
      <!-- 2차 뽑기(내용물) — 등급 룰렛 위에 나타남 -->
      <div class="roulette-wrap" id="wrap2"><div>
        <div class="roulette-label">2차 · 내용물</div>
        <div class="roulette"><div class="line"></div><div class="fade"></div><div class="strip" id="strip2"></div></div>
      </div></div>
      <!-- 1차 뽑기(등급) -->
      <div class="roulette-wrap" id="wrap1"><div>
        <div class="roulette-label">1차 · 등급</div>
        <div class="roulette"><div class="line"></div><div class="fade"></div><div class="strip" id="strip1"></div></div>
      </div></div>
    </div>

    <div class="result" id="result"></div>

    <div class="ctrl">
      <button class="pull" id="btn" onclick="pull()">🎁 200P 뽑기</button>
      <div class="hint">뽑기를 누르면 상자가 열리고 룰렛이 돌아갑니다</div>
      <div class="odds" id="odds"></div>
    </div>
  </div>
</div>

<script>
/* ── 프로토타입 데이터 (확률·내용물은 임시값, 실제 구현 시 관리자에서 설정) ── */
const BOXES = {
  Normal: {
    name: "NORMAL BOX", cost: "200P", prem: false,
    tiers: [
      { label: "노말",   p: 60, color: "#8b8f98", items: [{ n: "100P" }, { n: "200P" }, { n: "50P" }] },
      { label: "레어",   p: 25, color: "#3b82f6", items: [{ n: "500P" }, { n: "잔액 1,000원" }] },
      { label: "에픽",   p: 12, color: "#8b5cf6", items: [{ n: "게임패스 1일권" }, { n: "잔액 3,000원" }] },
      { label: "레전드", p: 3,  color: "#f59e0b", items: [{ n: "잔액 10,000원" }, { n: "게임 1종 (1만원 이하)" }] },
    ],
  },
  Premium: {
    name: "PREMIUM BOX", cost: "1,000원", prem: true,
    tiers: [
      { label: "노말",   p: 45, color: "#8b8f98", items: [{ n: "300P" }, { n: "잔액 500원" }] },
      { label: "레어",   p: 30, color: "#3b82f6", items: [{ n: "잔액 1,500원" }, { n: "1,000P" }] },
      { label: "에픽",   p: 18, color: "#8b5cf6", items: [{ n: "게임패스 3일권" }, { n: "잔액 5,000원" }] },
      { label: "레전드", p: 7,  color: "#f59e0b", items: [{ n: "게임 1종 (2만원 이하)" }, { n: "잔액 20,000원" }, { n: "게임패스 7일권" }] },
    ],
  },
};

let cur = "Normal";
let busy = false;
const stage = document.getElementById("stage");

function selectBox(k) {
  if (busy) return;
  cur = k;
  const b = BOXES[k];
  document.getElementById("tabNormal").className = k === "Normal" ? "on" : "";
  document.getElementById("tabPremium").className = k === "Premium" ? "on prem" : "";
  stage.classList.toggle("prem", b.prem);
  document.getElementById("boxName").textContent = b.name;
  document.getElementById("btn").textContent = "🎁 " + b.cost + " 뽑기";
  document.getElementById("odds").innerHTML = b.tiers.map((t) =>
    `<span style="--c:${t.color}">${t.label} ${t.p}%</span>`).join("");
  reset();
}

function reset() {
  stage.classList.remove("open", "shake");
  stage.style.setProperty("--rare", "#8b8f98");
  for (const id of ["wrap1", "wrap2"]) document.getElementById(id).classList.remove("show");
  for (const id of ["strip1", "strip2"]) {
    const s = document.getElementById(id);
    s.style.transition = "none"; s.style.transform = "translateX(0)"; s.innerHTML = "";
    s.parentElement.classList.remove("landed");
  }
  document.getElementById("result").className = "result";
  stage.querySelectorAll(".spark").forEach((e) => e.remove());
}

/* 가중치 추첨 */
function weightedPick(list, w) {
  const total = list.reduce((a, x, i) => a + w(x, i), 0);
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) { r -= w(list[i], i); if (r < 0) return i; }
  return list.length - 1;
}

/* 룰렛 채우기 + 회전. entries[resultIdx]가 화살표에 걸리도록 */
const TILE = 124, TOTAL = 64, TARGET = 52;
function spin(stripId, entries, weight, resultIdx, duration) {
  const strip = document.getElementById(stripId);
  const wrap = strip.parentElement;
  wrap.classList.remove("landed");
  strip.innerHTML = "";
  const tiles = [];
  for (let i = 0; i < TOTAL; i++) {
    let e = entries[weightedPick(entries, weight)];
    if (i === TARGET) e = entries[resultIdx];
    else if (i === TARGET - 1 || i === TARGET + 1) {              // 바로 옆칸은 결과와 다르게 (아슬아슬 연출)
      let guard = 0;
      while (e === entries[resultIdx] && guard++ < 10) e = entries[weightedPick(entries, weight)];
    }
    tiles.push(e);
    const d = document.createElement("div");
    d.className = "tile"; d.style.setProperty("--c", e.color);
    d.innerHTML = `${e.label}${e.sub ? `<small>${e.sub}</small>` : ""}`;
    strip.append(d);
  }
  const box = wrap.getBoundingClientRect();
  const offset = (Math.random() - .5) * (TILE - 30);                // 칸 안에서 랜덤 위치에 멈춤
  const target = TARGET * TILE + TILE / 2 - box.width / 2 + offset;
  strip.style.transition = "none";
  strip.style.transform = "translateX(0)";
  void strip.offsetWidth;
  strip.style.transition = `transform ${duration}ms cubic-bezier(.1,.75,.1,1)`;
  strip.style.transform = `translateX(${-target}px)`;
  return new Promise((res) => setTimeout(() => {
    wrap.classList.add("landed");
    strip.children[TARGET].classList.add("hit");
    res();
  }, duration + 80));
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function pull() {
  if (busy) return;
  busy = true;
  const btn = document.getElementById("btn");
  btn.disabled = true;
  reset();
  const b = BOXES[cur];

  // 1) 상자 흔들림 → 뚜껑 열림
  stage.classList.add("shake");
  await wait(600);
  stage.classList.add("open");
  await wait(700);

  // 2) 1차 룰렛: 등급 (확률 추첨은 먼저, 룰렛은 그 결과에 맞춰 멈춤)
  const tierIdx = weightedPick(b.tiers, (t) => t.p);
  const tier = b.tiers[tierIdx];
  document.getElementById("wrap1").classList.add("show");
  await wait(550);
  await spin("strip1", b.tiers, (t) => t.p, tierIdx, 5200);
  stage.style.setProperty("--rare", tier.color);
  await wait(700);

  // 3) 2차 룰렛: 그 등급의 내용물 (등급 룰렛 위에 나타남)
  const items = tier.items.map((it) => ({ label: it.n, color: tier.color, sub: tier.label }));
  const itemIdx = weightedPick(items, (it) => it.w || 1);
  document.getElementById("wrap2").classList.add("show");
  await wait(550);
  await spin("strip2", items, (it) => it.w || 1, itemIdx, 3600);
  await wait(300);

  // 4) 결과
  const r = document.getElementById("result");
  r.innerHTML = `<span class="tier">${tier.label.toUpperCase()}</span><div class="name">${items[itemIdx].label}</div><div class="sub">${b.name} · ${b.cost}</div>`;
  r.classList.add("show");
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("div");
    s.className = "spark fly"; s.textContent = "✦"; s.style.color = tier.color;
    s.style.setProperty("--dx", (Math.cos(i / 10 * 6.283) * 150) + "px");
    s.style.setProperty("--dy", (Math.sin(i / 10 * 6.283) * 110) + "px");
    stage.append(s);
  }
  await wait(900);
  btn.disabled = false;
  busy = false;
}

selectBox("Normal");
</script>
</body>
</html>
