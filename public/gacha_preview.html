<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가챠 연출 프로토타입 v2</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(circle at 50% 0%, #ffffff, #ededf0 70%);
  color: #18181b;
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  display: flex; flex-direction: column; align-items: center; padding: 26px 8px 60px;
}
h1 { font-size: 1.2rem; letter-spacing: -.02em; margin: 0 0 20px; }
.row { display: flex; flex-wrap: nowrap; gap: 46px; justify-content: center; }
.machine-wrap { text-align: center; width: 320px; flex: none; }
.machine-title { font-weight: 800; font-size: 1.12rem; }
.machine-sub { color: #71717a; font-size: .82rem; margin: 3px 0 10px; }
.stage { position: relative; width: 320px; height: 470px; }
svg { overflow: visible; display: block; }

/* ── 머신 애니메이션 ── */
.machine { transform-origin: 160px 420px; }
.idle .machine { animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.shaking .machine { animation: shake .5s ease-in-out 2; }
@keyframes shake {
  0%,100% { transform: rotate(0); }
  20% { transform: rotate(-1.4deg); } 40% { transform: rotate(1.4deg); }
  60% { transform: rotate(-1deg); } 80% { transform: rotate(1deg); }
}
.knob-rot { transform-origin: 160px 330px; transition: transform 1.1s cubic-bezier(.55,0,.45,1); }
.cranking .knob-rot { transform: rotate(360deg); }
.pile { transform-origin: 160px 170px; }
.shaking .pile { animation: jiggle .28s ease-in-out 4; }
@keyframes jiggle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.coin-in { opacity: 0; transform: translateY(-40px); transition: all .45s ease-in; }
.coined .coin-in { opacity: 1; transform: translateY(0); }
.flap { transform-origin: 106px 384px; transition: transform .3s; }
.dropping .flap { transform: rotate(-38deg); }

/* ── 배출 캡슐 ── */
.out-capsule {
  position: absolute; left: 50%; bottom: 34px; width: 86px; height: 86px;
  margin-left: -43px; opacity: 0; cursor: pointer; z-index: 6;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.28));
}
.dropping .out-capsule { animation: drop 1s cubic-bezier(.32,0,.35,1.45) forwards; }
@keyframes drop {
  0%   { opacity: 0; transform: translateY(-130px) scale(.55) rotate(-40deg); }
  50%  { opacity: 1; transform: translateY(12px) scale(1) rotate(12deg); }
  72%  { transform: translateY(-18px) rotate(-7deg); }
  86%  { transform: translateY(4px) rotate(3deg); }
  100% { opacity: 1; transform: translateY(0) rotate(0); }
}
.pulse .out-capsule { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.opened .out-capsule { cursor: default; animation: none; }
.cap-top, .cap-bot { transition: transform .5s cubic-bezier(.6,-.25,.4,1.25), opacity .45s; }
.opened .cap-top { transform: translate(-20px,-56px) rotate(-34deg); opacity: 0; }
.opened .cap-bot { transform: translate(20px,40px) rotate(28deg); opacity: 0; }

/* ── 상품 공개 ── */
.prize {
  position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%) scale(0);
  background: #fff; border: 2.5px solid var(--rare,#d4d4d8); border-radius: 16px;
  padding: 15px 24px 14px; min-width: 185px; z-index: 7;
  box-shadow: 0 14px 40px rgba(0,0,0,.22);
  transition: transform .55s cubic-bezier(.2,1.7,.4,1);
}
.opened .prize { transform: translateX(-50%) scale(1); }
.prize .tier {
  display: inline-block; font-size: .68rem; font-weight: 800; letter-spacing: .14em;
  color: #fff; background: var(--rare); border-radius: 999px; padding: 2px 11px;
}
.prize .name { font-weight: 800; font-size: 1.06rem; margin-top: 7px; }
.glow {
  position: absolute; left: 50%; bottom: 40px; width: 190px; height: 190px;
  margin-left: -95px; border-radius: 50%; opacity: 0; z-index: 5; pointer-events: none;
  background: radial-gradient(circle, var(--rare) 0%, transparent 62%);
}
.opened .glow { animation: burst 1.1s ease-out; }
@keyframes burst {
  0% { opacity: 0; transform: scale(.25); }
  28% { opacity: .9; }
  100% { opacity: 0; transform: scale(2.3); }
}
.spark { position: absolute; z-index: 5; pointer-events: none; font-size: 18px; opacity: 0; }
.opened .spark { animation: fly 1s ease-out forwards; }
@keyframes fly {
  0% { opacity: 1; transform: translate(0,0) scale(.5); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2); }
}

button.pull {
  margin-top: 6px; width: 82%;
  border: none; border-radius: 12px; padding: 14px;
  font-size: .98rem; font-weight: 800; font-family: inherit; cursor: pointer;
  background: linear-gradient(180deg, #2c2c30, #111113);
  color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25), inset 0 1px 0 #ffffff22;
}
button.pull:active { transform: translateY(1px); }
button.pull:disabled { opacity: .45; }
.premium button.pull {
  background: linear-gradient(180deg, #f3d271, #c89b2a 60%, #a87e14);
  color: #2a1e00; box-shadow: 0 4px 16px rgba(200,155,42,.45), inset 0 1px 0 #ffffff88;
}
.hint { color: #a1a1aa; font-size: .76rem; margin-top: 9px; }

@media (max-width: 700px) {
  .row { gap: 0; }
  .machine-wrap { width: 175px; }
  .stage { transform: scale(.54); transform-origin: top center; height: 264px; width: 320px; margin-left: -72px; }
  button.pull { width: 96%; font-size: .82rem; padding: 11px; }
}
</style>
</head>
<body>
<h1>🎰 뽑기</h1>
<div class="row">

  <div class="machine-wrap" id="wrapNormal">
    <div class="machine-title">일반 뽑기</div>
    <div class="machine-sub">1회 5,000P · 포인트로 뽑기</div>
    <div class="stage idle" id="stageNormal"></div>
    <button class="pull" onclick="pull('Normal')">🪙 5,000P 뽑기</button>
    <div class="hint">캡슐이 나오면 눌러서 열어보세요</div>
  </div>

  <div class="machine-wrap premium" id="wrapPremium">
    <div class="machine-title">✨ 고급 뽑기</div>
    <div class="machine-sub">1회 3,000원 · 현금으로 뽑기</div>
    <div class="stage idle" id="stagePremium"></div>
    <button class="pull" onclick="pull('Premium')">💰 3,000원 뽑기</button>
    <div class="hint">캡슐이 나오면 눌러서 열어보세요</div>
  </div>

</div>

<script>
"use strict";

const CAP_COLORS = ["#ff6b81","#4fa8ff","#5fd07a","#ffc94d","#b07df0","#ff9c5f","#4ed6c9"];

function machineSVG(prem) {
  const id = prem ? "P" : "N";
  // 팔레트
  const bodyA   = prem ? "#3a3430" : "#ffffff";
  const bodyB   = prem ? "#171412" : "#d9dbe2";
  const trim    = prem ? "#d9ab3c" : "#26262b";
  const trimHi  = prem ? "#f6dd8d" : "#5c5c66";
  const faceA   = prem ? "#26211d" : "#f6f7fa";
  const faceB   = prem ? "#0f0d0b" : "#c9ccd6";
  const domeTint= prem ? "#fff3cf" : "#eaf3ff";

  // 캡슐 무더기 (뒤쪽 어둡게 → 앞쪽 밝게, 겹겹이)
  let pile = "";
  const rows = [ {y:196, n:6, r:17, dim:.55}, {y:172, n:5, r:18, dim:.75}, {y:146, n:4, r:19, dim:1} ];
  let ci = 0;
  for (const row of rows) {
    const w = (row.n - 1) * (row.r * 1.75);
    for (let i = 0; i < row.n; i++) {
      const x = 160 - w / 2 + i * (row.r * 1.75) + (Math.sin(ci * 7) * 4);
      const c = CAP_COLORS[ci++ % CAP_COLORS.length];
      pile += `
      <g opacity="${row.dim}">
        <circle cx="${x}" cy="${row.y}" r="${row.r}" fill="url(#capG${id}${ci})"/>
        <path d="M ${x-row.r} ${row.y} a ${row.r} ${row.r} 0 0 0 ${row.r*2} 0 z" fill="#ffffff" opacity=".92"/>
        <circle cx="${x}" cy="${row.y}" r="${row.r}" fill="none" stroke="#00000022"/>
        <ellipse cx="${x-row.r*.35}" cy="${row.y-row.r*.45}" rx="${row.r*.3}" ry="${row.r*.18}" fill="#fff" opacity=".8" transform="rotate(-25 ${x} ${row.y})"/>
      </g>
      <defs><radialGradient id="capG${id}${ci}" cx=".35" cy=".3" r="1">
        <stop offset="0%" stop-color="${c}" stop-opacity=".65"/>
        <stop offset="60%" stop-color="${c}"/>
        <stop offset="100%" stop-color="${c}" stop-opacity=".8"/>
      </radialGradient></defs>`;
    }
  }

  const sparkles = prem ? `
    <text x="52" y="120" font-size="15" fill="#f6dd8d" opacity=".9">✦</text>
    <text x="262" y="96" font-size="11" fill="#f6dd8d" opacity=".7">✦</text>
    <text x="248" y="248" font-size="13" fill="#f6dd8d" opacity=".8">✦</text>` : "";

  return `
  <svg width="320" height="470" viewBox="0 0 320 470">
    <defs>
      <linearGradient id="body${id}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="${bodyB}"/><stop offset="18%" stop-color="${bodyA}"/>
        <stop offset="55%" stop-color="${bodyA}"/><stop offset="100%" stop-color="${bodyB}"/>
      </linearGradient>
      <linearGradient id="face${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${faceA}"/><stop offset="100%" stop-color="${faceB}"/>
      </linearGradient>
      <linearGradient id="trim${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${trimHi}"/><stop offset="50%" stop-color="${trim}"/>
        <stop offset="100%" stop-color="${trimHi}"/>
      </linearGradient>
      <radialGradient id="glass${id}" cx=".38" cy=".28" r="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset="35%" stop-color="${domeTint}" stop-opacity=".35"/>
        <stop offset="100%" stop-color="${domeTint}" stop-opacity=".15"/>
      </radialGradient>
      <clipPath id="globe${id}"><circle cx="160" cy="150" r="92"/></clipPath>
      <radialGradient id="knob${id}" cx=".4" cy=".35" r="1">
        <stop offset="0%" stop-color="${trimHi}"/><stop offset="100%" stop-color="${trim}"/>
      </radialGradient>
    </defs>

    <!-- 바닥 그림자 -->
    <ellipse cx="160" cy="452" rx="118" ry="14" fill="#000" opacity=".16"/>

    <g class="machine">
      <!-- 받침대 -->
      <rect x="66" y="424" width="188" height="24" rx="10" fill="url(#trim${id})"/>
      <rect x="80" y="440" width="26" height="12" rx="5" fill="${trim}"/>
      <rect x="214" y="440" width="26" height="12" rx="5" fill="${trim}"/>

      <!-- 본체 -->
      <rect x="72" y="252" width="176" height="180" rx="22" fill="url(#body${id})" stroke="${trim}" stroke-width="4"/>
      <rect x="88" y="266" width="144" height="152" rx="14" fill="url(#face${id})" stroke="${trim}" stroke-width="2.5" opacity=".96"/>
      <!-- 본체 광택 -->
      <rect x="78" y="258" width="10" height="168" rx="5" fill="#fff" opacity="${prem ? .10 : .55}"/>

      <!-- 유리 글로브 -->
      <g class="pile" clip-path="url(#globe${id})">
        <circle cx="160" cy="150" r="92" fill="${prem ? "#14100c" : "#f2f6ff"}"/>
        ${pile}
      </g>
      <circle cx="160" cy="150" r="92" fill="url(#glass${id})"/>
      <circle cx="160" cy="150" r="92" fill="none" stroke="url(#trim${id})" stroke-width="7"/>
      <!-- 유리 하이라이트 -->
      <path d="M 96 122 a 74 74 0 0 1 42 -54" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".75"/>
      <circle cx="212" cy="92" r="5" fill="#fff" opacity=".8"/>
      <!-- 꼭대기 장식 -->
      <rect x="138" y="42" width="44" height="14" rx="7" fill="url(#trim${id})"/>

      <!-- 글로브-본체 연결 칼라 -->
      <rect x="92" y="238" width="136" height="20" rx="8" fill="url(#trim${id})"/>

      <!-- 코인 투입구 -->
      <g class="coin-in"><circle cx="222" cy="262" r="12" fill="#f3d271" stroke="#a87e14" stroke-width="3"/><rect x="219" y="255" width="6" height="14" rx="3" fill="#a87e14" opacity=".5"/></g>
      <rect x="204" y="276" width="36" height="50" rx="8" fill="url(#face${id})" stroke="${trim}" stroke-width="3"/>
      <rect x="219" y="286" width="7" height="30" rx="3.5" fill="${trim}"/>

      <!-- 손잡이 -->
      <circle cx="160" cy="330" r="37" fill="url(#face${id})" stroke="${trim}" stroke-width="4"/>
      <g class="knob-rot">
        <circle cx="160" cy="330" r="28" fill="url(#knob${id})"/>
        <rect x="151" y="300" width="18" height="60" rx="9" fill="${prem ? "#0f0d0b" : "#ffffff"}" stroke="${trim}" stroke-width="3"/>
      </g>
      <circle cx="160" cy="330" r="6" fill="${trim}"/>

      <!-- 배출구 -->
      <rect x="92" y="372" width="76" height="48" rx="11" fill="#000" opacity="${prem ? .78 : .88}" stroke="url(#trim${id})" stroke-width="4"/>
      <rect class="flap" x="98" y="380" width="64" height="34" rx="8" fill="${prem ? "#2a241f" : "#3a3a42"}"/>

      <!-- 명판 -->
      <rect x="186" y="384" width="50" height="24" rx="7" fill="url(#trim${id})"/>
      <text x="211" y="401" font-size="12" text-anchor="middle" fill="${prem ? "#2a1e00" : "#ffffff"}" font-weight="800">${prem ? "VIP" : "PLAY"}</text>
      ${sparkles}
    </g>
  </svg>`;
}

function capsuleSVG(color) {
  return `
  <svg width="86" height="86" viewBox="0 0 86 86">
    <defs>
      <radialGradient id="oc" cx=".35" cy=".3" r="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".55"/>
        <stop offset="65%" stop-color="${color}"/>
        <stop offset="100%" stop-color="${color}" stop-opacity=".85"/>
      </radialGradient>
    </defs>
    <g class="cap-bot">
      <path d="M 6 43 a 37 37 0 0 0 74 0 z" fill="#ffffff" stroke="#00000022" stroke-width="2"/>
      <path d="M 6 43 a 37 37 0 0 0 12 27 l 0 -27 z" fill="#e7e7ec"/>
    </g>
    <g class="cap-top">
      <path d="M 6 43 a 37 37 0 0 1 74 0 z" fill="url(#oc)" stroke="#00000022" stroke-width="2"/>
      <ellipse cx="29" cy="24" rx="11" ry="6" fill="#fff" opacity=".75" transform="rotate(-28 29 24)"/>
    </g>
    <rect x="4" y="41.4" width="78" height="3.2" rx="1.6" fill="#00000018"/>
  </svg>`;
}

const PRIZES = [
  { tier: "NORMAL",    name: "위로 포인트 500P", color: "#8b8f98" },
  { tier: "RARE",      name: "잔액 2,000원",     color: "#3b82f6" },
  { tier: "EPIC",      name: "게임패스 1일권",   color: "#8b5cf6" },
  { tier: "LEGENDARY", name: "🎮 풀게임 1종!",   color: "#f59e0b" },
];

for (const k of ["Normal", "Premium"]) {
  document.getElementById("stage" + k).innerHTML = machineSVG(k === "Premium");
}

const busy = {};
function pull(k) {
  if (busy[k]) return;
  busy[k] = true;
  const stage = document.getElementById("stage" + k);
  const btn = document.querySelector("#wrap" + k + " .pull");
  btn.disabled = true;
  stage.classList.remove("dropping", "opened", "pulse");
  for (const sel of [".out-capsule", ".prize", ".glow", ".spark"]) {
    stage.querySelectorAll(sel).forEach((el) => el.remove());
  }
  stage.classList.remove("idle");

  stage.classList.add("coined");                                        // 1) 코인
  setTimeout(() => stage.classList.add("cranking", "shaking"), 480);    // 2) 손잡이+흔들림
  setTimeout(() => {                                                    // 3) 캡슐 배출
    stage.classList.remove("coined", "cranking", "shaking");
    const roll = Math.random();
    const prize = PRIZES[roll > .93 ? 3 : roll > .75 ? 2 : roll > .45 ? 1 : 0];
    const capColor = CAP_COLORS[Math.floor(Math.random() * CAP_COLORS.length)];

    const cap = document.createElement("div");
    cap.className = "out-capsule";
    cap.innerHTML = capsuleSVG(capColor);
    const glow = document.createElement("div");
    glow.className = "glow";
    const card = document.createElement("div");
    card.className = "prize";
    card.innerHTML = `<span class="tier">${prize.tier}</span><div class="name">${prize.name}</div>`;
    stage.append(glow, cap, card);
    // 반짝이 파편
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("div");
      s.className = "spark";
      s.textContent = "✦";
      s.style.color = prize.color;
      s.style.left = "50%"; s.style.bottom = "70px";
      s.style.setProperty("--dx", (Math.cos(i / 8 * 6.283) * 95) + "px");
      s.style.setProperty("--dy", (-Math.sin(i / 8 * 6.283) * 95 - 30) + "px");
      stage.append(s);
    }
    stage.style.setProperty("--rare", prize.color);
    stage.classList.add("dropping");
    setTimeout(() => stage.classList.add("pulse"), 1100);               // 캡슐 두근두근

    const open = () => {                                                // 4) 개봉
      if (stage.classList.contains("opened")) return;
      stage.classList.remove("pulse");
      stage.classList.add("opened");
      setTimeout(() => { btn.disabled = false; busy[k] = false; stage.classList.add("idle"); }, 1000);
    };
    cap.addEventListener("click", open);
    setTimeout(open, 2600);
  }, 1750);
}
</script>
</body>
</html>
