<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가챠 연출 프로토타입</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #fafafa; color: #18181b;
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  display: flex; gap: 40px; justify-content: center; align-items: flex-start;
  padding: 40px 16px; flex-wrap: wrap;
}
.machine-wrap { text-align: center; width: 300px; }
.machine-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; }
.machine-sub { color: #71717a; font-size: .82rem; margin-bottom: 14px; }
.stage { position: relative; width: 300px; height: 400px; }
svg { overflow: visible; }

/* ── 머신 애니메이션 ── */
.machine { transform-origin: 150px 340px; }
.shaking .machine { animation: shake .55s ease-in-out 2; }
@keyframes shake {
  0%,100% { transform: rotate(0); }
  20% { transform: rotate(-1.6deg); } 40% { transform: rotate(1.6deg); }
  60% { transform: rotate(-1.2deg); } 80% { transform: rotate(1.2deg); }
}
.knob { transform-origin: 150px 296px; transition: transform 1s cubic-bezier(.5,0,.5,1); }
.cranking .knob { transform: rotate(360deg); }
.dome-cap { transform-origin: center; }
.shaking .dome-cap { animation: jiggle .3s ease-in-out 4; }
@keyframes jiggle {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
.coin { opacity: 0; transform: translateY(-36px); transition: all .45s ease-in; }
.coined .coin { opacity: 1; transform: translateY(0); }

/* ── 배출 캡슐 ── */
.out-capsule {
  position: absolute; left: 50%; bottom: 26px; width: 74px; height: 74px;
  margin-left: -37px; opacity: 0; cursor: pointer; z-index: 5;
}
.dropping .out-capsule { animation: drop .9s cubic-bezier(.3,0,.4,1.4) forwards; }
@keyframes drop {
  0%   { opacity: 0; transform: translateY(-120px) scale(.6) rotate(-30deg); }
  55%  { opacity: 1; transform: translateY(10px) scale(1) rotate(10deg); }
  75%  { transform: translateY(-14px) rotate(-6deg); }
  100% { opacity: 1; transform: translateY(0) rotate(0); }
}
.opened .out-capsule { cursor: default; }
.cap-top, .cap-bot { transition: transform .45s cubic-bezier(.6,-0.3,.4,1.3), opacity .4s; }
.opened .cap-top { transform: translate(-16px, -46px) rotate(-30deg); opacity: 0; }
.opened .cap-bot { transform: translate(16px, 34px) rotate(24deg); opacity: 0; }

/* ── 상품 공개 ── */
.prize {
  position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%) scale(0);
  background: #fff; border: 2px solid var(--rare, #d4d4d8); border-radius: 14px;
  padding: 14px 20px; min-width: 170px; z-index: 6;
  box-shadow: 0 10px 34px rgba(0,0,0,.18);
  transition: transform .5s cubic-bezier(.2,1.6,.4,1);
}
.opened .prize { transform: translateX(-50%) scale(1); }
.prize .tier { font-size: .7rem; font-weight: 800; letter-spacing: .1em; color: var(--rare); }
.prize .name { font-weight: 800; font-size: 1.05rem; margin-top: 2px; }
.glow {
  position: absolute; left: 50%; bottom: 30px; width: 150px; height: 150px;
  margin-left: -75px; border-radius: 50%; opacity: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(circle, var(--rare) 0%, transparent 65%);
}
.opened .glow { animation: burst 1s ease-out; }
@keyframes burst {
  0% { opacity: 0; transform: scale(.3); }
  30% { opacity: .8; }
  100% { opacity: 0; transform: scale(2.1); }
}
button.pull {
  margin-top: 14px; width: 100%;
  border: none; border-radius: 10px; padding: 13px;
  font-size: .95rem; font-weight: 800; font-family: inherit; cursor: pointer;
  background: #111; color: #fff;
}
button.pull:disabled { opacity: .5; }
.premium button.pull { background: linear-gradient(135deg, #b48811, #e8c356); color: #241a00; }
.hint { color: #a1a1aa; font-size: .76rem; margin-top: 8px; }
</style>
</head>
<body>

<div class="machine-wrap" id="wrapNormal">
  <div class="machine-title">일반 뽑기</div>
  <div class="machine-sub">1회 5,000P · 포인트로 뽑기</div>
  <div class="stage" id="stageNormal"></div>
  <button class="pull" onclick="pull('Normal')">🪙 5,000P 뽑기</button>
  <div class="hint">캡슐이 나오면 눌러서 열기</div>
</div>

<div class="machine-wrap premium" id="wrapPremium">
  <div class="machine-title">✨ 고급 뽑기</div>
  <div class="machine-sub">1회 3,000원 · 현금으로 뽑기</div>
  <div class="stage" id="stagePremium"></div>
  <button class="pull" onclick="pull('Premium')">💰 3,000원 뽑기</button>
  <div class="hint">캡슐이 나오면 눌러서 열기</div>
</div>

<script>
"use strict";

const CAPSULE_COLORS = [["#ef6a6a","#fff"],["#58a6e8","#fff"],["#67c576","#fff"],["#e8c356","#fff"],["#a678e0","#fff"],["#f0975f","#fff"]];

function machineSVG(premium) {
  const body = premium ? "#1c1917" : "#ffffff";
  const line = premium ? "#b48811" : "#111111";
  const accent = premium ? "#e8c356" : "#111111";
  const capsules = Array.from({length: 14}, (_, i) => {
    const [c1] = CAPSULE_COLORS[i % CAPSULE_COLORS.length];
    const x = 78 + (i % 5) * 30 + (Math.floor(i / 5) % 2) * 12;
    const y = 150 - Math.floor(i / 5) * 26 + (i % 3) * 4;
    return `<g><circle cx="${x}" cy="${y}" r="15" fill="${c1}"/>
      <path d="M ${x-15} ${y} a 15 15 0 0 1 30 0 z" fill="#fff" opacity=".85"/>
      <circle cx="${x}" cy="${y}" r="15" fill="none" stroke="#0003"/></g>`;
  }).join("");
  return `
  <svg width="300" height="400" viewBox="0 0 300 400">
    <g class="machine">
      <!-- 다리 -->
      <rect x="70" y="368" width="34" height="22" rx="6" fill="${line}"/>
      <rect x="196" y="368" width="34" height="22" rx="6" fill="${line}"/>
      <!-- 본체 -->
      <rect x="52" y="196" width="196" height="182" rx="20" fill="${body}" stroke="${line}" stroke-width="5"/>
      <!-- 유리돔 -->
      <g class="dome-cap">
        <path d="M 62 196 a 88 88 0 0 1 176 0 z" fill="${premium ? "#2a2622" : "#f4f6ff"}" stroke="${line}" stroke-width="5"/>
        <clipPath id="dome${premium ? "P" : "N"}"><path d="M 66 194 a 84 84 0 0 1 168 0 z"/></clipPath>
        <g clip-path="url(#dome${premium ? "P" : "N"})">${capsules}</g>
        <path d="M 84 176 a 66 66 0 0 1 36 -56" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".5"/>
        <rect x="132" y="106" width="36" height="12" rx="6" fill="${accent}"/>
      </g>
      <!-- 코인 투입구 -->
      <rect x="196" y="222" width="30" height="42" rx="6" fill="${premium ? "#0c0a09" : "#f4f4f5"}" stroke="${line}" stroke-width="3"/>
      <rect x="208" y="230" width="6" height="26" rx="3" fill="${line}"/>
      <g class="coin"><circle cx="211" cy="214" r="11" fill="#e8c356" stroke="#b48811" stroke-width="3"/></g>
      <!-- 손잡이 -->
      <g class="knob">
        <circle cx="150" cy="296" r="30" fill="${premium ? "#0c0a09" : "#f4f4f5"}" stroke="${line}" stroke-width="5"/>
        <rect x="143" y="272" width="14" height="48" rx="7" fill="${accent}"/>
      </g>
      <circle cx="150" cy="296" r="6" fill="${line}"/>
      <!-- 배출구 -->
      <rect x="74" y="326" width="64" height="40" rx="9" fill="#0008" stroke="${line}" stroke-width="4"/>
      <text x="230" y="352" font-size="15" text-anchor="middle" fill="${premium ? "#e8c356" : "#111"}" font-weight="800">${premium ? "✦" : "●"}</text>
    </g>
  </svg>`;
}

function capsuleSVG(color) {
  return `
  <svg width="74" height="74" viewBox="0 0 74 74">
    <g class="cap-bot"><path d="M 5 37 a 32 32 0 0 0 64 0 z" fill="#fff" stroke="#0002" stroke-width="2"/></g>
    <g class="cap-top"><path d="M 5 37 a 32 32 0 0 1 64 0 z" fill="${color}" stroke="#0002" stroke-width="2"/>
      <ellipse cx="26" cy="22" rx="9" ry="5" fill="#fff" opacity=".6" transform="rotate(-28 26 22)"/></g>
  </svg>`;
}

const PRIZES = [
  { tier: "일반", name: "위로 포인트 500P", color: "#9ca3af" },
  { tier: "레어", name: "잔액 2,000원", color: "#3b82f6" },
  { tier: "에픽", name: "게임패스 1일권", color: "#8b5cf6" },
  { tier: "전설", name: "🎮 풀게임 1종!", color: "#f59e0b" },
];

for (const k of ["Normal", "Premium"]) {
  document.getElementById("stage" + k).innerHTML = machineSVG(k === "Premium");
}

const busy = {};
function pull(k) {
  if (busy[k]) return;
  busy[k] = true;
  const stage = document.getElementById("stage" + k);
  const btn = document.querySelector("#wrap" + k + " .pull");
  btn.disabled = true;
  stage.classList.remove("dropping", "opened");
  stage.querySelector(".out-capsule")?.remove();
  stage.querySelector(".prize")?.remove();
  stage.querySelector(".glow")?.remove();

  // 1) 코인 투입
  stage.classList.add("coined");
  // 2) 손잡이 회전 + 흔들림
  setTimeout(() => { stage.classList.add("cranking", "shaking"); }, 450);
  // 3) 캡슐 배출
  setTimeout(() => {
    stage.classList.remove("coined", "cranking", "shaking");
    const roll = Math.random();
    const prize = PRIZES[roll > 0.93 ? 3 : roll > 0.75 ? 2 : roll > 0.45 ? 1 : 0];
    const [capColor] = CAPSULE_COLORS[Math.floor(Math.random() * CAPSULE_COLORS.length)];
    const cap = document.createElement("div");
    cap.className = "out-capsule";
    cap.innerHTML = capsuleSVG(capColor);
    const glow = document.createElement("div");
    glow.className = "glow";
    const card = document.createElement("div");
    card.className = "prize";
    card.innerHTML = `<div class="tier">${prize.tier}</div><div class="name">${prize.name}</div>`;
    for (const el of [glow, cap, card]) stage.appendChild(el);
    stage.style.setProperty("--rare", prize.color);
    stage.classList.add("dropping");
    // 4) 캡슐 클릭(또는 2.2초 후 자동)으로 개봉
    const open = () => {
      if (stage.classList.contains("opened")) return;
      stage.classList.add("opened");
      setTimeout(() => { btn.disabled = false; busy[k] = false; }, 900);
    };
    cap.addEventListener("click", open);
    setTimeout(open, 2200);
  }, 1600);
}
</script>
</body>
</html>
