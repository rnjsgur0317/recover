/* ═══════════════════════════════════════════════════════════════

     '봉인된 수수께끼의 E.G.O' → '무해하다'는 검사 → 조사하러 온 두 우주선(HP 777)이 E.G.O 가 터질 때마다 -5 → 봉인이 균열 → LOW HP → 방어막 → 드롭: 아우라 → 테이프 스톱

     0      S1 끝없는 격자 평원 위, 멀리 봉인 우리 속의 E.G.O — 떠다니는 복셀 파편 사이로 천천히 다가감
     2.46   S2 우리 앞: 바깥 큐브 우리 안에서 세 겹 큐브 윤곽이 느리게 돈다, 바닥에 스캔 격자가 번진다
     6.19   S3 바닥에서 올려다봄: 픽셀 소용돌이가 우리 밑에서 번지기 시작, 색이 바뀌기 시작
     9.88   S4 비트: 두 우주선이 들어와 공전(1P 추적 숏), E.G.O 가 박자마다 터지고 우주선은 -5
     14.8   S5 우주선 뒤에서: 비주얼라이저 고리가 바닥에서 솟고, 파편이 떠오른다
     19.73  S6 봉인 균열: 우리가 조각조각 떨어져 나가고 번개가 사방에서, HP 폭락 → 20.96 LOW HP → 22.19 방어막
     24.65  S7 드롭: 아우라 — 팔을 벌리고 떠 있는 복셀 플레이어와 가슴의 빛, 극도로 빠른 큐브, 화살표, 대폭발, 25.88 타이틀(박마다 맥동), HEALING → FULL HP
     28.34  테이프 스톱 → 29.5 끝
   패스: ① 레이마칭(우리 · 큐브 3겹 · 핵 · 우주선 · 복셀 플레이어 · 떠다니는 복셀) + 해석적 바닥(격자 · 픽셀 소용돌이 · 핵의 반사) + 비주얼라이저 막대 ② 2D 층(번개 · 폭발 파편 · HUD · 타이틀) ③ 블룸 ④ 최종
   무지개: 모든 요소가 같은 순간 같은 색(hueAt). 전부 시간의 함수(상태 없음). 시계·HUD·시작/종료 화면은 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t, eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
const h1 = (x) => { const v = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const BEAT = .30769, O = .034, BAR = BEAT * 4, bar = (n) => O + n * BAR;
const T = { S2: bar(2), S3: bar(5), KICK: bar(8), S5: bar(12), BUILD: bar(16), LOWHP: bar(17), SHIELD: bar(18), DROP: bar(20), TITLE: bar(21), HEAL: bar(21) + BEAT * 2, FULL: bar(22) + BEAT * 2, STOP: bar(23), END: 29.5 };
const EXPL = [bar(10), bar(12), bar(14), bar(15) + BEAT * 2, bar(16) + BEAT * 2, bar(17), bar(17) + BEAT * 2, bar(18), bar(18) + BEAT * 2, bar(19), bar(19) + BEAT * 2, bar(20), bar(20) + BEAT * 2, bar(21) + BEAT * 2, bar(22), bar(22) + BEAT * 2];
const D = window.PX2_DATA || { fps: 60, kick: [], hat: [], lvl: [], spec: "" };
const dat = (arr, t) => { const i = Math.floor(t * D.fps); return i < 0 || !arr.length ? 0 : arr[Math.min(arr.length - 1, i)]; };
const SPEC = new Float32Array(24);
function spectrum(t) { const n = D.spec.length / 24; if (!n) { SPEC.fill(.3); return SPEC; } const x = clamp(t * D.fps, 0, n - 1.001), i = Math.floor(x), k = x - i; for (let b = 0; b < 24; b++) SPEC[b] = lerp(parseInt(D.spec[i * 24 + b], 36), parseInt(D.spec[(i + 1) * 24 + b], 36), k) / 35; return SPEC; }

const hsl = (h, l, a = 1) => `hsla(${((h % 360) + 360) % 360},100%,${l}%,${a})`;
function hsv(h, sa, v) { h = ((h % 360) + 360) % 360 / 60; const c = v * sa, x = c * (1 - Math.abs(h % 2 - 1)), m = v - c, r = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x] : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x]; return [r[0] + m, r[1] + m, r[2] + m]; }
function hpAt(t) { if (t < T.KICK) return 777; if (t < T.BUILD) return 777 - 5 * EXPL.filter((e) => t >= e + .1).length; if (t < T.LOWHP) return Math.round(lerp(777 - 5 * EXPL.filter((e) => e < T.BUILD).length, 10, eIn(seg(t, T.BUILD, T.LOWHP)))); if (t < T.HEAL) return 10; if (t < T.FULL) return Math.round(lerp(10, 777, eOut(seg(t, T.HEAL, T.FULL)))); return 777; }
const hpText = (t) => (t >= T.FULL ? "FULL HP" : t >= T.HEAL ? "HEALING" : t >= T.SHIELD ? "FORCEFIELD TOGGLED" : t >= T.LOWHP ? "LOW HP" : String(hpAt(t)));

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm"), tcv = document.createElement("canvas"), tg = tcv.getContext("2d");
let Wd = 0, Hd = 0, U = 0, DPR = 1, DPR_CAP = 1.5, SCALE = .75, slow = 0, time = 0, X = null, P = {}, RT = {}, txtTex = null;

/* ═════════════════ 셰이더 ═════════════════ */
const FS_SCENE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uT, uFocal, uCore, uCage, uBreak, uShipK, uPlayer, uBars, uVortex, uDebris, uBob, uFlare, uGrey, uPulse; uniform vec3 uCamPos, uCol, uColW; uniform mat3 uCam, uCubeR[3]; uniform vec4 uShip[2]; uniform float uSpec[24]; uniform int uZero;
${CSGL.NOISE}
const vec3 C0 = vec3(0., 3.15, 0.);
float sdBox(vec3 p, vec3 b){ vec3 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, max(d.y, d.z)), 0.); }
float sdFrame(vec3 p, vec3 b, float e){ p = abs(p) - b; vec3 q = abs(p + e) - e;
  return min(min(length(max(vec3(p.x, q.y, q.z), 0.)) + min(max(p.x, max(q.y, q.z)), 0.), length(max(vec3(q.x, p.y, q.z), 0.)) + min(max(q.x, max(p.y, q.z)), 0.)), length(max(vec3(q.x, q.y, p.z), 0.)) + min(max(q.x, max(q.y, p.z)), 0.)); }
mat3 rotY3(float a){ float c = cos(a), s = sin(a); return mat3(c, 0., -s, 0., 1., 0., s, 0., c); }
vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
float ship(vec3 q){ float d = sdBox(q, vec3(.55, .1, .16)); d = min(d, sdBox(q - vec3(-.1, 0., 0.), vec3(.18, .04, .72))); d = min(d, sdBox(q - vec3(-.45, .12, 0.), vec3(.1, .12, .05))); d = min(d, sdBox(q - vec3(.55, 0., 0.), vec3(.18, .05, .07))); return d; }   // 복셀 우주선: 동체 · 날개 · 꼬리 · 기수
vec2 map(vec3 p){
  vec3 c = p - C0 - vec3(0., uBob, 0.); vec2 r = vec2(1e9, -1.); float dc = length(c);
  if (dc >= 3.1) r = vec2(dc - 3.05, -1.); else {
    if (uCage > .001){ float f = sdFrame(c, vec3(1.7), .06); if (uBreak > 0.){ vec3 id = floor(c * 1.6 + 7.); float h = hash(id.xy + id.z * 3.7); if (h < uBreak) f = 1e9; }                          // 봉인 우리: 균열이 진행되면 조각이 하나씩 사라진다
      r = opU(r, vec2(f, 1.)); }
    for (int i = uZero; i < 3; i++){ float s = i == 0 ? 1.05 : i == 1 ? .64 : .36; vec3 q = c * uCubeR[i]; r = opU(r, vec2(sdFrame(q, vec3(s), .028 + .008 * float(2 - i)), 2.)); }                                           // 큐브 윤곽 3겹
    r = opU(r, vec2(dc - .17 * (1. + .5 * uPulse) * uCore, 3.)); }
  if (uShipK > .001) for (int i = uZero; i < 2; i++){ vec3 q = rotY3(uShip[i].w) * (p - uShip[i].xyz); r = opU(r, length(q) < 1.2 ? vec2(ship(q) * .9, 4.) : vec2(length(q) - 1.15, -1.)); }
  if (uPlayer > .001){ vec3 q = p - vec3(0., 1.3 + .06 * sin(uT * 1.3), 0.); if (length(q) >= 1.4) r = opU(r, vec2(length(q) - 1.35, -1.)); else { float d = sdBox(q - vec3(0., .52, 0.), vec3(.13, .13, .13)); d = min(d, sdBox(q - vec3(0., .1, 0.), vec3(.2, .3, .11)));      // 복셀 플레이어: 팔을 벌리고 떠 있다
      d = min(d, sdBox(q - vec3(0., .3, 0.), vec3(.82, .06, .06))); d = min(d, sdBox(q - vec3(-.1, -.5, 0.), vec3(.08, .28, .09))); d = min(d, sdBox(q - vec3(.1, -.5, 0.), vec3(.08, .28, .09))); r = opU(r, vec2(d, 5.)); } }
  if (uDebris > .001){ float C = 2.4; vec3 id = floor(p / C), lp = p - (id + .5) * C; float h = hash(id.xy + id.z * 5.3); if (h > .62 && p.y > .4 && length(p.xz) > 2.6 && length(p - uCamPos) > 1.6){ float sz = .04 + .12 * hash(id.xz + 1.); vec3 o2 = (vec3(hash(id.xy + 2.), hash(id.yz + 3.), hash(id.xz + 4.)) - .5) * 1.4;   // 떠다니는 복셀 파편
      vec3 q = lp - o2 - vec3(0., sin(uT * .7 + h * 9.) * .12, 0.); r = opU(r, vec2(sdBox(q, vec3(sz)), 6.)); } }
  return r;
}
vec3 normalAt(vec3 p){ vec3 n = vec3(0.); for (int i = uZero; i < 4; i++){ vec3 e = .5773 * (2. * vec3(float(((i + 3) >> 1) & 1), float((i >> 1) & 1), float(i & 1)) - 1.); n += e * map(p + .0015 * e).x; } return normalize(n); }
vec3 bgCol(vec3 rd){ vec3 c = vec3(.002, .003, .008) + uCol * .01 * smoothstep(.4, -.1, rd.y); vec2 sp = vec2(atan(rd.z, rd.x), asin(clamp(rd.y, -1., 1.))) * 28.; vec2 id = floor(sp), f = fract(sp) - .5; float h = hash(id);
  c += uColW * step(.975, h) * smoothstep(.1, .0, length(f - (vec2(hash(id + 1.3), hash(id + 2.9)) - .5) * .6)) * (.15 + .6 * hash(id + 7.)) * (.5 + .5 * sin(uT * 2. + h * 40.)); return c; }
vec3 lightAt(vec3 p){ vec3 L = C0 + vec3(0., uBob, 0.); float d = length(L - p); return uCol * uCore * (1.8 + 4. * uFlare) / (1. + d * d * .35); }
vec3 shade(vec3 p, vec3 n, vec3 rd, float id){
  vec3 L = C0 + vec3(0., uBob, 0.), l = normalize(L - p); float ndl = max(dot(n, l), 0.), fres = pow(1. - max(dot(n, -rd), 0.), 3.), top = .5 + .5 * n.y; vec3 li = lightAt(p);
  if (id < 1.5) return vec3(.02, .025, .04) * (.3 + .7 * top) + li * ndl * .35 + uCol * (.08 + .5 * fres) * .6 + uColW * .12 * uPulse;                                   // 우리: 어두운 금속, 가장자리에 색
  if (id < 2.5) return uColW * (.75 + .7 * uPulse) + uCol * .6;                                                                                                          // 큐브 윤곽: 발광
  if (id < 3.5) return uColW * (2. + 2. * uPulse);                                                                                                                       // 핵
  if (id < 4.5) return vec3(.015, .02, .035) * (.3 + .7 * top) + li * ndl * .3 + uCol * (.15 + .9 * fres) + uColW * step(.6, fres) * .4;                                  // 우주선: 속이 빈 듯 어둡고 윤곽은 선명
  if (id < 5.5){ vec3 q = p - vec3(0., 1.6, 0.); float g = exp(-dot(q, q) * 7.); return vec3(.03, .035, .05) * (.3 + .7 * top) + li * ndl * .3 + uCol * (.1 + .6 * fres) + uColW * g * 2.5; }   // 플레이어: 복셀, 가슴에서 빛
  return vec3(.02, .025, .04) * (.3 + .7 * top) + li * ndl * .6 + uCol * (.06 + .6 * fres);                                                                             // 파편
}
vec3 floorCol(vec3 p, vec3 rd, float t){
  vec2 q = p.xz; float r = length(q), aa = t * 2.4 / uRes.y / max(-rd.y, .06), fade = exp(-r * .06);
  vec2 g = abs(fract(q * .5 - .5) - .5) / .5; float grid = smoothstep(aa * 1.2, 0., min(g.x, g.y)); vec3 col = vec3(.004, .005, .01) + uCol * grid * .05 * fade;
  float an = atan(q.y, q.x), sw = an + r * 1.3 - uT * (1.2 + 3. * uVortex), cell = floor(r * 3.5 - uT * (4. + 9. * uVortex)), secn = floor(sw / 6.2832 * 20.), h = hash(vec2(cell, secn));            // 픽셀 소용돌이: 순수 픽셀 칸이 빠르게 바깥으로 번진다
  float on = step(1. - .4 * uVortex - .08, h) * step(.3, fract(sw / 6.2832 * 20.)) * step(.18, fract(r * 3.5 - uT * (4. + 9. * uVortex))); col += uCol * on * (.3 + .7 * hash(vec2(cell, secn + 5.))) * fade * smoothstep(9., 1.5, r) * uVortex;
  col = mix(col, vec3(.003, .004, .008), smoothstep(2.6, 2.1, r) * .8);                                                                                                  // 아주 어두운 원반
  for (int i = uZero; i < 26; i++){ float fi = float(i), ph = uT * (1.6 + .6 * hash(vec2(fi, 1.))) + fi * .9, rr = .3 + 1.6 * hash(vec2(fi, 2.)), life = fract(uT * .45 + hash(vec2(fi, 3.))); vec2 pp = vec2(cos(ph), sin(ph)) * rr * (1. + .4 * life);   // 원반 위의 먼지
    col += uColW * smoothstep(.05, 0., length(q - pp)) * step(life, .8) * .6 * uVortex; }
  vec3 L = C0 + vec3(0., uBob, 0.), rr2 = reflect(rd, vec3(0., 1., 0.)); vec3 oc = p - L; float b = dot(oc, rr2), disc = b * b - dot(oc, oc) + .55 * .55;                         // 핵의 반사 (매끈한 바닥)
  float ref = disc > 0. ? exp(-max(-b - sqrt(disc), 0.) * .1) : 0.; col += mix(uCol, uColW, .5) * ref * .3 * uCore * (1. + 2. * uFlare) * pow(1. - max(-rd.y, 0.), 3.) + lightAt(p) * .06;
  return col;
}
void main(){
  vec2 s = (vUv - .5) * vec2(uRes.x / uRes.y, 1.) * 2.; vec3 ro = uCamPos, rd = normalize(uCam * vec3(s, uFocal)), col = bgCol(rd); float t = .05, id = -1., depth = 80.; bool hit = false;
  for (int i = uZero; i < 96; i++){ vec2 m = map(ro + rd * t); if (m.x < .0012 * t){ hit = true; id = m.y; break; } t += m.x * .9; if (t > 40.) break; }
  if (rd.y < -1e-4){ float tf = -ro.y / rd.y; if (tf > 0. && (!hit || tf < t)){ col = floorCol(ro + rd * tf, rd, tf); depth = tf; hit = false; t = tf; } }
  if (hit){ vec3 pp = ro + rd * t, n = normalAt(pp); col = shade(pp, n, rd, id); depth = t; }
  col = mix(col, bgCol(rd), 1. - exp(-depth * .03));
  if (uBars > .001){ float a2 = dot(rd.xz, rd.xz), b = dot(ro.xz, rd.xz), cc = dot(ro.xz, ro.xz) - 2.7 * 2.7, disc = b * b - a2 * cc;                                                 // 비주얼라이저: 반지름 2.7 원통 위의 막대 48개 (뒤쪽은 어둡게)
    if (disc > 0.){ float sq = sqrt(disc); for (int i = uZero; i < 2; i++){ float tb = (-b + (i == 0 ? sq : -sq)) / a2; if (tb < .05 || tb > depth) continue; vec3 p = ro + rd * tb; if (p.y < 0.) continue;
      float slot = atan(p.z, p.x) / 6.2832 * 48. + uT * .8, idx = floor(slot), fa = fract(slot) - .5, m = abs(mod(idx + 24., 48.) - 24.); int bi = int(min(m, 23.)); float hgt = (.08 + uSpec[bi] * (uPlayer > .5 ? .8 : 1.4) * (1. + .4 * uPulse)) * uBars, aa = tb * 2.4 / uRes.y;
      float cv = clamp((.32 - abs(fa)) * (6.2832 * 2.7 / 48.) / aa + .5, 0., 1.) * clamp((hgt - p.y) / aa + .5, 0., 1.), dk = i == 0 ? 1. : .35; col = mix(col, uColW * (.5 + .5 * p.y / hgt) * (.7 + .3 * uPulse) * dk, cv * .9); } } }
  { vec3 L = C0 + vec3(0., uBob, 0.), v = L - ro; float tc = max(dot(v, rd), 0.), d = length(v - rd * tc); col += uCol * uCore * (1. + 3. * uFlare) * (.03 / (d * d + .05)) * step(tc, depth + 2.); }                             // 핵의 빛이 안개에 번진다
  col = mix(col, vec3(dot(col, vec3(.33))), uGrey);
  o = vec4(max(col, 0.), 1.);
}`;
const FS_FINAL = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uBloom, uTxt; uniform vec2 uRes, uShake; uniform float uT, uZoom, uCA, uBloomK, uFlash, uFade, uStretch, uInvert, uBlock, uGlitch;
${CSGL.NOISE}
void main(){
  vec2 c = vUv - .5; vec2 uv = c / uZoom + .5 + uShake;
  if (uBlock > 1.5) uv = (floor(uv * uRes / uBlock) + .5) * uBlock / uRes;
  float tick = floor(uT * 24.), row = floor(uv.y * 40.), gr = hash(vec2(row, tick)); if (gr < uGlitch * .5) uv.x += (hash(vec2(row, tick + 3.)) - .5) * .14 * uGlitch;
  if (uStretch > 0.){ float rw = floor(uv.y * 90.), tk = floor(uT * 30.); uv.y = .5 + (uv.y - .5) * (1. - .6 * uStretch) + sin(uv.y * 40. + uT * 9.) * .02 * uStretch; uv.x += (hash(vec2(rw, tk)) - .5) * .12 * uStretch * step(.6, hash(vec2(rw, tk * .3))); }
  if (uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.){ o = vec4(0., 0., 0., 1.); return; }
  vec2 dir = uv - .5; float ca = uCA * (.3 + length(dir) * 1.8);
  vec3 col = vec3(texture(uScene, uv + dir * ca).r, texture(uScene, uv).g, texture(uScene, uv - dir * ca).b); vec3 bl = texture(uBloom, uv).rgb; col += bl * uBloomK;
