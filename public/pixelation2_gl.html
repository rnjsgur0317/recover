<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   ▣ PIXELATION ▣ V2 — 디지털 월드에 봉인된 E.G.O  (영화적 · 실시간 3D 레이마칭 · 대사 없음, 29.5초)
   한 장면처럼: 폭풍 구름 아래 끝없는 검은 평원, 하늘에 걸린 거대한 봉인 우리와 그 속의 E.G.O. 핵이 유일한 광원이라 구름·바닥·우리·우주선이 그 색으로 물들고,
   젖은 바닥에 비치고, 우리의 그림자가 땅에 드리운다. 시네마스코프(2.39:1) · 피사계 심도 · 아나모픽 플레어 · 필름 그레인.
   광고 문구는 화면에 쓰지 않고 구성의 뼈대로만: '봉인된 E.G.O' → '무해하다'는 검사 → 조사하러 온 두 우주선(HP 777)이 E.G.O 가 터질 때마다 -5 → 봉인 균열 → LOW HP → 방어막 → 드롭: 아우라 → 테이프 스톱
   음악: 195 BPM (박 0.30769s · 마디 1.2308s · 첫 박 0.034s), 28.34 테이프 스톱
     0      S1 평원의 낮은 카메라 — 안개 너머 거대한 우리, 천천히 전진 · 구름 속 번개
     2.46   S2 우리 밑에서 올려다봄(틸트 업) — 우리 속 세 겹 큐브가 느리게 돌고, 바닥에 우리의 그림자
     6.19   S3 우리 옆을 스치는 롱 트래킹 — 바닥에 픽셀 소용돌이가 번지기 시작
     9.88   S4 비트: 두 우주선이 카메라 위를 스쳐 지나 우리로 (플라이바이) · E.G.O 가 박자마다 터지고 우주선은 -5
     14.8   S5 우주선 뒤 추적 숏 — 거대한 기둥 비주얼라이저가 평원에서 솟는다
     19.73  S6 봉인 균열: 우리가 조각조각 떨어져 나가고 번개가 내리꽂힌다, HP 폭락 → LOW HP → 방어막
     24.65  S7 드롭: 평원에서 올려다본 완성된 아우라 — 우리가 사라지고 큐브가 극도로 빨리 돈다 · 25.88 타이틀
     27.11  과충전: 핵이 백열하며 부풀고, 파편이 빨려들고, 화면이 떨린다
     28.34  (마디 첫 박) 터짐: 발광 조각 · 바닥 충격파 · 평원 전체를 밝히는 섬광 → 화면이 픽셀로 부서져 흩어짐 → 29.5 끝
   패스: ① 레이마칭(우리 · 큐브 · 핵 · 우주선 · 파편 · 과충전 조각, 깊이 → 알파) + 바닥(반사 레이마칭 1회 · 핵을 향한 그림자 광선 · 픽셀 소용돌이) + 구름 하늘 + 기둥 비주얼라이저 ② 2D 층(번개 · 폭발 · HUD · 타이틀) ③ 블룸 · 갓레이 ④ 최종(DoF · 플레어 · 레터박스)
   무지개: 모든 것이 같은 순간 같은 색(hueAt) — 빛으로. 전부 시간의 함수(상태 없음). 시계·HUD·시작/종료 화면은 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t, eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
const h1 = (x) => { const v = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const BEAT = .30769, O = .034, BAR = BEAT * 4, bar = (n) => O + n * BAR;
const T = { S2: bar(2), S3: bar(5), KICK: bar(8), S5: bar(12), BUILD: bar(16), LOWHP: bar(17), SHIELD: bar(18), DROP: bar(20), TITLE: bar(21), HEAL: bar(21), FULL: bar(22) - BEAT * .5, OVER: bar(22), STOP: bar(23), END: 29.5 };   // STOP = 터지는 순간
const EXPL = [bar(10), bar(12), bar(14), bar(15) + BEAT * 2, bar(16) + BEAT * 2, bar(17), bar(17) + BEAT * 2, bar(18), bar(18) + BEAT * 2, bar(19), bar(19) + BEAT * 2, bar(20), bar(20) + BEAT * 2, bar(21) + BEAT * 2, bar(22), bar(22) + BEAT * 2];
const D = window.PX2_DATA || { fps: 60, kick: [], hat: [], lvl: [], spec: "" };
const dat = (arr, t) => { const i = Math.floor(t * D.fps); return i < 0 || !arr.length ? 0 : arr[Math.min(arr.length - 1, i)]; };
const SPEC = new Float32Array(24);
function spectrum(t) { const n = D.spec.length / 24; if (!n) { SPEC.fill(.3); return SPEC; } const x = clamp(t * D.fps, 0, n - 1.001), i = Math.floor(x), k = x - i; for (let b = 0; b < 24; b++) SPEC[b] = lerp(parseInt(D.spec[i * 24 + b], 36), parseInt(D.spec[(i + 1) * 24 + b], 36), k) / 35; return SPEC; }
const hueAt = (t) => 205 + 14 * Math.min(t, T.S3) + 45 * clamp(t - T.S3, 0, T.KICK - T.S3) + 80 * clamp(t - T.KICK, 0, T.BUILD - T.KICK) + 240 * clamp(t - T.BUILD, 0, T.DROP - T.BUILD) + 540 * Math.max(0, Math.min(t, T.STOP) - T.DROP);
const hsl = (h, l, a = 1) => `hsla(${((h % 360) + 360) % 360},100%,${l}%,${a})`;
function hsv(h, sa, v) { h = ((h % 360) + 360) % 360 / 60; const c = v * sa, x = c * (1 - Math.abs(h % 2 - 1)), m = v - c, r = h < 1 ? [c, x, 0] : h < 2 ? [x, c, 0] : h < 3 ? [0, c, x] : h < 4 ? [0, x, c] : h < 5 ? [x, 0, c] : [c, 0, x]; return [r[0] + m, r[1] + m, r[2] + m]; }
function hpAt(t) { if (t < T.KICK) return 777; if (t < T.BUILD) return 777 - 5 * EXPL.filter((e) => t >= e + .1).length; if (t < T.LOWHP) return Math.round(lerp(777 - 5 * EXPL.filter((e) => e < T.BUILD).length, 10, eIn(seg(t, T.BUILD, T.LOWHP)))); if (t < T.HEAL) return 10; if (t < T.FULL) return Math.round(lerp(10, 777, eOut(seg(t, T.HEAL, T.FULL)))); return 777; }
const hpText = (t) => (t >= T.FULL ? "FULL HP" : t >= T.HEAL ? "HEALING" : t >= T.SHIELD ? "FORCEFIELD TOGGLED" : t >= T.LOWHP ? "LOW HP" : String(hpAt(t)));
const C0 = [0, 9.5, 0];                                                                         // E.G.O 의 자리(하늘에 걸린 우리의 중심)

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm"), tcv = document.createElement("canvas"), tg = tcv.getContext("2d");
let Wd = 0, Hd = 0, U = 0, DPR = 1, DPR_CAP = 2, SCALE = 1, slow = 0, time = 0, X = null, P = {}, RT = {}, txtTex = null;

/* ═════════════════ 셰이더 ═════════════════ */
const FS_SCENE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uT, uFocal, uCore, uCage, uBreak, uShipK, uBars, uVortex, uDebris, uBob, uFlare, uGrey, uPulse, uSky, uOver, uBurst, uPull, uCubesK, uShock, uBoom; uniform vec3 uCamPos, uCol, uColW; uniform vec4 uFrag[24]; uniform vec3 uTang[32]; uniform mat3 uCam, uCubeR[3]; uniform vec4 uShip[2]; uniform float uSpec[24]; uniform int uZero;
${CSGL.NOISE}
const vec3 C0 = vec3(0., 9.5, 0.);
float sdBox(vec3 p, vec3 b){ vec3 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, max(d.y, d.z)), 0.); }
float sdFrame(vec3 p, vec3 b, float e){ p = abs(p) - b; vec3 q = abs(p + e) - e;
  return min(min(length(max(vec3(p.x, q.y, q.z), 0.)) + min(max(p.x, max(q.y, q.z)), 0.), length(max(vec3(q.x, p.y, q.z), 0.)) + min(max(q.x, max(p.y, q.z)), 0.)), length(max(vec3(q.x, q.y, p.z), 0.)) + min(max(q.x, max(q.y, p.z)), 0.)); }
mat3 rotY3(float a){ float c = cos(a), s = sin(a); return mat3(c, 0., -s, 0., 1., 0., s, 0., c); }
vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
float gE = 1e9; bool gShadow = false;                                                               // gE: 이번 map 호출에서 발광체까지의 최단 거리(주 레이마칭의 빛 누적용) · 그림자 광선은 가는 발광선을 무시
float sdSeg(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0., 1.)) - r; }
float sdEll(vec3 p, vec3 r){ float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.) / k1; }
/* 우주선(기수 +x): 유선형 동체 · 후퇴익 · 쌍수직꼬리 · 쌍엔진 → part: 0 동체, 1 캐노피(발광), 2 배기구(발광) */
float ship(vec3 q, out float part){
  float fus = sdEll(q - vec3(.05, 0., 0.), vec3(1.15, .19, .24)); vec3 w = q - vec3(-.3, -.03, 0.); w.x += abs(w.z) * .62; float wing = sdBox(w, vec3(.3 - .12 * abs(w.z), .025, 1.18)) - .01;
  vec3 f = vec3(q.x + .82, q.y - .22, abs(q.z) - .3); f.x += f.y * .7; float fin = sdBox(f, vec3(.17 - .1 * clamp(f.y / .2, 0., 1.), .2, .02)) - .006;
  vec3 e = vec3(q.x + .72, q.y + .04, abs(q.z) - .34); float eng = max(length(e.yz) - .095, abs(e.x) - .36) - .01; float can = sdEll(q - vec3(.38, .13, 0.), vec3(.34, .1, .12)), exh = max(length(e.yz) - .07, abs(e.x + .37) - .02);
  float d = min(min(fus, wing), min(fin, eng)); part = 0.; if (can < d){ d = can; part = 1.; } if (exh < d){ d = exh; part = 2.; } return d;
}
vec2 ego(vec3 c, float dc){                                                                          // E.G.O: 밀도 있는 발광 구조물
  if (dc > 4.3){ gE = min(gE, dc - 4.); return vec2(dc - 4.1, -1.); }
  float k = 1. - .12 * uOver, d = 1e9; vec3 q0 = c * uCubeR[0], q1 = c * uCubeR[1], q2 = c * uCubeR[2];
  d = min(d, sdFrame(q0, vec3(3.1 * k), .06)); d = min(d, sdFrame(q1, vec3(1.9 * k), .05)); d = min(d, sdFrame(q2, vec3(1.05 * k), .045));                                   // 큐브 3겹
  d = min(d, sdFrame(q0 * uCubeR[2], vec3(2.5 * k), .02)); d = min(d, sdFrame(q1 * uCubeR[0], vec3(1.45 * k), .018)); d = min(d, sdFrame(q2 * uCubeR[1], vec3(.72 * k), .016));  // 사이사이 가는 큐브 3겹
  float sz = 3.1 * k; d = min(d, sdSeg(q0, vec3(sz), -vec3(sz), .014)); d = min(d, sdSeg(q0, vec3(-sz, sz, sz), vec3(sz, -sz, -sz), .014)); d = min(d, sdSeg(q0, vec3(sz, -sz, sz), vec3(-sz, sz, -sz), .014)); d = min(d, sdSeg(q0, vec3(-sz, -sz, sz), vec3(sz, sz, -sz), .014));   // 몸통 대각선
  vec3 oa = abs(q1 * uCubeR[2]); float oc = 2.45 * k; d = min(d, min(sdSeg(oa, vec3(oc, 0., 0.), vec3(0., oc, 0.), .016), min(sdSeg(oa, vec3(0., oc, 0.), vec3(0., 0., oc), .016), sdSeg(oa, vec3(0., 0., oc), vec3(oc, 0., 0.), .016))));   // 팔면체
  vec3 wq = q2 * k; for (int i = uZero; i < 16; i++) d = min(d, sdSeg(wq, uTang[i * 2], uTang[i * 2 + 1], .01));                                                         // 엉킨 선
  float nd = min(min(length(abs(q0) - vec3(3.1 * k)) - .07, length(abs(q1) - vec3(1.9 * k)) - .055), min(length(abs(q2) - vec3(1.05 * k)) - .05, length(oa - vec3(oc, 0., 0.)) - .05));   // 꼭짓점 노드
  float core = dc - .5 * (1. + .5 * uPulse + 2.4 * uOver * uOver) * uCore; gE = min(gE, min(min(d, nd), core));
  return opU(vec2(min(d, nd), 2.), vec2(core, 3.));
}
vec2 map(vec3 p){
  gE = 1e9;
  vec3 c = p - C0 - vec3(0., uBob, 0.); vec2 r = vec2(1e9, -1.); float dc = length(c);
  if (dc >= 9.5) r = vec2(dc - 9.4, -1.); else {
    if (uCage > .001){ float f = sdFrame(c, vec3(5.2), .17); f = min(f, sdFrame(c, vec3(5.2, .12, 5.2), .1)); f = min(f, sdFrame(c, vec3(.12, 5.2, 5.2), .1));                                                   // 봉인 우리: 큰 틀 + 가운데를 가로지르는 띠
      if (uBreak > 0.){ vec3 id = floor(c * .7 + 7.); float h = hash(id.xy + id.z * 3.7); if (h < uBreak) f = 1e9; } r = opU(r, vec2(f, 1.)); }
    if (uCubesK > .01 && !gShadow) r = opU(r, ego(c, dc)); }
  if (uShipK > .001) for (int i = uZero; i < 2; i++){ vec3 q = rotY3(uShip[i].w) * (p - uShip[i].xyz); float lq = length(q); if (lq > 2.3){ r = opU(r, vec2(lq - 2.2, -1.)); gE = min(gE, lq - 2.); continue; }
    float part; float ds = ship(q, part); r = opU(r, vec2(ds * .9, part < .5 ? 4. : part < 1.5 ? 9. : 7.)); if (part > .5) gE = min(gE, ds);
    if (!gShadow){ float sp = uT * (1.6 + .4 * float(i)); vec3 a = rotY3(sp) * q; a.xy = mat2(cos(sp * .7), -sin(sp * .7), sin(sp * .7), cos(sp * .7)) * a.xy;               // 아우라: 도는 와이어 껍질 · 기울어진 고리
      float sh = sdFrame(a, vec3(1.3, .5, 1.3), .006), rg = length(vec2(length(vec3(q.x, q.y - q.x * .25, q.z).xz) - 1.8, q.y - q.x * .25)) - .012; float au = min(sh, rg); r = opU(r, vec2(au, 10.)); gE = min(gE, au + .05); } }
  if (uDebris > .001){ vec3 pd = C0 + (p - C0) * (1. + 2.5 * uPull); float C = 5.5, sc = 1. + 2.5 * uPull; vec3 id = floor(pd / C), lp = pd - (id + .5) * C; float h = hash(id.xy + id.z * 5.3);        // 떠다니는 복셀 파편 (과충전 때 핵으로 빨려들고, 터지면 밀려난다)
    if (h > .7 && pd.y > 1.5 && length(pd.xz) > 7. && length(p - uCamPos) > 3.){ float sz = .08 + .3 * hash(id.xz + 1.); vec3 o2 = (vec3(hash(id.xy + 2.), hash(id.yz + 3.), hash(id.xz + 4.)) - .5) * 3.5;
      vec3 q = lp - o2 - vec3(0., sin(uT * .5 + h * 9.) * .3, 0.); q = rotY3(h * 9. + uT * (.3 + h)) * q; r = opU(r, vec2(sdBox(q, vec3(sz)) / sc, 6.)); } }
  if (uBurst > 0.) for (int i = uZero; i < 24; i++){ vec4 f = uFrag[i]; if (f.w <= 0.) continue; vec3 q = p - f.xyz; float dq = length(q); if (dq > 3.){ r = opU(r, vec2(dq - 2.5, -1.)); continue; }     // 과충전 조각
    float hh = float(i) * 1.7; q = rotY3(hh + uBurst * (3. + float(i) * .3)) * q; q.yz = mat2(cos(hh * 2.), -sin(hh * 2.), sin(hh * 2.), cos(hh * 2.)) * q.yz; r = opU(r, vec2(sdBox(q, vec3(f.w)), 8.)); }
  return r;
}
vec3 normalAt(vec3 p){ vec3 n = vec3(0.); for (int i = uZero; i < 4; i++){ vec3 e = .5773 * (2. * vec3(float(((i + 3) >> 1) & 1), float((i >> 1) & 1), float(i & 1)) - 1.); n += e * map(p + .003 * e).x; } return normalize(n); }
float shadowTo(vec3 p, vec3 L){ vec3 d = L - p; float len = length(d); d /= len; float t = .3, k = 1.; gShadow = true; for (int i = uZero; i < 26; i++){ float h = map(p + d * t).x; if (h < .02){ gShadow = false; return 0.; } k = min(k, 10. * h / t); t += clamp(h, .15, 1.2); if (t > len - .8) break; } gShadow = false; return clamp(k, 0., 1.); }   // 핵을 향한 부드러운 그림자
vec3 sky(vec3 rd){ vec3 L = C0 + vec3(0., uBob, 0.); float y = max(rd.y, .02); vec2 q = rd.xz / y; float n = fbm(q * .06 + vec2(uT * .01, 0.)) * .6 + fbm(q * .18 - vec2(0., uT * .02)) * .4;                    // 폭풍 구름: 핵의 색으로 밑면이 물든다
  float cloud = smoothstep(.35, .75, n), lit = exp(-length(q) * .05) ; vec3 c = mix(vec3(.004, .005, .01), vec3(.012, .014, .022), cloud) + uCol * cloud * lit * (.4 + .6 * uFlare) * uCore + uColW * pow(max(dot(rd, normalize(L - uCamPos)), 0.), 60.) * .06 * uCore;
  return mix(c, vec3(.003, .004, .008), 1. - smoothstep(0., .12, rd.y)) * uSky + (1. - uSky) * vec3(.002, .003, .006); }
vec3 lightAt(vec3 p){ vec3 L = C0 + vec3(0., uBob, 0.); float d = length(L - p); return (uCol * uCore * uCubesK * (26. + 60. * uFlare + 110. * uOver * uOver) + mix(vec3(1.), uColW, .4) * uBoom * 28.) / (1. + d * d * .12); }
vec3 shade(vec3 p, vec3 n, vec3 rd, float id){
  vec3 L = C0 + vec3(0., uBob, 0.), l = normalize(L - p), hv = normalize(l - rd); float ndl = max(dot(n, l), 0.), ndv = max(dot(n, -rd), 0.), fres = .04 + .96 * pow(1. - ndv, 5.), top = .5 + .5 * n.y; vec3 li = lightAt(p), amb = vec3(.012, .014, .022) * (.3 + .7 * top);
  if (id < 1.5){ float sh = shadowTo(p + n * .05, L), rough = .3 + .35 * fbm(p.xy * 3. + p.z * 2.), spec = pow(max(dot(n, hv), 0.), mix(220., 24., rough)) * (1.2 - rough);                 // 우리: 거친 금속 — 결 · 스펙큘러 · 환경 반사
