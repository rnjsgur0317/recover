      if (u.uPort != null) gl.uniform2fv(u.uPort, S.port); if (u.uPortP != null) gl.uniform3fv(u.uPortP, S.portP); if (u.uAtlas != null) X.bindTex(4, atlasTex, u.uAtlas); if (u.uRunes != null) X.bindTex(6, runeTex, u.uRunes); if (u.uPortK != null) gl.uniform1fv(u.uPortK, S.portK);
      for (const [n, v] of [["uEyeK", S.eyeK], ["uFlash", S.flash], ["uShock", S.shock], ["uPower", S.power], ["uSpinA", S.spinA], ["uOrbI", S.orbI], ["uCrackK", S.crackK], ["uVoidK", S.voidK], ["uOrbK", S.orbK], ["uHornK", S.hornK], ["uCrownK", S.crownK], ["uHaloK", S.haloK], ["uTopK", S.topK], ["uRingK", S.ringK], ["uEmerge", S.emerge], ["uAnnihR", -1], ["uAuraK", S.auraK], ["uWispK", S.wispK], ["uSkyRing", S.skyRing], ["uRingA", S.ringA]]) f1(n, v); }); }
  const lp = intro ? [Wd / 2, Hd / 2] : proj(S, add(S.M, [0, 106 * ES, 0])), bloomTex = X.bloom(TG.tex, 1.1), raysTex = X.rays(lp ? clamp(lp[0] / Wd) : .5, lp ? clamp(1 - lp[1] / Hd) : .9, .92), r0 = rng(Math.floor(t * 60)), hit = S.shake;
  X.pass(P.final(), null, (u2) => { X.bindTex(0, TG.tex, u2.uScene); X.bindTex(1, bloomTex, u2.uBloom); X.bindTex(2, txtTex, u2.uTxt); X.bindTex(3, raysTex, u2.uRays); gl.uniform2f(u2.uRes, pw, ph); gl.uniform1f(u2.uT, t);
    gl.uniform2f(u2.uShake, (r0() - .5) * hit * .02, (r0() - .5) * hit * .02); gl.uniform1f(u2.uZoom, 1 + .02 * hit + .05 * S.trans); gl.uniform1f(u2.uCA, .0012 + .005 * hit);
    for (const [n, v] of [["uBloomK", S.bloom], ["uRayK", lp ? S.rays : 0], ["uFocus", S.focus], ["uAper", S.aper], ["uFlash", .12 * S.flash * S.flash], ["uFade", S.fade], ["uGrainK", $("cs").classList.contains("rec") ? .4 : 1],
      ["uBlock", 1 + Math.round(Math.pow(S.trans, 1.5) * 34) * ph / 1080], ["uTrans", S.trans], ["uCold", 0], ["uWarm", 0], ["uHeat", 0]]) if (u2[n] != null) gl.uniform1f(u2[n], v); });
}
