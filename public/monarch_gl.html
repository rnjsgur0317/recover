/* ═════════════════ 2D: 검은 · 보라 번개 · 제목 ═════════════════ */

/* ═════════════════ 연출: 시각 t → 장면 · 카메라 (순수 함수) ═════════════════ */

const player = CSUI.create({
  stage: $("cs"), audio: bgm, volume: .9, duration: T.END, theme: "monarch", capBlend: false, recW: 3840, recH: 2160, maxMB: 100,
  no: "08", title: "MONARCH", sub: "모나크", hero: "/thumbs/monarch_hero.jpg",
  tagline: "어둠의 옥좌에 앉은 거대한 지배자.\n왕관 위의 두 후광, 흰 별을 품은 구슬 — 모든 것이 그 아래에 있다.",
