<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복구센터</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1>복구센터</h1>
    <div class="domain">구매한 게임의 만료된 다운로드 링크를 복구해드립니다</div>
  </header>

  <div class="choice">
    <a href="/login?as=user" class="dark">
      <div class="t">유저 로그인</div>
      <div class="d">디스코드 계정으로 로그인하고 링크 복구를 요청하세요.<br>구매 이력이 있는 계정만 이용할 수 있습니다.</div>
    </a>
    <a href="/login?as=admin">
      <div class="t">관리자 로그인</div>
      <div class="d">사장님 전용입니다.</div>
    </a>
  </div>

  <div class="card" style="margin-top:28px">
    <h2>이용 안내</h2>
    <p class="desc" style="margin:0">
      1. 유저 로그인 후 복구할 게임 이름으로 요청을 남깁니다.<br>
      2. 관리자가 확인하면 <b>디스코드 DM으로 새 링크가 도착합니다.</b><br>
      3. DM이 차단돼 있으면 링크를 받을 수 없으니 서버 멤버 DM을 허용해주세요.
    </p>
  </div>

  <div class="footer">복구센터 · 디스코드 게임샵</div>
</div>
</body>
</html>
