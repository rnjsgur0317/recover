<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H Company</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1>H Company</h1>
    <div class="domain">디스코드 게임샵 통합 홈페이지</div>
  </header>

  <div class="choice">
    <a href="/login?as=user" class="dark">
      <div class="t">유저 로그인</div>
      <div class="d">디스코드 계정으로 간편하게 로그인하세요.</div>
    </a>
    <a href="/login?as=admin">
      <div class="t">관리자 로그인</div>
      <div class="d">운영진 전용입니다.</div>
    </a>
  </div>

  <div class="card" style="margin-top:28px">
    <h2>이용 가능한 서비스</h2>
    <p class="desc" style="margin:0">
      <b>링크 복구</b> — 구매한 게임의 만료된 다운로드 링크를 복구 요청하면,
      관리자 확인 후 디스코드 DM으로 새 링크를 보내드립니다. (구매내역 캡쳐 필요)<br>
      <span style="color:#b0b0b8">더 많은 기능이 순차적으로 추가될 예정입니다.</span>
    </p>
  </div>

  <div class="footer">H Company · 문의는 디스코드 서버에서</div>
</div>
</body>
</html>
