"use strict";
/* ═══════════════════════════════════════════════════════════════
   [ LUMINOSITY ] 광휘 — 전면 재제작판 (WebGL2, 컷 편집)
   화면은 전부 셰이더로 그린다: 일식 코로나(솔) · 금속 질감 SDF 무기(베벨/스펙큘러/각인 발광) · 도메인 워핑 혼돈 연기 ·
   삼각 파편 파쇄 · 휜 빛가시 · 빛기둥 · 아나모픽 플레어. 2D 캔버스는 타이틀 글자 텍스처에만 쓴다.
   컷 구성 (사운드 타격점에 맞춤)
     A 0~6.0      솔의 일식 코로나 아래, 일곱 무기가 원초의 혼돈으로 내리꽂힌다 (3.13 파쇄 → 붕괴)
     B 6.0~8.3    남겨진 파편 — 혼돈의 씨앗 매크로 숏
     C 8.3~10.4   일곱 무기에 의식이 깃들고(8.65), 솔이 잠든다(9.66)
     D 10.4~14.77 무기별 클로즈업 — 타격점마다 하나씩 산산조각 (중간 11.62~12.5 는 전경)
     E 14.77~19.62 홀로 남은 검 — 16.44 혼돈이 조여 오고, 검신에 빛이 차오른다
     F 19.62~24.52 점화 — 부서진 여섯 무기가 휜 빛가시로 돌아온다
     G 24.52~     타이틀
   상태가 없다(모든 것이 시간의 함수) → 탐색·정지 화면이 그대로 재현된다. 시계·HUD·자막은 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t;
const eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const T = { HIT1: 3.13, FORGE: 6.0, CUT_C: 8.3, AWAKE: 8.65, SOLFADE: 9.66, BREAKS: [10.59, 11.26, 12.82, 13.37, 13.89, 14.33], ONE: 14.77, SURGE: 16.44,
  IGNITE: 19.62, WINGS: [19.62, 19.9, 20.22, 20.46, 21.07, 21.44], FINAL: 24.52, FADE: 26.5, END: 28.1 };
/* 무기 id: 0 검 · 1 창 · 2 도끼 · 3 망치 · 4 낫 · 5 지팡이 · 6 활.  전경(C)의 자리 순서는 셰이더의 SLOT_ID = [5,2,1,0,4,3,6] */
const BREAKS = [                                       // 클로즈업: 시작·끝, 무기, 기울기, 연기 방향, 타격점(무기 좌표 y), 화면 위치
  { a: 10.4, b: 10.95, id: 3, rot: .72, dir: .4, iy: 1.45, x: -.7, y: .5 },
  { a: 10.95, b: 11.62, id: 2, rot: -.62, dir: 2.8, iy: 1.2, x: .9, y: .3 },
  { a: 12.5, b: 13.1, id: 6, rot: .3, dir: -1.2, iy: 0, x: .4, y: 0 },
  { a: 13.1, b: 13.63, id: 5, rot: -.85, dir: 1.9, iy: 1.7, x: .7, y: .6 },
  { a: 13.63, b: 14.11, id: 4, rot: .55, dir: 3.6, iy: 1.6, x: -.9, y: .5 },
  { a: 14.11, b: 14.77, id: 1, rot: -.42, dir: -.3, iy: 1.8, x: .4, y: .7 },
];
const WIDE = { a: 11.62, b: 12.5 };
const CAPS = [
  { a: .45, b: 3.0, s: "“들으라, 나의 무기들이여.\n혼돈의 씨앗을 찾아내어, 혼돈의 물결을 정화하라.”" },
  { a: 3.5, b: 5.7, s: "원초적인 혼돈의 시대는 솔의 손에 종말을 고했다." },
  { a: 6.1, b: 8.15, s: "그러나 혼돈의 파편은 세상에 남았고," },
  { a: 8.4, b: 10.3, s: "솔은 자신의 무기에 의식을 부여해, 유산으로 남겼다." },
  { a: 10.8, b: 14.5, s: "혼돈은 예상보다 빠르게 자라났다.\n무기들은 하나씩 부서졌고 —" },
  { a: 14.95, b: 17.3, s: "마침내, 단 하나만 남았다." },
  { a: 17.55, b: 19.45, s: "가장 밝은 빛을 품은 검." },
  { a: 20.0, b: 24.1, s: "솔의 마지막 유산이자,\n그가 잠든 무덤으로 통하는 유일한 열쇠." },
];

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm");
const tcv = document.createElement("canvas"), tg = tcv.getContext("2d");      // 타이틀 글자 텍스처 (R 제목 · G 부제 · B 장식선)
const D = window.LUM_DATA || { fps: 30, total: [], high: [], onsets: [] };
let W = 0, H = 0, DPR = 1, DPR_CAP = 1.5, slow = 0, time = 0, X = null, P = {}, RT = {}, seedVAO = null, textTex = null, atlas = null;
function band(arr, t) { const i = t * D.fps, i0 = Math.floor(i); if (i0 < 0 || !arr.length) return .3; const a = arr[Math.min(arr.length - 1, i0)], b = arr[Math.min(arr.length - 1, i0 + 1)]; return a + (b - a) * (i - i0); }
const vol = (t) => clamp(band(D.total, t) * 1.6);

/* ═════════════════ 셰이더 ═════════════════ */
const GLSL_SDW = `float sdBox(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
float sdRhomb(vec2 p, vec2 b){ p = abs(p); return (p.x / b.x + p.y / b.y - 1.) * min(b.x, b.y) * .75; }
/* ── 무기 SDF (무기 좌표: 길이 방향 +y, 전체 길이 약 4.3) ── */
float sdW(int id, vec2 p, out float gem, out float core){
  float d;
  if (id == 0){                                                             // 검
    float w = .21 * clamp((2.3 - p.y) / .66, 0., 1.);
    float blade = max(max(abs(p.x) - w, -(p.y + .78)), p.y - 2.3) * .9;
    float guard = sdBox(vec2(abs(p.x), p.y + .8 - .32 * p.x * p.x), vec2(.68, .085)) - .02;
    float grip = sdBox(p - vec2(0., -1.32), vec2(.075, .46)), pommel = sdRhomb(p - vec2(0., -1.9), vec2(.18, .21));
    d = min(min(blade, guard), min(grip, pommel)); gem = length(p - vec2(0., -.8)) - .1;
    core = length(vec2(p.x, max(max(-.55 - p.y, p.y - 1.95), 0.)));
  } else if (id == 1){                                                      // 창
    float shaft = sdBox(p - vec2(0., -.35), vec2(.06, 1.85)), head = sdRhomb(p - vec2(0., 1.85), vec2(.29, .72));
    float wing = sdBox(vec2(abs(p.x), p.y - 1.2 - .5 * abs(p.x)), vec2(.34, .055));
    d = min(min(shaft, head), wing); gem = length(p - vec2(0., 1.2)) - .07;
    core = length(vec2(p.x, max(max(1.4 - p.y, p.y - 2.3), 0.)));
  } else if (id == 2){                                                      // 도끼
    float shaft = sdBox(p - vec2(0., -.2), vec2(.065, 2.));
    float c1 = length(p - vec2(-.1, 1.2)) - .95, c2 = length(p - vec2(-.78, 1.2)) - .9, blade = max(max(c1, -c2), .04 - p.x);
    d = min(shaft, blade); gem = length(p - vec2(0., 1.2)) - .08; core = max(abs(c1 + .06), blade);
  } else if (id == 3){                                                      // 망치
    float shaft = sdBox(p - vec2(0., -.25), vec2(.07, 1.9)), head = sdBox(p - vec2(0., 1.5), vec2(.6, .32)) - .05;
    d = min(shaft, head); gem = length(p - vec2(0., 1.5)) - .1; core = abs(sdBox(p - vec2(0., 1.5), vec2(.42, .17)));
  } else if (id == 4){                                                      // 낫
    float shaft = sdBox(p - vec2(0., -.15), vec2(.06, 2.05));
    float c1 = length(p - vec2(.75, .95)) - 1.2, c2 = length(p - vec2(.8, .54)) - 1.3, blade = max(max(c1, -c2), -p.x);
    d = min(shaft, blade); gem = length(p - vec2(0., 1.97)) - .075; core = max(abs(c2 - .045), blade);
  } else if (id == 5){                                                      // 지팡이
    float shaft = sdBox(p - vec2(0., -.45), vec2(.06, 1.75)), rr = length(p - vec2(0., 1.72));
    gem = rr - .15; d = min(min(shaft, abs(rr - .42) - .075), gem); core = abs(rr - .42);
  } else {                                                                  // 활
    p.x += .2; float rr = length(p - vec2(-1.3, 0.)) - 2.;
    float arc = max(abs(rr) - .08, abs(p.y) - 1.75), str = sdBox(p - vec2(-.33, 0.), vec2(.02, 1.75));
    gem = length(p - vec2(.7, 0.)) - .09; d = min(min(arc, str), gem - .02); core = max(abs(rr), abs(p.y) - 1.75);
  }
  return d;
}
`;
const FS_ATLAS = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform int uId;
${GLSL_SDW}
void main(){ float gem, core; float d = sdW(uId, (vUv - .5) * 5.4, gem, core); o = vec4(d, gem, core, 1.); }`;
const FS_SCENE = (shot) => `#version 300 es
#define SHOT ${shot}
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uT, uRoll, uMood, uTaint; uniform vec3 uCam; uniform float uK[12]; uniform float uWing[6]; uniform sampler2D uText, uAtlas;
${CSGL.NOISE}
#define PI 3.14159265
const vec3 LIGHT = vec3(.72, .86, 1.), GOLD = vec3(1., .9, .72), MAG = vec3(1., .1, .62);
const int SLOT_ID[7] = int[7](5, 2, 1, 0, 4, 3, 6);
vec2 SP;                                                                   // 화면 좌표 (세로 10단위, 위가 +y)
vec2 rotv(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c * v.x - s * v.y, s * v.x + c * v.y); }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p + 37.7)); }
vec2 world(float depth){ return rotv(SP, uRoll) / mix(1., uCam.z, depth) + uCam.xy * depth; }   // depth 1 = 피사체, 작을수록 먼 배경(시차)

/* ── 우주 ── */
float starLayer(vec2 p, float scale, float thr){
  vec2 g = p * scale, id = floor(g), f = fract(g) - .5; float r = hash(id + 7.1); if (r < thr) return 0.;
  vec2 pos = (hash2(id) - .5) * .7; float d = length(f - pos), b = pow((r - thr) / (1. - thr), 3.), size = mix(.028, .075, b);
  float tw = .72 + .28 * sin(uT * (1.5 + 4. * hash(id + 3.3)) + r * 40.);
  return exp(-d * d / (size * size)) * (.12 + 1.9 * b) * tw;
}
vec3 background(){
  vec2 pf = world(.1), pm = world(.28);
  vec2 q = pf * .2; q += .55 * vec2(fbm(q * 1.6 + uT * .008), fbm(q * 1.6 + 4.7));
  float n = fbm(q * 1.3), n2 = fbm(q * 2.2 + 9.);
  vec3 col = vec3(.0012, .0016, .005);
  col += vec3(.004, .012, .04) * smoothstep(.3, .8, n) * 1.4 + vec3(.016, .006, .034) * smoothstep(.48, .9, n2);
  col = mix(col, col * vec3(2.2, .5, 1.7) + vec3(.004, 0., .005), uTaint * .8);                  // 혼돈에 물든 하늘
  col += (vec3(.02, .045, .11) * n + vec3(.07, .05, .02) * n2 * n) * uMood;                       // 점화 뒤: 푸른 새벽빛
  float st = starLayer(pf, 2.2, .68) + starLayer(pf + 13.7, 4.6, .8) * .5 + starLayer(pm + 5.1, 1.25, .88) * 1.4;
  return col * .7 + vec3(.75, .85, 1.) * st * (.42 - .25 * uTaint);
}

/* ── 혼돈의 연기 ── */
vec2 smokeField(vec2 p){
  vec2 w = p * .33; w += .75 * vec2(fbm(w * 1.5 + vec2(uT * .06, 0.)), fbm(w * 1.5 + vec2(5.2, -uT * .05)));
  float n = fbm(w * 1.6 + vec2(0., uT * .04)), v = 1. - abs(2. * noise(w * 3.1 + vec2(uT * .1, 2.)) - 1.);
  return vec2(n, pow(v, 22.) * .2 + smoothstep(.5, 1., v) * .16);             // 가는 핏줄은 약하게, 틈새의 은은한 빛을 더 크게
}
vec3 smokeCol(vec2 sf, float dens){
  float beat = .6 + .4 * sin(uT * 2.3);
  vec3 c = mix(vec3(.003, .0008, .008), vec3(.03, .01, .055), smoothstep(.3, .78, sf.x));   // 어두운 보랏빛 연기 덩어리 (빛나는 건 가는 핏줄뿐)
  return c + MAG * sf.y * beat * .13 + vec3(.05, .006, .05) * dens * (1. - dens) * 2.;
}

/* ── 솔: 일식 코로나 ── */
vec3 corona(vec2 p, vec2 c, float R, float pw){
  vec2 v = p - c; float r = length(v), x = (r - R) / R; vec2 dn = v / max(r, 1e-4);
  float rim = exp(-abs(x) * 30.) * 3.2 + exp(-abs(x) * 7.) * .5;
  float st = fbm(dn * 2.3 + vec2(r * .22 - uT * .05, 1.7)), st2 = fbm(dn * 5.3 - vec2(1.3, r * .3 - uT * .08));
  float stream = pow(st, 2.6) * 3.4 + pow(st2, 3.) * 1.7;
  return (GOLD * rim + mix(GOLD, LIGHT, clamp(x * .7, 0., 1.)) * stream * exp(-max(x, 0.) * 1.45) * smoothstep(-.02, .03, x) * .8) * pw * .5;
}
vec3 flare(vec2 v, float I){                                                // 아나모픽 플레어 + 4방향 별빛
  float r = length(v);
  vec3 c = LIGHT * (exp(-abs(v.y) * 26.) * exp(-abs(v.x) * .32) * .9 + exp(-abs(v.x) * 34.) * exp(-abs(v.y) * .9) * .7);
  vec2 d = rotv(v, .7854); c += LIGHT * (exp(-abs(d.y) * 40.) * exp(-abs(d.x) * 1.6) + exp(-abs(d.x) * 40.) * exp(-abs(d.y) * 1.6)) * .25;
  return (c + vec3(1.) * exp(-r * r * 9.) * 1.6 + LIGHT * exp(-r * 1.3) * .22) * I;
}

float sdRhomb(vec2 p, vec2 b){ p = abs(p); return (p.x / b.x + p.y / b.y - 1.) * min(b.x, b.y) * .75; }
/* ── 무기 SDF 는 시작할 때 아틀라스 텍스처(4x2 칸, 칸마다 무기 좌표 ±2.7)에 구워 두고 여기서는 읽기만 한다 → 셰이더 컴파일이 빨라짐 ── */
vec3 W(int id, vec2 q){                                                     // x 거리 · y 보석까지 거리 · z 각인선까지 거리
  vec2 t = q / 5.4 + .5; if (t.x < .004 || t.y < .004 || t.x > .996 || t.y > .996) return vec3(3.);
  return textureLod(uAtlas, (vec2(float(id % 4), float(id / 4)) + t) / vec2(4., 2.), 0.).xyz;
}
/* 금속 몸체(베벨 음영 · 결 · 스펙큘러) + 발광(모서리 · 각인선 · 보석 · 후광). q 무기 좌표, ang 화면상 기울기, px 픽셀 크기, energy 의식의 빛, charge 검신에 차오른 빛 */
vec4 shadeW(int id, vec2 q, float ang, float px, float energy, float charge, vec3 tint){
  vec3 sw = W(id, q); float d = sw.x, gem = sw.y, core = sw.z;
  if (d > 2.9) return vec4(0.);
  vec2 tq = abs(q / 5.4); float em = smoothstep(.5, .38, max(tq.x, tq.y));                 // 아틀라스 칸 가장자리에서 후광이 끊기지 않게
  float e = .025; vec2 g = vec2(W(id, q + vec2(e, 0.)).x - d, W(id, q + vec2(0., e)).x - d) / e; g = rotv(g / max(length(g), 1e-4), ang);
  float inside = smoothstep(px, -px, d), h = clamp(-d / .085, 0., 1.);
  vec3 n = normalize(vec3(g * (1. - h) * 1.7, .5 + h)), L = normalize(vec3(-.45, .62, .64));
  float diff = max(dot(n, L), 0.), spec = pow(max(reflect(-L, n).z, 0.), 42.);
  float grain = .8 + .4 * noise(vec2(q.x * 46., q.y * 2.6)), sheen = exp(-pow((q.y + q.x * .6 - (fract(uT * .16 + float(id) * .37) * 9. - 4.5)) * 2.2, 2.));
  vec3 env = mix(vec3(.025, .035, .06), vec3(.3, .4, .56), .5 + .5 * n.y); env = mix(env, vec3(.34, .05, .26), uTaint * .55 * (.5 - .5 * n.x));   // 하늘빛 반사 + 혼돈 쪽에서 오는 자줏빛
  float groove = exp(-pow((d + .075) * 55., 2.)), dam = .5 + .5 * sin(q.y * 7. + noise(q * 3.3) * 9.);
  vec3 col = env * (.22 + .78 * diff) * grain * (.82 + .3 * dam * h) * (1. - .55 * groove) + vec3(.9, 1., 1.2) * spec * (.6 + sheen) + vec3(.1, .13, .18) * sheen * h;
  float fill = id == 0 ? smoothstep(.06, -.06, q.y - mix(-.62, 2.05, charge)) * step(.001, charge) : 1.;
  float line = exp(-core * core * 1500.) * fill, jewel = smoothstep(px, -px, gem);
  float lit = energy * (id == 0 ? .5 + .9 * charge : 1.);
  col += tint * (exp(-abs(d) * 36.) * .16 + line * 1.25 + groove * .22) * lit + mix(vec3(.02), tint * 2.4 + vec3(.8), clamp(energy, 0., 1.)) * jewel;
  float dd = max(d, 0.); vec3 glow = (tint * lit * (exp(-dd * 8.) * .11 + exp(-dd * 1.7) * .018) + tint * line * lit * .12) * em;
  return vec4(col * inside + glow * (1. - inside), inside);
}
/* 삼각 파편 파쇄: 기울어진 격자 칸을 대각선으로 나눈 조각들이 타격점에서 밀려나며 돈다 (픽셀을 조각의 원래 자리로 되돌려 검사) */
vec2 gridF(vec2 q){ return rotv(q, .45) * vec2(2.6, 1.5); }
vec2 gridI(vec2 g){ return rotv(g / vec2(2.6, 1.5), -.45); }
vec4 shatter(int id, vec2 q, float ang, float px, float a, float energy, vec2 I, vec3 tint){
  vec2 G0 = floor(gridF(q)); vec4 best = vec4(0.); float bz = -1.;
  for (int j = -2; j <= 2; j++) for (int i = -2; i <= 2; i++){
    vec2 cell = G0 + vec2(float(i), float(j)); float flip = step(.5, hash(cell + 2.2));
    for (int k = 0; k < 2; k++){
      float fk = float(k); vec2 rnd = hash2(cell * 1.37 + fk * 17.3), cl = vec2(mix(.33, .67, fk)); if (flip > .5) cl.x = 1. - cl.x;
      vec2 c = gridI(cell + cl), dir = normalize(c - I + (rnd - .5) * .9);
      float sp = (1.3 + 3.4 * rnd.x) / (.55 + length(c - I)), dist = sp * (1. - exp(-2.6 * a)) / 2.6, th = (rnd.y - .5) * 7. * (1. - exp(-1.8 * a));
      vec2 qr = rotv(q - c - dir * dist, -th) + c, Gr = gridF(qr); if (floor(Gr) != cell) continue;

vec3 wings(vec2 p, vec2 base){                                              // 검 뒤에서 좌우로 뻗는 여섯 개의 휜 빛가시 — 뿌리는 굵고 끝은 바늘처럼

    float sgn = (i % 2 == 0) ? -1. : 1., j = float(i / 2), Lw = (5.7 - j * 1.05) * grow, th0 = .42 + j * .46, bend = .55 + j * .12;
    float u = r / max(Lw, 1e-3), da = atan(v.x * sgn, v.y) - (th0 + bend * u * u), dp = r * sin(da);
    float w = (.17 - j * .02) * pow(max(1. - u, 0.), 1.25) * smoothstep(0., .1, u) + .003;
    float m = smoothstep(1., .9, u) * smoothstep(0., .05, u) * step(0., cos(da));
    float body = exp(-pow(dp / w, 2.)), corew = exp(-pow(dp / (w * .28), 2.));
    acc += (mix(LIGHT, GOLD, .15 + .15 * j) * body * .75 + vec3(1.) * corew * 1.3 + LIGHT * exp(-abs(dp) * 2.2) * .05 * (1. - u)) * m * (.8 + .4 * grow * (1. - u));
  }

}

/* 장면 셰이더는 컷마다 따로(7개) — 컴파일을 걸어만 두고 결과는 처음 쓸 때 확인한다. 드라이버가 뒤에서 병렬로 컴파일하므로
   첫 컷만 준비되면 바로 시작할 수 있고, 페이지를 열 때 미리 걸어 두기 때문에 보통은 재생 버튼을 누르기 전에 끝나 있다. */
function lazyProgram(vs, fs) {

}
function initGL() {
