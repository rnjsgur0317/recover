/* ═════════════════ 셰이더 ═════════════════ */

float throne(vec3 p){
  float d = sdRBox(p - vec3(0., 8., -3.), vec3(11., 5.2, 8.5), .6);
  d = min(d, sdRBox(vec3(abs(p.x) - 11.4, p.y - 15.8, p.z + 1.), vec3(1.9, 1.1, 8.2), .5)); d = min(d, sdRBox(vec3(abs(p.x) - 11.4, p.y - 11.5, p.z - 5.6), vec3(1.4, 3.8, 1.4), .3));

  else { sp = sdRC(vec3(w, h.y), vec3(44.5, 0., 0.), vec3(47.8, 0., 0.), .85, .05); vec3 dq = vec3(w.x - 47.3, w.y, h.y * 2.); float dm = sdOcta(dq, 1.8) * .5; sp = min(sp, max(dm, -(sdOcta(dq, 1.1) * .5 - .04))); sp = min(sp, sdOcta(dq, .7) * .5); }

vec2 crown8(vec3 p){ vec3 q = (p - vec3(0., 86., 0.)) / 1.35; float bd = length(q) - 15.; if (bd > .5) return vec2(bd * 1.35, -1.);                          // 반시계로 도는 다이아 왕관

vec2 map(vec3 p){
  vec2 r = vec2(1e9, -1.); gE = 1e9;
  r = opU(r, vec2(pedestal(p), 15.));
  float bd = sdBox(p - vec3(0., 30., -8.), vec3(15., 19., 9.)); if (bd < 1.) r = opU(r, vec2(throneIn(p), 1.)); else r = opU(r, vec2(bd, -1.));

}

float calcAO(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i = uZero; i < 4; i++){ float h = .2 + .7 * float(i); o += (h - map(p + n * h).x) * s; s *= .65; } return clamp(1. - .8 * o, 0., 1.); }

  vec2 q = rd.xz / (abs(y) + .25) * 1.6; float cl = fbm(q + vec2(uT * .02, 0.)) * .7 + fbm(q * 2.3 - uT * .03) * .3; c += vec3(.06, .02, .13) * pow(cl, 3.) * (1. + 6. * uFlash) * smoothstep(-.05, .3, y);

    let x = Wd / 2 - w / 2; tg.shadowColor = "rgba(150,90,255,.9)"; tg.shadowBlur = U * .4; tg.fillStyle = "#f0e8ff"; [...word].forEach((c, i) => { tg.fillText(c, x + ws[i] / 2, y); x += ws[i] + sp; }); tg.shadowBlur = 0;
    const lw = w * .5 * k; tg.fillStyle = "rgba(190,160,255,.85)"; tg.fillRect(Wd / 2 - w / 2 - U * .5 - lw * .4, y - 1, lw * .4, 2); tg.fillRect(Wd / 2 + w / 2 + U * .5, y - 1, lw * .4, 2);
    tg.font = `500 ${Math.round(U * .2)}px "Noto Serif KR", serif`; tg.fillStyle = "rgba(220,205,255,.8)"; tg.fillText("모 나 크", Wd / 2, y + U * .62); tg.restore(); }
}

/* ═════════════════ 연출 ═════════════════ */
function state(t) {
  const S = { focal: 1.3, focus: 120, aper: .1, eyeK: 0, voidK: 0, port: new Float32Array(8), flash: 0, shock: -1, power: 0, crackK: 1, orbI: 1, plasma: .25, fade: 0, shake: 0, rays: .4, bloom: .6 };
  const br = [Math.sin(t * 1.1) * .15, Math.sin(t * 1.7 + 1) * .12, Math.sin(t * .8 + 2) * .14];
  let cam;

  else if (t < T.RISE) { const k = seg(t, T.PORT, T.RISE), P0 = PORTS[1]; cam = camera(add(mix3([80, 27, 42], [72, 28.4, 32], eOut(k)), mul(br, .2)), add(P0, [0, .3, 0]), 0); S.focal = 1.55; S.focus = 26; S.aper = .45; S.orbI = .55; S.rays = .15; }
  else if (t < T.FACE) { const k = eInOut(seg(t, T.RISE, T.FACE)); cam = camera(add(mix3([10, 1.7, 64], [6, 14, 52], k), mul(br, .3)), mix3([4, 8, 20], [0, 50, 0], k), 0); S.focal = .95; S.focus = 45; S.aper = .12; S.orbI = .7 + .2 * k; S.plasma = .3; }   // 단상의 계단에서
  else if (t < T.HALO) { const k = eOut(seg(t, T.FACE, T.HALO)); cam = camera(add(mix3([-6, 45, 80], [-2, 44.5, 62], k), mul(br, .1)), [0, 43, 0], .02); S.focal = 1.45; S.focus = lerp(80, 62, k); S.aper = .35; S.rays = 0; }   // 구체 앞
  else if (t < T.WIDE) { const k = eInOut(seg(t, T.HALO, T.WIDE)); cam = camera(add(mix3([42, 64, 80], [28, 118, 70], k), mul(br, .3)), mix3([0, 74, 0], [0, 96, 0], k), .03); S.focal = 1.1; S.focus = 80; S.aper = .08; S.rays = .3; }   // 꼭대기로
  else if (t < T.POWER) { const k = seg(t, T.WIDE, T.POWER); cam = camera(add(mix3([0, 18, 175], [0, 20, 158], eOut(k)), mul(br, .2)), [0, 58, 0], 0); S.focal = 1.25; S.focus = 160; S.aper = .03; S.rays = .35; }   // 정면: 사진처럼
  else if (t < T.HERO) { const a = lerp(.6, 1.2, seg(t, T.POWER, T.HERO)), sh = 2 * pulse(t, T.SHOCK, .02, 1.); cam = camera(add([Math.sin(a) * 120, 26, Math.cos(a) * 120], [(h1(t * 60) - .5) * sh, (h1(t * 60 + 3) - .5) * sh, 0]), [0, 50, 0], .02); S.focal = 1.1; S.focus = 120; S.aper = .04; S.rays = .45; }
  else { const k = eOut(seg(t, T.HERO, T.END)); cam = camera(add(mix3([0, 5, 128], [0, 7, 112], k), mul(br, .2)), [0, 56, 0], 0); S.focal = 1.05; S.focus = 115; S.aper = .04; S.rays = .45; }
  S.cam = cam;
  S.voidK = eOut(seg(t, 10.4, 12.2)); S.eyeK = t >= T.IGNITE ? eOut(seg(t, T.IGNITE, T.IGNITE + .22)) + 1.4 * pulse(t, T.IGNITE, .02, .9) : 0;
  S.plasma = Math.max(S.plasma, t >= T.IGNITE ? .45 + 1.1 * pulse(t, T.IGNITE, .02, 1.4) : 0, t >= T.POWER && t < T.HERO ? .9 + .6 * pulse(t, T.SHOCK, .02, 1.) : 0, t >= T.HERO ? .6 : 0);
  if (t >= T.IGNITE) S.orbI = Math.max(S.orbI, 1 + .6 * pulse(t, T.IGNITE, .02, 1.));
  const pv = (i, o, l) => { S.port[i * 2] = o; S.port[i * 2 + 1] = l; };
  { const o = Math.min(eOut(seg(t, T.EYEO, T.EYEO + .35)), 1 - eIn(seg(t, T.EYEC - .3, T.EYEC))); pv(1, o, lerp(1, -1, eInOut(seg(t, T.EYEO + .45, T.EYEC - .45)))); }
  if (t >= T.STARE) for (let i = 0; i < 4; i++) { const o = t < T.POWER ? eOut(seg(t, T.STARE, T.STARE + .25)) : Math.max(0, Math.sin((t - T.POWER) * 1.4 + i * 1.7)) > .35 ? 1 : 0; pv(i, o, t < T.POWER ? 0 : Math.sin((t - T.POWER) * .9 + i)); }
  for (const [tb] of BOLTS) S.flash = Math.max(S.flash, pulse(t, tb, .01, .25) * (tb > T.POWER && tb < T.HERO ? .35 : .6));
  S.flash = Math.max(S.flash, .9 * pulse(t, T.IGNITE, .01, .3), .6 * pulse(t, T.STARE, .01, .3), 1.1 * pulse(t, T.SHOCK, .01, .45), .5 * pulse(t, T.HERO, .01, .6));
  S.shock = t >= T.SHOCK && t < T.SHOCK + 2.4 ? (t - T.SHOCK) * 90 : -1; S.power = Math.max(pulse(t, T.SHOCK, .05, 1.6), t >= T.POWER && t < T.HERO ? .25 : 0, .6 * pulse(t, T.IGNITE, .02, .8));
  S.shake = Math.max(pulse(t, T.IGNITE, .01, .4) * .5, pulse(t, T.SHOCK, .01, .9), .3 * pulse(t, T.STARE, .01, .4), .4 * pulse(t, T.HERO, .01, .5));
  S.fade = Math.max(1 - seg(t, 0, .5), seg(t, T.END - .5, T.END - .1)); S.spinA = t * .45 + (t >= T.POWER ? (t - T.POWER) * .5 : 0);
  S.trans = CUTS.reduce((m, c) => Math.max(m, t < c ? Math.pow(seg(t, c - .14, c), 2) : 1 - seg(t, c, c + .24)), 0);                           // 장면 전환: 픽셀로 흩어졌다 모인다
  S.flash = Math.max(S.flash, .45 * CUTS.reduce((m, c) => Math.max(m, pulse(t, c, .005, .12)), 0));
  const ten = new Float32Array(21), pk = S.plasma; for (let k = 0; k < 7; k++) { const th = k * 2.39 + Math.sin(t * (.6 + .3 * pk) + k) * .9 + t * (.25 + .9 * pk), ph = Math.acos(clamp(.1 + .8 * Math.sin(t * .45 * (1 + pk) + k * 1.3), -.95, .95)); ten.set([Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th)], k * 3); }

}
function render(t) {
  const S = state(t), gl = X.gl, pw = glc.width, ph = glc.height, sw = RT.scene.w, sh = RT.scene.h;
  drawOverlay(t, S); X.upload(txtTex, tcv, true); gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  const prog = P.scene(), u = prog.u, f1 = (n, v) => { if (u[n] != null) gl.uniform1f(u[n], v || 0); };
  X.pass(prog, RT.scene, () => { gl.uniform2f(u.uRes, sw, sh); f1("uT", t); if (u.uZero != null) gl.uniform1i(u.uZero, 0); gl.uniform3f(u.uCamPos, ...S.cam.pos); gl.uniformMatrix3fv(u.uCam, false, new Float32Array([...S.cam.r, ...S.cam.u, ...S.cam.f])); f1("uFocal", S.focal);
    if (u.uPort != null) gl.uniform2fv(u.uPort, S.port); if (u.uTen != null) gl.uniform3fv(u.uTen, S.ten); if (u.uAtlas != null) X.bindTex(4, atlasTex, u.uAtlas);
    for (const [n, v] of [["uEyeK", S.eyeK], ["uVoidK", S.voidK], ["uFlash", S.flash], ["uShock", S.shock], ["uPower", S.power], ["uSpinA", S.spinA], ["uOrbI", S.orbI], ["uCrackK", S.crackK], ["uPlasma", S.plasma]]) f1(n, v); });
  const lp = proj(S, SC), bloomTex = X.bloom(RT.scene.tex, 1.1), raysTex = X.rays(lp ? clamp(lp[0] / Wd) : .5, lp ? clamp(1 - lp[1] / Hd) : .9, .92), r0 = rng(Math.floor(t * 60)), hit = S.shake;
  X.pass(P.final(), null, (u2) => { X.bindTex(0, RT.scene.tex, u2.uScene); X.bindTex(1, bloomTex, u2.uBloom); X.bindTex(2, txtTex, u2.uTxt); X.bindTex(3, raysTex, u2.uRays); gl.uniform2f(u2.uRes, pw, ph); gl.uniform1f(u2.uT, t);
    gl.uniform2f(u2.uShake, (r0() - .5) * hit * .02, (r0() - .5) * hit * .02); gl.uniform1f(u2.uZoom, 1 + .02 * hit + .05 * S.trans); gl.uniform1f(u2.uCA, .0012 + .005 * hit);
    for (const [n, v] of [["uBloomK", S.bloom], ["uRayK", lp ? S.rays : 0], ["uFocus", S.focus], ["uAper", S.aper], ["uFlash", .12 * S.flash * S.flash], ["uFade", S.fade], ["uGrainK", $("cs").classList.contains("rec") ? .4 : 1],

}

const player = CSUI.create({
  stage: $("cs"), audio: bgm, volume: .9, duration: T.END, theme: "monarch", capBlend: false, recW: 3840, recH: 2160, maxMB: 100,
  no: "09", title: "MONARCH", sub: "모나크 · V2", hero: "/thumbs/monarch2_hero.jpg",

  meta: [["0:30", "Length"], ["4K · 3D", "Renderer"], ["Original", "Score"]],
