     11.5   깨어남 — 옥좌 위로 어둠이 모여 공허가 되고, 12.6 그 속에서 보라 눈이 뜨인다
     14.5   대관 — 여덟 다이아가 날아와 왕관으로 맞물리고 · 두 후광이 스스로 그려지고 · 공허가 흰 별을 품은 구슬로 응축되고 · 여섯 뿔 왕관이 하늘에서 내려와 씌워진다 · 빛의 장막

     22.5   승천 — 더 높이 떠오르고 23.8 충격파가 땅을 쓸며 폭풍 구름이 소용돌이로 열린다

   ═══════════════════════════════════════════════════════════════ */

{ const r = rng(99); for (let t = T.POWER + .1; t < T.HERO - .2; t += .18 + r() * .3) BOLTS.push([t, 20 + Math.floor(r() * 900)]); BOLTS.sort((a, b) => a[0] - b[0]); }

/* ═════════════════ 셰이더 ═════════════════ */
const FS_SCENE = `#version 300 es

  float d = sdRBox(p - vec3(0., 8., -3.), vec3(11., 5.2, 8.5), .6);
  d = min(d, sdRBox(vec3(abs(p.x) - 11.4, p.y - 15.8, p.z + 1.), vec3(1.9, 1.1, 8.2), .5)); d = min(d, sdRBox(vec3(abs(p.x) - 11.4, p.y - 11.5, p.z - 5.6), vec3(1.4, 3.8, 1.4), .3));

/* ── 몸: 거꾸로 선 흑요석 첨탑(8각) · 매달린 수정 조각 · 윗테두리의 가시 ── */

float horns(vec3 q){ vec3 a = q; a.xz = abs(a.xz); vec3 dr = vec3(.70711, 0., .70711);                                                                    // 몸에서 솟아 구슬을 감싸는 네 뿔
  vec3 P0 = dr * 22. + vec3(0., 106., 0.), P1 = dr * 40. + vec3(0., 117., 0.), P2 = dr * 46. + vec3(0., 135., 0.), P3 = dr * 40. + vec3(0., 155., 0.), P4 = dr * 27. + vec3(0., 168., 0.);

float lring(vec3 q){ vec3 w = q - vec3(0., 76., 0.); w.yz = rot(.08) * w.yz; return length(vec2(length(w.xz) - 37., w.y)) - .85 * uRingK + (1. - uRingK) * 3.; }
vec2 crown8(vec3 q0){ if (uCrownK <= 0.) return vec2(1e3, -1.); float ck = 1. - uCrownK, RR = 11. + 40. * ck * ck; vec3 q = (q0 - vec3(0., 119. + 50. * ck * ck, 0.)) / 1.8; float bd = length(q) - (15. + 40. * ck * ck); if (bd > .5) return vec2(bd * 1.8, -1.);                         // 반시계로 도는 다이아 왕관
  q.xz = rot(uSpinA) * q.xz; float r = length(q.xz), an = atan(q.z, q.x), sc = 6.2832 / 8., a2 = mod(an + sc * .5, sc) - sc * .5; vec3 l = vec3(cos(a2) * r - RR, q.y, sin(a2) * r); l.xy = rot(ck * 6.) * l.xy;

float topCrown(vec3 q0){ if (uTopK <= 0.) return 1e3; float tk = 1. - uTopK; vec3 q = (q0 - vec3(0., 190. + 140. * tk * tk, 0.)) / 1.8; q.xz = rot(tk * 4.) * q.xz; float bd = length(q) - 13.; if (bd > .5) return bd * 1.8;                                   // 여섯 뿔 검은 왕관

vec2 portals(vec3 p){ vec2 r = vec2(1e9, -1.);
