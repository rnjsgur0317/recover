<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   MONARCH V2 — 광활한 평원을 가로지르는 거대한 지배자 (실시간 3D · 사람 없음 · 대사 없음 · 30초 · 4K 저장)
   형체(아래에서 위로, 높이 약 190m): 거꾸로 선 흑요석 첨탑의 몸(8각 별 문장 · 빛나는 이음새 · 매달린 수정 조각) · 아랫부분을 두른 연보라 고리
   · 몸에서 솟아 구슬을 감싸는 X 자의 네 뿔 · 반시계로 도는 8개 다이아 왕관 · 서로 반대로 도는 두 후광과 흰 별을 품은 남보라 구슬 · 여섯 뿔 검은 왕관.
   곁에는 눈이 뜨이는 네 개의 차원문이 돈다. 구슬이 내리는 빛의 장막과 발밑의 균열 문양 · 글자 고리가 함께 움직인다.
   장소: 끝없는 어두운 평원 · 먼 산맥 · 흩어진 오벨리스크(20~40m, 크기 비교용) · 번개 구름.
   장면이 바뀔 때마다 번쩍 · 픽셀로 흩어졌다 모이는 전환(픽셀레이션처럼). 음원: tools/make_monarch_audio.py (오리지널, 시각 T 같음)
     0      지평선 너머에서 다가오는 빛(망원) · 번개가 산맥을 비춘다
     4.0    오벨리스크 사이를 도는 차원문 — 검은 흰자의 보라 눈이 오른쪽에서 왼쪽으로
     7.5    땅에서 올려다봄 — 지배자가 머리 위를 지나가며 빛의 장막이 쓸고 간다
     11.5   구슬 앞 — 12.6 흰 별이 타오르고 보라 눈이 뜨인다
     14.5   공중에서 나란히 날며 — 도는 왕관 · 후광 · 뿔
     18.5   멀리 옆에서 — 오벨리스크 평원 위를 미끄러지는 전체 · 20.5 네 차원문의 눈
     22.5   멈춘다 — 23.8 충격파가 평원을 쓸고 번개 폭풍
     26.0   정면 앙각 — MONARCH
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t, eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
const h1 = (x) => { const v = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }, mix3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
function camera(pos, tgt, roll) { const f = norm(sub(tgt, pos)), r0 = norm(cross(f, [0, 1, 0])), u0 = cross(r0, f), c = Math.cos(roll), s = Math.sin(roll); return { pos, r: [r0[0] * c + u0[0] * s, r0[1] * c + u0[1] * s, r0[2] * c + u0[2] * s], u: [u0[0] * c - r0[0] * s, u0[1] * c - r0[1] * s, u0[2] * c - r0[2] * s], f }; }

const T = { L1: .6, L2: 2.9, PORT: 4.0, EYEO: 5.1, EYEC: 7.0, RISE: 7.5, FACE: 11.5, IGNITE: 12.6, HALO: 14.5, WIDE: 18.5, STARE: 20.5, POWER: 22.5, SHOCK: 23.8, HERO: 26.0, TITLE: 26.6, END: 30.0 };
const CUTS = [T.PORT, T.RISE, T.FACE, T.HALO, T.WIDE, T.POWER, T.HERO];
const SPEED = 14, Z0 = -300;
const monZ = (t) => Z0 + SPEED * (t < T.POWER - 1 ? t : (T.POWER - 1) + (1 - Math.pow(1 - seg(t, T.POWER - 1, T.POWER + 1), 2)) * 1);   // 22.5 에 멈춘다(부드럽게)
const monPos = (t) => [Math.sin(t * .21) * 6, 2 * Math.sin(t * .6), monZ(t)];
const portAt = (t, i) => { const m = monPos(t), a = i * PI / 2 + PI / 4 + t * .12; return [m[0] + Math.cos(a) * 80, 100 + 22 * Math.sin(t * .5 + i * 1.7) + m[1], m[2] + Math.sin(a) * 80]; };
const BOLTS = [[T.L1, 1], [T.L2, 2], [8.8, 3], [T.IGNITE, 4], [16.2, 5], [T.STARE, 6], [T.SHOCK, 7], [27.4, 8]];
{ const r = rng(99); for (let t = T.POWER + .1; t < T.HERO - .2; t += .18 + r() * .3) BOLTS.push([t, 20 + Math.floor(r() * 900)]); BOLTS.sort((a, b) => a[0] - b[0]); }

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm"), tcv = document.createElement("canvas"), tg = tcv.getContext("2d");
const acv = document.createElement("canvas"), ag = acv.getContext("2d"); acv.width = 2048; acv.height = 128;
let Wd = 0, Hd = 0, U = 0, DPR = 1, DPR_CAP = 2, SCALE = 1, slow = 0, time = 0, X = null, P = {}, RT = {}, txtTex = null, atlasTex = null;

/* ═════════════════ 셰이더 ═════════════════ */
const FS_SCENE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uT, uFocal, uEyeK, uFlash, uShock, uPower, uSpinA, uOrbI, uCrackK; uniform vec3 uCamPos, uM; uniform mat3 uCam; uniform int uZero; uniform vec2 uPort[4]; uniform vec3 uPortP[4]; uniform sampler2D uAtlas;
${CSGL.NOISE}
const vec3 LC = vec3(.62, .45, 1.);
const float OY = 150.;
float gE = 1e9;
vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float smin(float a, float b, float k){ float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
float sdRBox(vec3 p, vec3 b, float r){ return sdBox(p, b - r) - r; }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h) - r; }
float sdEll(vec3 p, vec3 r){ float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.) / k1; }
float sdOcta(vec3 p, float s){ p = abs(p); return (p.x + p.y + p.z - s) * .57735027; }
float sdRC(vec3 p, vec3 a, vec3 b, float r1, float r2){ vec3 ba = b - a; float l2 = dot(ba, ba), rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1. / l2; vec3 pa = p - a; float y = dot(pa, ba), z = y - l2; vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv), y2 = y * y * l2, z2 = z * z * l2, k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2; if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1; return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1; }
float sdStarN(vec2 p, float r, float n, float m){ float an = 3.141593 / n, en = 3.141593 / m; vec2 acs = vec2(cos(an), sin(an)), ecs = vec2(cos(en), sin(en)); float bn = mod(atan(p.x, p.y), 2. * an) - an;   // n 각 별
  p = length(p) * vec2(cos(bn), abs(sin(bn))); p -= r * acs; p += ecs * clamp(-dot(p, ecs), 0., r * acs.y / ecs.y); return length(p) * sign(p.x); }

float pshape(vec2 u){ vec2 a = abs(u); float mx = max(a.x, a.y) + 1e-4, mn = min(a.x, a.y), k = mn / mx; return mx - (5.2 - 1.1 * (1. - k * k)); }   // 모서리가 당겨진 사각형

/* ── 몸: 거꾸로 선 흑요석 첨탑(8각) · 매달린 수정 조각 · 윗테두리의 가시 ── */
float keel(vec3 q){ float bd = length(q - vec3(0., 80., 0.)) - 50.; if (bd > 2.) return bd;
  float an = atan(q.z, q.x), sc = .785398, a2 = mod(an + sc * .5, sc) - sc * .5, rr = length(q.xz), r = rr * cos(a2), h = clamp((q.y - 40.) / 72., 0., 1.), R = mix(1., 26., h);
  float d = max((r - R) * .945, max(40. - q.y, q.y - 112.)); d = max(d, -(abs(q.y - 100.) - .6) + .0); d = min(d, max((r - R - 1.2) * .945, abs(q.y - 100.) - .9));   // 윗부분의 띠
  float b2 = mod(an, sc) - sc * .5; vec3 m = vec3(cos(b2) * rr, q.y, sin(b2) * rr);
  float sh = sdRC(m, vec3(21., 104., 0.), vec3(13.5, 52., 0.), 3.4, .1); sh = min(sh, sdRC(m, vec3(17., 90., 3.5), vec3(12., 62., 5.), 1.8, .06));
  float c16 = mod(an + .19635, .3927) - .19635; vec3 k = vec3(cos(c16) * rr, q.y, sin(c16) * rr); float cr = sdRC(k, vec3(24.5, 111., 0.), vec3(26.5, 124., 0.), 1.5, .05);
  return min(min(d, sh * .9), cr); }
float horns(vec3 q){ vec3 a = q; a.xz = abs(a.xz); vec3 dr = vec3(.70711, 0., .70711);                                                                    // 몸에서 솟아 구슬을 감싸는 네 뿔
  vec3 P0 = dr * 22. + vec3(0., 106., 0.), P1 = dr * 40. + vec3(0., 117., 0.), P2 = dr * 46. + vec3(0., 135., 0.), P3 = dr * 40. + vec3(0., 155., 0.), P4 = dr * 27. + vec3(0., 168., 0.);
  float bd = length(a - dr * 36. - vec3(0., 136., 0.)) - 40.; if (bd > 2.) return bd;
  float d = sdRC(a, P0, P1, 5., 4.2); d = min(d, sdRC(a, P1, P2, 4.2, 3.2)); d = min(d, sdRC(a, P2, P3, 3.2, 2.)); d = min(d, sdRC(a, P3, P4, 2., .12)); return d; }
float lring(vec3 q){ vec3 w = q - vec3(0., 76., 0.); w.yz = rot(.08) * w.yz; return length(vec2(length(w.xz) - 37., w.y)) - .85; }
vec2 crown8(vec3 q0){ vec3 q = (q0 - vec3(0., 119., 0.)) / 1.8; float bd = length(q) - 15.; if (bd > .5) return vec2(bd * 1.8, -1.);                         // 반시계로 도는 다이아 왕관
  q.xz = rot(uSpinA) * q.xz; float r = length(q.xz), an = atan(q.z, q.x), sc = 6.2832 / 8., a2 = mod(an + sc * .5, sc) - sc * .5; vec3 l = vec3(cos(a2) * r - 11., q.y, sin(a2) * r);
  float dia = sdOcta(vec3(l.x * 1.1, l.y * .62, l.z), 1.7) * .62, frm = abs(sdOcta(vec3(l.x * 2.6, l.y * .5, l.z), 2.9) * .5) - .1; frm = max(frm, abs(l.x) - .3);
  float rods = min(sdCap(vec3(l.x, l.y, abs(l.z)), vec3(0., -3.2, 2.7), vec3(0., 3.2, 2.7), .13), sdCap(vec3(l.x, l.y, abs(l.z)), vec3(0., 3.2, 2.7), vec3(0., 4.6, 1.2), .1));
  float ring = min(length(vec2(r - 11., q.y + 3.3)) - .12, length(vec2(r - 11., q.y - 3.3)) - .1); gE = min(gE, (dia + .3) * 1.8); return opU(vec2(dia * 1.8, 7.), vec2(min(min(frm, rods), ring) * 1.8, 8.)); }
vec2 halos(vec3 q0){ vec3 h = (q0 - vec3(0., OY, 0.)) / 1.8; float bd = length(h) - 27.; if (bd > .5) return vec2(bd * 1.8, -1.);                              // 두 후광과 흰 별을 품은 구슬
  vec2 r = vec2((length(h) - 7.) * 1.8, 10.);
  vec2 b = rot(uSpinA * -.7) * h.xy; float rr = length(b), an = atan(b.y, b.x), sc = .785398, id = floor(an / sc + .5), a2 = an - id * sc; vec2 w = vec2(cos(a2), sin(a2)) * rr;
  float ring = length(vec2(rr - 17., h.z)) - .5, sp;
  if (mod(id, 2.) < .5){ sp = sdRC(vec3(w, h.z), vec3(17.3, 0., 0.), vec3(24.5, 0., 0.), .9, .04); sp = min(sp, sdRC(vec3(w.x, abs(w.y), h.z), vec3(17.3, 1.7, 0.), vec3(21.2, 1.9, 0.), .6, .04)); }
  else { sp = sdRC(vec3(w, h.z), vec3(17.3, 0., 0.), vec3(19.6, 0., 0.), .6, .04); vec3 dq = vec3(w.x - 19.2, w.y, h.z * 2.); sp = min(sp, max(sdOcta(dq, 1.25) * .5, -(sdOcta(dq, .75) * .5 - .03))); sp = min(sp, sdOcta(dq, .5) * .5); }
  vec2 b2 = rot(uSpinA * 1.) * h.xy; float r2 = length(b2), an2 = atan(b2.y, b2.x), a3 = mod(an2 + .3927, .785398) - .3927; vec2 w2 = vec2(cos(a3), sin(a3)) * r2;
  float ring2 = min(length(vec2(r2 - 12.5, h.z - .6)) - .35, sdRC(vec3(w2, h.z - .6), vec3(12.7, 0., 0.), vec3(14.4, 0., 0.), .45, .03));
  float hl = min(min(ring, sp), ring2); gE = min(gE, (hl + .15) * 1.8); return opU(r, vec2(hl * 1.8, 9.)); }
float topCrown(vec3 q0){ vec3 q = (q0 - vec3(0., 190., 0.)) / 1.8; float bd = length(q) - 13.; if (bd > .5) return bd * 1.8;                                   // 여섯 뿔 검은 왕관
  q.xz = rot(uSpinA * 1.1) * q.xz; float r = length(q.xz), an = atan(q.z, q.x), sc = 6.2832 / 6., a2 = mod(an + sc * .5, sc) - sc * .5; vec3 l = vec3(cos(a2) * r, q.y, sin(a2) * r);
  float ring = min(length(vec2(r - 6.5, q.y)) - .7, length(vec2(r - 6., q.y + 1.4)) - .35);
  float hn = min(sdRC(l, vec3(6.5, 0., 0.), vec3(7.8, 4.5, 0.), 1.1, .6), sdRC(l, vec3(7.8, 4.5, 0.), vec3(10.5, 9.5, 0.), .6, .03)); hn = min(hn, sdRC(l, vec3(6.2, .5, 2.2), vec3(6.8, 3.4, 2.6), .35, .02));
  return min(ring, hn) * 1.8; }
vec3 portalQ(vec3 p, int i){ vec3 c = uPortP[i], q = (p - c) / 1.9; vec3 f = normalize(vec3(uCamPos.x - c.x, 0., uCamPos.z - c.z)); float a = atan(f.x, f.z); q.xz = rot(-a) * q.xz; return q; }   // 늘 이쪽을 보는 차원문
vec2 portals(vec3 p){ vec2 r = vec2(1e9, -1.);
  for (int i = uZero; i < 4; i++){ vec3 c = uPortP[i]; float bd = length(p - c) - 15.; if (bd > 1.){ r = opU(r, vec2(bd, -1.)); continue; }
    vec3 q = portalQ(p, i); float s = pshape(q.xy), fr = max(abs(s + .55) - .55, abs(q.z) - .75) - .05, mem = max(s + .9, abs(q.z) - .08); gE = min(gE, (mem + .4) * 1.9);
    r = opU(r, vec2(fr * 1.9, 5.)); r = opU(r, vec2(mem * 1.9, 6. + float(i) * .1)); }
  return r; }
vec2 obelisk(vec3 p){ if (p.y > 52.) return vec2(p.y - 50., -1.); vec2 cid = floor(p.xz / 70.), lc = p.xz - (cid + .5) * 70.; float edge = min(35. - abs(lc.x), 35. - abs(lc.y)) + 2.;                    // 평원에 흩어진 오벨리스크(크기 비교용)
  if (hash(cid) < .72 || abs((cid.x + .5) * 70.) < 60.) return vec2(edge, -1.); vec2 j = (vec2(hash(cid + 1.), hash(cid + 2.)) - .5) * 30.; float H = 20. + 22. * hash(cid + 3.), w = 2.4 + 1.6 * hash(cid + 4.);
  vec3 q = vec3(lc.x - j.x, p.y, lc.y - j.y); q.xz = rot(hash(cid + 5.) * 3.) * q.xz; float tp = w * (1. - .35 * clamp(q.y / H, 0., 1.));
  float d = max(max(abs(q.x) - tp, abs(q.z) - tp), abs(q.y - H * .5) - H * .5); d = min(d, max(max(abs(q.x), abs(q.z)) - (H + w * 2.2 - q.y) * .5, max(H - q.y, q.y - H - w * 2.2)));
  return d < edge ? vec2(d, 15.) : vec2(edge, -1.); }                                                                          // 칸 경계는 걸음 제한일 뿐, 표면이 아니다
vec2 map(vec3 p){
  vec2 r = vec2(1e9, -1.); gE = 1e9; vec3 q = p - uM;
  r = opU(r, obelisk(p));
  float bd = length(q - vec3(0., 115., 0.)) - 105.;
  if (bd < 2.){ r = opU(r, vec2(keel(q), 1.)); r = opU(r, vec2(horns(q), 4.)); float lr = lring(q); r = opU(r, vec2(lr, 12.)); gE = min(gE, lr + .5);
    r = opU(r, crown8(q)); r = opU(r, halos(q)); r = opU(r, vec2(topCrown(q), 11.)); }
  else r = opU(r, vec2(bd, -1.));
  r = opU(r, portals(p));
  return r;
}
vec3 normalAt(vec3 p, float t){ float e = .006 + t * .0004; vec3 n = vec3(0.); for (int i = uZero; i < 4; i++){ vec3 k = .5773 * (2. * vec3(float(((i + 3) >> 1) & 1), float((i >> 1) & 1), float(i & 1)) - 1.); n += k * map(p + e * k).x; } return normalize(n); }
float calcAO(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i = uZero; i < 4; i++){ float h = .4 + 1.6 * float(i); o += (h - map(p + n * h).x) * s; s *= .6; } return clamp(1. - .5 * o, 0., 1.); }
vec3 sky(vec3 rd){ float y = rd.y, az = atan(rd.x, -rd.z); vec3 c = mix(vec3(.018, .008, .034), vec3(.002, .001, .006), smoothstep(-.02, .6, y));
  vec2 q = rd.xz / (abs(y) + .12) * 1.2; float cl = fbm(q * .6 + vec2(uT * .01, 0.)) * .7 + fbm(q * 1.7 - uT * .015) * .3; c += vec3(.07, .025, .15) * pow(cl, 3.) * (1. + 7. * uFlash) * smoothstep(.0, .25, y);   // 번개 구름

/* ═════════════════ 연출: 시각 t → 지배자의 위치 · 카메라 (순수 함수) ═════════════════ */

  else if (t < T.WIDE) { const k = eInOut(seg(t, T.HALO, T.WIDE)); cam = camera(add(at(mix3([170, 150, 90], [150, 110, -30], k)), mul(br, .4)), at([0, mix3([0, 120, 0], [0, 105, 0], k)[1], 0]), .06 * Math.sin(t * .6)); S.focal = 1.25; S.focus = 180; S.aper = .03; }   // 나란히 날며
