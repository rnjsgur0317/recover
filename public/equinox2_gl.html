   패스: ① 장면(구·원반·고리·원통을 해석적으로 교차, 가장자리 면적 안티앨리어싱, 바닥 반사 1회, 알파 = 절대색 표시) ② 파편 입자(배타 블렌딩) ③ 블룸 ④ 최종(파동 굴절 · 뒤집기 · 글자 · 조리개)
   전부 시간의 함수(상태 없음). 시계·HUD·시작/종료 화면은 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;

/* ═════════════════ 셰이더 ═════════════════ */
const GLSL_CAM = `uniform vec3 uCamPos; uniform mat3 uCam; uniform float uFocal;`;
const FS_SCENE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uT; ${GLSL_CAM}
uniform vec4 uOrb[2], uBead[4]; uniform vec3 uRingN[6]; uniform float uSpec[24];
uniform float uFloorRot, uOrbA, uDiscR, uBars, uFloorK, uStar, uRingK, uSwap, uAura, uPulse, uTrail; uniform vec2 uGR, uGU, uCenterS; uniform vec4 uSat[4], uWorldA, uWorldB; uniform vec3 uTrans; uniform sampler2D uGlyph; uniform int uZero;
${CSGL.NOISE}
#define PX (2. / (uRes.y * uFocal))
vec2 gS; float gM;                                                                     // 이 픽셀의 화면 좌표 · (제목 구간) 이 픽셀의 세계: 1 = 밤 → 흰 구, 0 = 낮 → 검은 구
float ln(float d, float w, float aa){ return clamp((w - abs(d)) / aa + .5, 0., 1.); }
float glyph(int i, vec2 p, float lod){ if (max(abs(p.x), abs(p.y)) >= 1.) return 0.; vec2 org = vec2(float(i & 1) * .5, .5 - float(i >> 1) * .5); return textureLod(uGlyph, org + (p * .5 + .5) * .5, lod).r; }

vec3 bg(vec3 rd){                                                                      // 공허: 지평선 근처의 옅은 안개 + 별
  vec2 q = rd.xz / (abs(rd.y) + .4); float mist = fbm(q * 1.2 + vec2(uT * .012, 3.)); vec3 c = vec3(.004 + pow(mist, 2.4) * exp(-abs(rd.y) * 2.4) * .1);
  vec2 sp = vec2(atan(rd.z, rd.x), asin(clamp(rd.y, -1., 1.))) * 13.; vec2 id = floor(sp), f = fract(sp) - .5; float hs = hash(id);
  if (hs > .8){ vec2 v = f - (vec2(hash(id + 3.1), hash(id + 7.7)) - .5) * .6; float tw = .55 + .45 * sin(uT * (1. + 3. * hs) + hs * 50.), k = (hs - .8) * 5.;

    if (hs > .955) c += vec3((exp(-abs(v.x) * 46.) * exp(-abs(v.y) * 7.) + exp(-abs(v.y) * 46.) * exp(-abs(v.x) * 7.)) * tw * .9); }

float star4(vec2 v, float spin){ float c = cos(spin), s = sin(spin); v = vec2(c * v.x - s * v.y, s * v.x + c * v.y); float r = length(v);      // 네 갈래 네온 별
  float a = .006 / (abs(v.x * v.y) + .006) * exp(-r * 2.6); vec2 w = vec2(v.x + v.y, v.x - v.y) * .7071; float b = .004 / (abs(w.x * w.y) + .004) * exp(-r * 5.5);
  return a * 1.1 + b * .5 + .016 / (r * r + .008) * exp(-r * 2.2); }

/* 구체: 0 = 검은 구체(흑요석 유리 · 속에 도는 은하 · 흰 새김선 · 가는 흰 테두리), 1 = 흰 구체(대리석 달 · 검은 새김선 · 속에서 새는 빛). 둘 다 안에 흰 네온 별.
   새김: 도는 대원 셋 + 눈금 띠 — 유리라서 뒷면의 새김도 옅게 비친다. 제목 구간(uSwap)에서는 구체의 색이 번호가 아니라 '경계선의 어느 쪽 픽셀인가'로 정해진다 */
float orbPattern(vec3 q, float aaS, float tt){
  float c1 = cos(tt), s1 = sin(tt); vec3 a1 = vec3(c1, 0., s1), a2 = normalize(vec3(.35 * s1, 1., .35 * c1)), a3 = normalize(vec3(-s1 * .7, .62, c1 * .7));
  float l = max(max(ln(dot(q, a1), .01, aaS), ln(dot(q, a3), .006, aaS)), ln(abs(dot(q, a1)) - .06, .003, aaS));
  float lat = dot(q, a2); vec3 u = normalize(a1 - a2 * dot(a1, a2)), w = cross(a2, u); float lon = atan(dot(q, w), dot(q, u)) / 6.2832 + tt * .15, tk = abs(fract(lon * 48.) - .5) / 48. * 6.2832 * sqrt(max(1. - lat * lat, 0.));

vec4 orb(int k, vec3 ro, vec3 rd, out float tHit){
  tHit = 1e9; vec3 c = uOrb[k].xyz; float R = uOrb[k].w; if (R < .002) return vec4(0.);
  vec3 oc = ro - c; float tca = -dot(oc, rd); if (tca < 0.) return vec4(0.);
  vec3 v = oc + rd * tca; float d = length(v), aa = tca * PX, cov = clamp((R - d) / aa + .5, 0., 1.); if (cov <= 0.) return vec4(0.);
  float h = sqrt(max(R * R - d * d, 0.)); tHit = tca - h; vec3 n = normalize(v - rd * h), nb = normalize(v + rd * h); float ndv = clamp(dot(n, -rd), 0., 1.), fres = pow(1. - ndv, 3.);

    cB = vec3(.003 + hor + arms * neb * neb * .7 * (.5 + .5 * uStar) + shell * (.4 + .6 * uStar) + pb * .12 + pf * .62) + vec3(1.2) * fres * fres + vec3(st) * smoothstep(1.02, .25, rr); }

    float body = (.3 + .36 * m + .1 * m2) * (1. - .45 * arms * (.4 + .6 * neb)) + .22 * pow(ndv, 4.); body = mix(body, body * .6, pb * .6); body = mix(body, .012, pf * .92); body *= mix(.06, 1., pow(ndv, .6)); cW = vec3(body) + vec3(st) * .8; }

}
vec3 corona(int k, vec3 ro, vec3 rd){                                                  // 구체 바깥으로 새는 빛: 일렁이는 불꽃 테 + 십자 섬광 (세계와 함께 뒤집힌다 → 흰 세계에서는 검은 불꽃)
  vec3 c = uOrb[k].xyz; float R = uOrb[k].w; if (R < .002) return vec3(0.); vec3 oc = ro - c; float tca = -dot(oc, rd); if (tca < 0.) return vec3(0.);
  vec3 v = oc + rd * tca; vec2 sv = vec2(dot(v, uCam[0]), dot(v, uCam[1])) / R; float rr = length(sv); if (rr > 3. || rr < .9) return vec3(0.);
  float an = atan(sv.y, sv.x), fl = .5 + .5 * sin(an * 9. + uT * 1.3 + float(k) * 3.) * sin(an * 4. - uT * .7), nz = fbm(sv * 2.4 - sv / rr * uT * .9 + float(k) * 7.);

/* 바닥: 떠 있는 정사각 판 — 소용돌이 · 눈금 고리 · 큰 검은 원(陰)과 흰 원(陽) · 가운데 흰 원과 衡 */
vec4 floorShade(vec3 p, float t, vec3 rd, out float ex){ ex = 0.;
  vec2 q = p.xz; float r = length(q), aa = t * PX / max(abs(rd.y), .06), cov = clamp((4.7 - max(abs(q.x), abs(q.y))) / aa + .5, 0., 1.); if (cov <= 0.) return vec4(0.);

  float v = fbm(sw * 1.5 + 3.), v2 = fbm(sw * 4.2 - 7.), g = (pow(v, 1.7) * 1.2 + v2 * v2 * .3) * smoothstep(4.7, 1., r) * .42 * (1. + 1.6 * uAura) + .02;
  float edge = 4.7 - max(abs(q.x), abs(q.y)); g += ln(edge - .05, .012, aa) * .8 + ln(edge - .22, .004, aa) * .4;
  float an = atan(q.y, q.x) / 6.2832 + uFloorRot * .02, tk = abs(fract(an * 96.) - .5) * (6.2832 * r / 96.), tk8 = abs(fract(an * 12.) - .5) * (6.2832 * r / 12.);
  g = mix(g, .85, ln(r - 3.12, .013, aa)); g = mix(g, .6, ln(r - 3.42, .005, aa)); g = mix(g, .7, ln(tk, .007, aa) * step(3.13, r) * step(r, 3.3)); g = mix(g, .9, ln(tk8, .012, aa) * step(3.13, r) * step(r, 3.42));
  vec2 dir = vec2(cos(uOrbA), sin(uOrbA)), c0 = dir * uDiscR, c1 = -dir * uDiscR; float d0 = length(q - c0) - 1.28, d1 = length(q - c1) - 1.28, lod = log2(max(1., aa * 256. / .7));
  vec2 g0 = vec2(dot(q - c0, uGR), dot(q - c0, uGU)) / .78, g1 = vec2(dot(q - c1, uGR), dot(q - c1, uGU)) / .78, gc = vec2(dot(q, uGR), dot(q, uGU)) / .4;
  float k0 = clamp(-d0 / aa + .5, 0., 1.), k1 = clamp(-d1 / aa + .5, 0., 1.), e1 = max(ln(d1 + .13, .009, aa), ln(d1 + .19, .003, aa)), e0 = max(ln(d0 + .13, .009, aa), ln(d0 + .19, .003, aa));
  float w1 = .95 - .93 * e1, b1 = .9 * max(e1, ln(d1 + .012, .012, aa)), w0 = .95 - .93 * e0, b0 = .9 * max(e0, ln(d0 + .012, .012, aa));
  float disc1 = uSwap > .5 ? mix(b1, w1, gM) : mix(w1, .015, glyph(1, g1, lod)), disc0 = uSwap > .5 ? mix(b0, w0, gM) : mix(b0, .92, glyph(0, g0, lod));           // 제목 구간: 원도 경계선의 어느 쪽이냐에 따라 흑 ↔ 백
  g = mix(g, disc1, k1); g = mix(g, disc0, k0); ex = max(k0, k1);
  if (uAura > .001){ float rp = .7 + 4.1 * uPulse; g = mix(g, 1., ln(r - rp, .08 * (1. - uPulse), aa) * (1. - uPulse) * uAura * (1. - ex)); }                       // 구체가 경계선을 넘을 때마다 바닥으로 번지는 충격 고리
  ex *= 1. - clamp((.68 - r) / aa + .5, 0., 1.); g = mix(g, .0, ln(r - .6, .02, aa)); g = mix(g, .85, ln(r - .66, .004, aa)); float cw = mix(.96, .01, glyph(2, gc, log2(max(1., aa * 256. / .4)))); g = mix(g, cw, clamp((.52 - r) / aa + .5, 0., 1.));
  vec3 l1 = uOrb[1].xyz - p, l0 = uOrb[0].xyz - p; g *= mix((.5 + 1.5 * uOrb[1].w / (.62 * (1. + 1.3 * dot(l1, l1)))) * (1. - .7 * uOrb[0].w / (.62 * (1. + 1.8 * dot(l0, l0)))), 1., uSwap);      // 흰 구체는 빛을, 검은 구체는 어둠을 드리운다
  return vec4(vec3(g), cov);
}

/* 가는 것들: 구체의 고리 · 네 구슬 · 음악 막대. 가장 가까운 덩어리(tmax)보다 앞에 있을 때만, 덮은 정도만큼 얹는다.
   절대색 위(flag)에서는 아래와 반대되는 색, 그 밖에서는 흰색(세계와 함께 뒤집힘) */

  if (disc > 0. && uBars > .001){ float sq = sqrt(disc);

  X.pass(P.final(), null, (u) => { X.bindTex(0, RT.scene.tex, u.uScene); X.bindTex(1, bloomTex, u.uBloom); X.bindTex(2, txtTex, u.uTxt); gl.uniform2f(u.uRes, pw, ph); gl.uniform1f(u.uT, t);
    gl.uniform2f(u.uShake, (r0() - .5) * hit * .016, (r0() - .5) * hit * .016 - .004 * S.bp); gl.uniform1f(u.uZoom, 1 + .022 * S.bp + .03 * cross + .05 * pulse(t, T.IMPACT, .02, .6) + .07 * pulse(t, T.BURST, .02, .5)); gl.uniform1f(u.uBloomK, .45);
    gl.uniform1f(u.uFlash, flash * flash); gl.uniform1f(u.uFade, t < T.YIN - .02 ? 1 : eInOut(seg(t, T.BURST + .22, T.BURST + .8))); gl.uniform4fv(u.uWave, wv); gl.uniform4fv(u.uWorldA, F.worldA); gl.uniform4fv(u.uWorldB, F.worldB); gl.uniform3fv(u.uTrans, F.trans);
    gl.uniform2f(u.uCenterS, S.centerS[0], S.centerS[1]); gl.uniform3f(u.uIris, S.centerS[0], S.centerS[1], ir); gl.uniform1f(u.uZeroRing, 0); });
}

const player = CSUI.create({
  stage: $("cs"), audio: bgm, volume: .95, duration: T.END, theme: "ink", capBlend: true,
  no: "01", title: "EQUINOX", sub: "衡", hero: "/thumbs/equinox2_hero.jpg",

  meta: [["0:16", "Length"], ["180 BPM", "Tempo"], ["WebGL2 · 3D", "Renderer"]],
  chapters: [{ t: 0, name: "陰 Negative" }, { t: T.YANG, name: "陽 Positive" }, { t: T.HENG, name: "衡 Equinox" }, { t: T.MU, name: "無 Zero" }, { t: T.IMPACT, name: "EQUINOX" }],
  captions: [],
  prepare() { resize(); P.scene(); P.part(); P.final(); },
  simulate(tt) { time = tt; },
  frame(t, dt, raw) { time = t; slow = raw > .034 ? slow + 1 : Math.max(0, slow - 1); if (slow > 40) { slow = 0; if (DPR_CAP > 1) { DPR_CAP = 1; resize(); } else if (SCALE > .6) { SCALE = .6; resize(); } } render(t); },
});
