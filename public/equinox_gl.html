<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQUINOX 컷씬 (WebGL) — 陰陽</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #0a0a0c; color: #e7e5e0; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
.demo { max-width: 460px; width: 100%; background: #121214; border: 1px solid #2a2a2e; border-radius: 16px; padding: 26px 24px; }
.demo h1 { margin: 0 0 6px; font-size: 1.15rem; letter-spacing: .04em; }
.demo p { margin: 0 0 16px; color: #8d8b86; font-size: .86rem; line-height: 1.65; }
.demo .row { display: flex; align-items: center; gap: 8px; font-size: .86rem; color: #b8b6b0; }
.demo button.play { width: 100%; margin-top: 16px; border: 1px solid #f4f1ea; border-radius: 11px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; color: #0a0a0c; background: #f4f1ea; font-family: inherit; }
.demo .note { margin-top: 14px; font-size: .76rem; color: #6d6b66; line-height: 1.6; }
.cs { position: fixed; inset: 0; z-index: 9999; background: #000; overflow: hidden; }
.cs[hidden] { display: none; }
.cs canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cs-bar { position: absolute; left: 0; right: 0; height: 9vh; background: #000; z-index: 3; }
.cs-bar.top { top: 0; } .cs-bar.bottom { bottom: 0; }
.cs-skip { position: absolute; right: 18px; top: calc(9vh + 14px); z-index: 6; background: rgba(0,0,0,.4); color: #d6d3cd; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 7px 14px; font-size: .78rem; cursor: pointer; font-family: inherit; mix-blend-mode: difference; }
</style>
</head>
<body>
<div class="demo">
  <h1>EQUINOX — 陰陽 · WebGL 버전</h1>
  <p>같은 연출을 GPU 파이프라인으로 올린 버전입니다. 먹이 번지는 듯한 경계, 바탕을 뒤집는 GPU 입자 수천 개, 블룸 · 갓레이 · 박자마다 출렁이는 충격파 · 색수차 · 필름 그레인, 한지/먹 질감.</p>
  <div class="row"><input type="checkbox" id="demoSound" checked> <label for="demoSound">음악 재생</label></div>
  <button class="play" id="demoPlay">▶ 컷씬 재생</button>
  <div class="note">주소 뒤에 <code>?t=12.4</code> 처럼 붙이면 그 시점의 정지 화면을 볼 수 있어요.<br>음원 파일(<code>equinox_cut.mp3</code>)은 저작권 때문에 이 PC에만 두고 깃허브에는 올리지 않습니다.</div>
</div>
<div class="cs" id="cs" hidden>
  <canvas id="glc"></canvas>
  <canvas id="ui" style="z-index:2;pointer-events:none;mix-blend-mode:difference"></canvas>
  <div class="cs-bar top"></div><div class="cs-bar bottom"></div>
  <button class="cs-skip" id="csSkip">건너뛰기 ▸▸</button>
</div>
<audio id="bgm" src="/equinox_cut.mp3" preload="auto"></audio>
<script src="/equinox_data.js"></script>
<script src="/cs_gl.js"></script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   EQUINOX 「陰陽」 — 음악 동기 컷씬 (20초 + 페이드 1초)
   곡 분석: 90 BPM · 3/4박 → 박 0.6667s, 마디 2.0s, 16분음 0.1667s, 첫 강박 1.02s, 드롭 11.02s
   1막 0~11.02  분리: 거대한 태극의 '안쪽'에서 시작 — 화면은 어둠/빛 두 쪽, 두 구슬이 서로를 돈다.
                 아르페지오 16분음마다 음·양 구슬에서 번갈아 파문. 9.02부터 소용돌이치며 멀어짐(줌아웃).
   2막 11.02~19.02 합일: 태극이 한 점으로 맞물림. 박마다 ①충격파 ②양(빛살) ③음(먹) 폭발, 팔괘·해·달·위성 태극.
   종막 19.02~   춘분: 낮과 밤이 정확히 반반 — 타이틀 EQUINOX.
   API: playEquinoxCutscene({ sound: true, onDone(){} })
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t;
const eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const BEAT = 2 / 3, T0 = 1.02, BUILD = 9.02, DROP = 11.02, SAT = 15.02, TITLE = 19.02, FADE = 20.0, END = 21.0;
const D = window.EQ_DATA || { fps: 30, low: [], high: [], onsets: [] };
const CAPS = [
  { a: 1.5, b: 4.7, s: "陰 — 어둠은 빛을 품고" },
  { a: 5.2, b: 8.7, s: "陽 — 빛은 어둠을 품는다" },
  { a: 9.1, b: 10.85, s: "둘이 같아지는 단 하루" },
];
const TRIGRAMS = [7, 3, 5, 1, 0, 4, 2, 6];          // 건·태·리·진·곤·간·감·손 (비트: 1=이어진 효)

const $ = (id) => document.getElementById(id);
const glc = $("glc"), ui = $("ui"), ug = ui.getContext("2d"), bgm = $("bgm");
const cv = document.createElement("canvas"), g = cv.getContext("2d");      // 2D 레이어 (텍스처로 올라감)
let W = 0, H = 0, U = 0, DPR = 1, stars = [], parts = [], events = [], rotTab = null, time = 0, running = false, raf = 0, anchor = 0, useAudio = false, opts = {};

let DPR_CAP = 1.5, slow = 0;
function resize() {
  DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1); W = glc.clientWidth; H = glc.clientHeight; U = Math.min(W, H) / 10;
  const pw = Math.max(2, Math.round(W * DPR)), ph = Math.max(2, Math.round(H * DPR));
  glc.width = cv.width = ui.width = pw; glc.height = cv.height = ui.height = ph;
  initGL(); X.resize(pw, ph); X.free(RT.scene); X.free(RT.mask); RT.scene = X.target(pw, ph); RT.mask = X.target(pw >> 1, ph >> 1);
}
function band(arr, t) { const i = t * D.fps, i0 = Math.floor(i); if (i0 < 0 || !arr.length) return .5; const a = arr[Math.min(arr.length - 1, i0)], b = arr[Math.min(arr.length - 1, i0 + 1)]; return a + (b - a) * (i - i0); }
const lowN = (t) => clamp((band(D.low, t) - .35) / .45), highN = (t) => clamp((band(D.high, t) - .25) / .45);

/* 회전: 각속도를 적분해 표로 (1막 느리게 → 빌드에서 소용돌이 → 2막은 박마다 툭툭 밀림) */
function omega(t) {
  if (t < T0) return 0;
  if (t < BUILD) return .3 + .04 * (t - T0);
  if (t < DROP) return lerp(.62, 12, eIn(seg(t, BUILD, DROP)));
  if (t < TITLE) { const ph = ((t - DROP) / BEAT) % 1; return 1.0 + 6 * Math.exp(-ph * 6); }
  return .45;
}
function buildRot() { const n = Math.ceil(END * 240) + 2; rotTab = new Float32Array(n); let a = PI / 2; for (let i = 0; i < n; i++) { rotTab[i] = a; a += omega(i / 240) / 240; } }
function rotAt(t) { const i = clamp(t, 0, END) * 240, i0 = Math.floor(i); return lerp(rotTab[i0], rotTab[Math.min(rotTab.length - 1, i0 + 1)], i - i0); }
function beatPulse(t) { if (t < DROP || t >= TITLE) return 0; return Math.exp(-(((t - DROP) / BEAT) % 1) * 5); }
function barPulse(t) { if (t < DROP || t >= TITLE) return 0; return Math.exp(-(((t - DROP) / 2) % 1) * 7); }
function radiusAt(t) {
  if (t < BUILD) return Math.exp(lerp(Math.log(70 * U), Math.log(13 * U), eInOut(seg(t, T0, BUILD))));
  if (t < DROP) return Math.exp(lerp(Math.log(13 * U), Math.log(2.7 * U), eIn(seg(t, BUILD, DROP))));
  const toTitle = eInOut(seg(t, TITLE, TITLE + .55));
  return lerp(2.7 * U * (1 + .1 * beatPulse(t) + .05 * lowN(t)) * (1 + .3 * pulse(t, DROP, .01, .45)), 1.3 * U, toTitle);
}
function centerY(t) { return lerp(0, -1.95 * U, eInOut(seg(t, TITLE, TITLE + .55))); }
function orbR(t) { return Math.min(lerp(3.3 * U, 2.3 * U, seg(t, 3, BUILD)), radiusAt(t) / 2); }
function orbPos(t, yang) { const a = rotAt(t), r = orbR(t) * (yang ? 1 : -1); return [Math.sin(a) * r, -Math.cos(a) * r + centerY(t)]; }

function init() {
  buildRot();
  const r = rng(12);
  stars = Array.from({ length: 260 }, () => ({ x: (r() * 2 - 1) * 1.1, y: (r() * 2 - 1) * 1.1, z: .3 + r() * .7, ph: r() * TAU }));
  parts = []; events = [];
  // 아르페지오 온셋 → 음·양 구슬에서 번갈아 파문 (2막에서는 강한 음만)
  D.onsets.forEach(([ot, s], i) => {
    if (ot < DROP - .05) events.push({ t: ot, fn: () => ripple(ot, i % 2 === 0, s) });
    else if (ot < TITLE && s > .8) events.push({ t: ot, fn: () => ringAt(0, centerY(ot), radiusAt(ot) * 1.02, radiusAt(ot) * 1.7, .5, .05) });
  });
  events.push({ t: DROP, fn: () => { ringAt(0, 0, 2 * U, 16 * U, 1.1, .3); ringAt(0, 0, 1 * U, 11 * U, 1.4, .12); inkBurst(DROP, 70, 1.6); rayBurst(DROP, 40); } });
  for (let n = 1, bt = DROP + BEAT; bt < TITLE - .05; n++, bt = DROP + n * BEAT) {
    const tt = bt, k = n % 3;
    events.push({ t: tt, fn: k === 0 ? () => ringAt(0, 0, radiusAt(tt), 12 * U, .9, .16) : k === 1 ? () => rayBurst(tt, 26) : () => inkBurst(tt, 38, 1) });
  }
  events.push({ t: TITLE, fn: () => { ringAt(0, centerY(TITLE + .6), 1.5 * U, 18 * U, 1.3, .22); rayBurst(TITLE, 48); } });
  events.sort((a, b) => a.t - b.t); events.forEach((e) => (e.done = false));
}

/* ── 파티클 (전부 'difference' 로 그려서 흰 바탕에선 검게, 검은 바탕에선 희게) ── */
function ripple(t, yang, s) { const [x, y] = t < T0 ? [0, 0] : orbPos(t, yang); parts.push({ type: "ring", x, y, r0: .45 * U, r1: (1.6 + s * 2.2) * U, life: .75, max: .75, lw: .05 + s * .05 }); }
function ringAt(x, y, r0, r1, life, lw) { parts.push({ type: "ring", x, y, r0, r1, life, max: life, lw }); }
function rayBurst(t, n) { const r = rng(Math.round(t * 100)), cy = centerY(t), R = radiusAt(t); for (let i = 0; i < n; i++) { const a = r() * TAU, sp = (14 + r() * 22) * U / 60; parts.push({ type: "ray", age: 0, x: Math.cos(a) * R, y: cy + Math.sin(a) * R, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .45 + r() * .3, max: .75, len: (.6 + r() * 1.6) * U, lw: (.03 + r() * .06) * U, drag: .985 }); } }
function inkBurst(t, n, pw) { const r = rng(Math.round(t * 100) + 7), cy = centerY(t), R = radiusAt(t); for (let i = 0; i < n; i++) { const a = r() * TAU, sp = (3 + r() * r() * 16) * pw * U / 60, d = Math.sqrt(r()) * R * .85; parts.push({ type: "ink", age: 0, x: Math.cos(a) * d, y: cy + Math.sin(a) * d, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .7 + r() * .9, max: 1.6, size: (.08 + r() * r() * .5) * U, drag: .95 }); } }
function update(t, dt) {
  for (const e of events) { if (e.done || t < e.t) continue; e.done = true; e.fn(); }
  for (const p of parts) { p.life -= dt; if (p.type === "ring") continue; p.age += dt; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; }
  parts = parts.filter((p) => p.life > 0);
}

/* ── 그리기 도구 ── */
function taiji(cx, cy, R, rot, whiteAlpha, outline) {
  g.save(); g.translate(cx, cy); g.rotate(rot);
  g.globalAlpha = whiteAlpha; g.fillStyle = "#fff"; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  g.globalAlpha = 1; g.fillStyle = "#000"; g.beginPath();
  g.arc(0, 0, R, -PI / 2, PI / 2); g.arc(0, R / 2, R / 2, PI / 2, -PI / 2, true); g.arc(0, -R / 2, R / 2, PI / 2, -PI / 2, false); g.closePath(); g.fill();
  if (outline) { g.strokeStyle = "#fff"; g.lineWidth = outline; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke(); }
  g.restore();
}
function orb(x, y, r, yang, glow) {
  if (yang) { const gr = g.createRadialGradient(x, y, r * .6, x, y, r * (2.6 + glow * 2)); gr.addColorStop(0, `rgba(255,255,255,${.5 + .4 * glow})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.globalCompositeOperation = "lighter"; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * (2.6 + glow * 2), 0, TAU); g.fill(); g.globalCompositeOperation = "source-over"; }
  else { const gr = g.createRadialGradient(x, y, r * .6, x, y, r * (2.4 + glow * 1.6)); gr.addColorStop(0, `rgba(0,0,0,${.45 + .35 * glow})`); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * (2.4 + glow * 1.6), 0, TAU); g.fill(); }
  g.fillStyle = yang ? "#fff" : "#000"; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
function trail(t, yang, wMax) {                    // 구슬 뒤로 흐르는 혜성 꼬리 (잉어처럼) — 궤도 호를 따라 가늘어지는 한 덩어리
  const n = 28, a1 = rotAt(t) + (yang ? 0 : PI), dA = clamp(omega(t) * .42, t >= DROP ? 1.0 : .35, 2.2) * eOut(seg(t, T0 + .2, T0 + 1.2));
  const ro = orbR(t), cy = centerY(t), outer = [], inner = [];
  for (let i = 0; i <= n; i++) { const k = i / n, a = a1 - dA * (1 - k), w = wMax * k * k * .5; outer.push([Math.sin(a) * (ro + w), -Math.cos(a) * (ro + w) + cy]); inner.push([Math.sin(a) * (ro - w), -Math.cos(a) * (ro - w) + cy]); }
  g.globalAlpha = .85; g.beginPath(); g.moveTo(outer[0][0], outer[0][1]);
  for (let i = 1; i <= n; i++) g.lineTo(outer[i][0], outer[i][1]);
  for (let i = n; i >= 0; i--) g.lineTo(inner[i][0], inner[i][1]);
  g.closePath(); g.fill(); g.globalAlpha = 1;
}
function text(s, x, y, px, font, alpha, align) { g.globalAlpha = alpha; g.font = `${font || ""} ${px}px "Nanum Myeongjo","Batang","바탕",serif`; g.textAlign = align || "center"; g.textBaseline = "middle"; g.fillText(s, x, y); g.globalAlpha = 1; }

/* ── 한 프레임 ── */
function draw(t) {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const bp = beatPulse(t), bar = barPulse(t), lo = lowN(t), hi = highN(t);
  g.translate(W / 2, H / 2);
  const R = radiusAt(t), rot = rotAt(t), cy = centerY(t), titleK = eInOut(seg(t, TITLE, TITLE + .55));

  /* 배경: 2막 = 밤하늘 + 역회전 빛살, 종막 = 정확히 반반(왼쪽 밤 / 오른쪽 낮) */
  if (t >= BUILD + .8) {
    const M = Math.max(W, H) * .6;
    for (const s of stars) { g.globalAlpha = (.3 + .7 * s.z) * (.55 + .45 * Math.sin(t * (1.5 + s.z) + s.ph)) * (1 - titleK * .4); g.fillStyle = "#fff"; g.beginPath(); g.arc(s.x * M, s.y * M, s.z * 1.3 * (1 + hi * .6), 0, TAU); g.fill(); }
    g.globalAlpha = 1;
    if (t >= DROP) {                                 // 빛살 (박마다 밝아짐)
      const Rr = Math.hypot(W, H) * .7, a0 = -rot * .4, k = (.07 + .16 * bp + .1 * bar) * (1 - titleK);
      if (k > .005) { const gr = g.createRadialGradient(0, cy, R, 0, cy, Rr); gr.addColorStop(0, `rgba(255,255,255,${k * 1.6})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath();
        for (let i = 0; i < 18; i++) { const a = a0 + i / 18 * TAU, w = .07 + .03 * Math.sin(i * 1.7); g.moveTo(0, cy); g.lineTo(Math.cos(a - w) * Rr, cy + Math.sin(a - w) * Rr); g.lineTo(Math.cos(a + w) * Rr, cy + Math.sin(a + w) * Rr); g.closePath(); } g.fill(); }
    }
  }
  if (titleK > 0) { const wipe = eOut(seg(t, TITLE, TITLE + .4)); g.fillStyle = "#fff"; g.fillRect(0, -H, W * wipe, H * 2); }   // 오른쪽 절반 = 낮

  /* 서막 0~1.02: 어둠 속 한 점, 위아래로 자라는 빛의 금 */
  if (t < T0 + .3) {
    const k = eInOut(seg(t, .02, T0)), a = 1 - seg(t, T0, T0 + .3);
    g.globalAlpha = a; g.strokeStyle = "#fff"; g.lineWidth = Math.max(1, U * .018); g.beginPath(); g.moveTo(0, -H * .6 * k); g.lineTo(0, H * .6 * k); g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(0, 0, U * (.07 + .05 * lo), 0, TAU); g.fill(); g.globalAlpha = 1;
  }

  /* 태극 본체 — 1막에서는 화면보다 훨씬 커서 '경계선'만 보인다 */
  if (t >= T0) {
    if (t >= DROP) { const gl = g.createRadialGradient(0, cy, R * .9, 0, cy, R * (1.7 + bp * .5)); gl.addColorStop(0, `rgba(255,255,255,${.3 + .35 * bp})`); gl.addColorStop(1, "rgba(255,255,255,0)"); g.globalCompositeOperation = "lighter"; g.fillStyle = gl; g.beginPath(); g.arc(0, cy, R * 2.3, 0, TAU); g.fill(); g.globalCompositeOperation = "source-over"; }
    taiji(0, cy, R, rot, eOut(seg(t, T0, T0 + .22)), R < 20 * U ? Math.max(1.5, U * .045) : 0);
  }

  /* 팔괘 — 박마다 하나씩 차례로 번쩍 */
  if (t >= DROP) {
    g.fillStyle = "#fff";
    const appear = eBack(seg(t, DROP, DROP + .5)) * (1 - titleK), beatN = Math.floor((t - DROP) / BEAT);
    if (appear > .01) for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU - rot * .35, hot = beatN % 8 === i ? bp : 0, rr = 4.05 * U * appear * (1 + .04 * bar);
      g.save(); g.translate(Math.cos(a) * rr, Math.sin(a) * rr + cy); g.rotate(a + PI / 2); g.scale(1 + hot * .35, 1 + hot * .35);
      for (let b = 0; b < 3; b++) { const y = (b - 1) * .26 * U, w = .95 * U, h = .13 * U; if (TRIGRAMS[i] >> b & 1) g.fillRect(-w / 2, y - h / 2, w, h); else { g.fillRect(-w / 2, y - h / 2, w * .4, h); g.fillRect(w * .1, y - h / 2, w * .4, h); } }
      g.restore();
    }
  }

  /* 위성 태극 (15.02부터 박마다 하나씩, 19.02에 중심으로 빨려듦) */
  if (t >= SAT && t < TITLE + .5) {
    for (let i = 0; i < 6; i++) {
      const born = SAT + i * BEAT; if (t < born) continue;
      const k = eBack(seg(t, born, born + .4)), conv = eIn(seg(t, TITLE - .7, TITLE)), a = i / 6 * TAU + (t - SAT) * .9 * (1 + conv * 3);

let waveList = [];

function now() { return performance.now() / 1000; }
function frame() {

function endEquinox() { running = false; cancelAnimationFrame(raf); try { bgm.pause(); } catch (e) { /* 무시 */ } $("cs").hidden = true; if (opts.onDone) opts.onDone(); }
$("csSkip").addEventListener("click", endEquinox);
$("demoPlay").addEventListener("click", () => playEquinoxCutscene({ sound: $("demoSound").checked }));
window.addEventListener("resize", () => { if (!$("cs").hidden) { resize(); init(); buildWaves(); } });
window.playEquinoxCutscene = playEquinoxCutscene;
function renderStill(tt) { init(); buildWaves(); for (let t = 0; t < tt; t += 1 / 60) { time = t; update(t, 1 / 60); } time = tt; render(tt); }
{ const q = new URLSearchParams(location.search).get("t"); if (q !== null) { $("cs").hidden = false; resize(); renderStill(parseFloat(q) || 0); } }

/* 갤러리(cutscenes.html)에서 ?autoplay=1 로 열리면 바로 재생하고, 끝나면 부모 창에 알림 */
{ const q = new URLSearchParams(location.search); if (q.get("autoplay")) { const demo = document.querySelector(".demo"); if (demo) demo.style.display = "none"; document.body.style.background = "#000";
