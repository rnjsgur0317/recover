<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   [ LUMINOSITY ] V2 — 절대적인 광채 (WebGL2, 전부 셰이더)
   참고 영상의 흐름과 대사를 따르되 새로 설계: 어둠 → 문양과 "THE ABSOLUTE RADIANCE" → 별과 세 줄의 사슬 → 별이 터짐 →
   구름 속을 오르며 쏟아지는 빛줄기와 세 마디의 말 → 홀로 남은 검에 여덟 날개 조각이 모임 → 백색 → 아우라의 모습
   사운드: V1 과 같은 음원(luminosity_cut.mp3, 타격점은 luminosity_data.js 의 온셋)
     0      어둠과 바람, 멀리 작은 빛 하나
     3.13   THE · 3.65 ABSOLUTE · 4.13 RADIANCE — 소용돌이에서 문양이 또렷해진다 (고리에는 神は自分の創造物を恥じていると叫んでいる)
     6.32   글자가 사라지고 별이 드러남 → 6.69 / 6.90 / 7.08 사슬 세 줄 → 소용돌이가 별로 빨려듦
     9.66   별이 팽창하며 섬광 → 구름의 세계. 온셋마다 빛줄기가 내리꽂히고, 갈수록 잦아지고 오래 남는다
     10.9   "Well, you finally reached me."  ·  14.77 구름 너머 거대한 검의 윤곽  ·  15.2 "Now, don't be afraid of the dark."  ·  16.44 검신에 빛이 차오름
     19.62  점화 — 큰 날개 조각 넷(x) 19.62 19.90 20.23 20.46 · 작은 조각 넷(+) 21.11 21.45 21.87 22.27 · 22.82 광선 고리가 묶는다  ·  20.2 "As long as you're with me…"
     24.52  백색 → 아우라: 여덟 날개 조각(수렴·발산) · 광선 고리 · 속 빈 솔 고리와 불꽃 · 후광 문양 · 거대한 창 · 바닥의 두 문양 · 제목
     27.0   빛이 차올랐다가 암전 → 28.1 끝
   패스: ① 장면(구간별 프로그램 #define SHOT 0/1/2 — 큰 단일 셰이더는 컴파일이 느림) ② 블룸 ③ 최종(섬광 · 색수차 · 가로 번짐 · 글자[바탕에 따라 흰색/남색] · 비네트)
   전부 시간의 함수(상태 없음). 시계·HUD·시작/종료 화면은 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t, eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const T = { WORDS: [3.13, 3.65, 4.13], TEXTOUT: 5.7, STAR: 6.32, CHAINS: [6.69, 6.9, 7.08], BURST: 9.66, SWORD: 14.77, SURGE: 16.44, IGNITE: 19.62,
  BIG: [19.62, 19.9, 20.23, 20.46], SMALL: [21.11, 21.45, 21.87, 22.27], RING: 22.82, FINAL: 24.52, OUT: 26.9, END: 28.1 };
const LINES = [{ a: 10.9, b: 14.45, en: "Well, you finally reached me.", ko: "드디어 내게 왔군." }, { a: 15.2, b: 19.35, en: "Now, don't be afraid of the dark.", ko: "이제 어둠을 두려워하지 마." }, { a: 20.2, b: 24.35, en: "As long as you're with me…", ko: "네가 나와 함께라면…" }];
const D = window.LUM_DATA || { fps: 30, total: [], high: [], onsets: [] };
const dat = (arr, t) => { const x = t * D.fps, i = Math.floor(x); return i < 0 || !arr.length ? 0 : lerp(arr[Math.min(arr.length - 1, i)], arr[Math.min(arr.length - 1, i + 1)], x - i); };
/* 빛줄기: 구름 구간의 온셋마다 하나씩. 뒤로 갈수록 넓고 오래 남아서 화면이 점점 빛으로 찬다 */
const SHAFTS = (() => { const r = rng(41), out = []; for (const [at, k] of D.onsets) { if (at < 10.5 || at > 24.45 || k < .42) continue; const prog = seg(at, 10.5, 24.5), side = r() < .5 ? -1 : 1;
  out.push({ at, k, x: side * (.22 + r() * 1.45) * (1 - .55 * prog * r()), w: (.025 + .12 * r() * r() + .1 * prog * prog) * (.6 + .6 * k), tilt: (r() - .5) * .16, hold: .25 + 1.6 * prog * prog, fall: .5 + 1.4 * prog }); } return out; })();

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm"), tcv = document.createElement("canvas"), tg = tcv.getContext("2d"), rcv = document.createElement("canvas");
let Wd = 0, Hd = 0, U = 0, DPR = 1, DPR_CAP = 1.5, SCALE = .8, slow = 0, time = 0, X = null, P = {}, RT = {}, txtTex = null, ringTex = null;

/* ═════════════════ 셰이더 ═════════════════ */
const GLSL_COMMON = `
${CSGL.NOISE}
#define TAU 6.28318
const vec3 LIGHT = vec3(.62, .8, 1.), NAVY = vec3(.004, .008, .022);
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float ln(float d, float w, float aa){ return clamp((w - abs(d)) / aa + .5, 0., 1.); }
float sdBox(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
float star4(vec2 p, float s){ p = abs(p) / s; return (pow(p.x, .45) + pow(p.y, .45) - 1.) * s * .5; }                         // 네 갈래 별 (안쪽 < 0)
/* 문양: 겹고리 · 엇갈린 두 정사각(팔각 별) · 안쪽 두 정사각 · 눈금. 바깥 고리 반지름 = 1. 글자 고리는 텍스처(uRing) */
float sigil(vec2 p, float aa, float spin){
  float r = length(p), l = max(max(ln(r - 1., .011, aa), ln(r - .955, .004, aa)), max(ln(r - .745, .008, aa), ln(r - .715, .003, aa)));
  vec2 q = rot(spin) * p; float h = .715 / 1.41421; l = max(l, max(ln(sdBox(q, vec2(h)), .0055, aa), ln(sdBox(rot(.7854) * q, vec2(h)), .0055, aa)));
  vec2 q2 = rot(-spin * 1.6) * p; l = max(l, max(ln(sdBox(q2, vec2(.355)), .0045, aa), ln(sdBox(rot(.7854) * q2, vec2(.355)), .0045, aa)));
  l = max(l, max(ln(r - .335, .006, aa), ln(r - .2, .003, aa)));
  float tk = abs(fract(atan(p.y, p.x) / TAU * 72. + spin) - .5) / 72. * TAU * r; return max(l, ln(tk, .004, aa) * step(.955, r) * step(r, 1.));
}`;
const FS_SCENE = (shot) => `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
#define SHOT ${shot}
uniform vec2 uRes; uniform float uT, uLvl; uniform sampler2D uRing; uniform int uZero;
uniform float uSig, uSigBlur, uSigScale, uStar, uStarI, uVortex, uDust, uBand;                       // 0: 문양 · 별 · 소용돌이
uniform vec3 uChain[3];                                                                        //    사슬: 뻗은 정도 · 떨림 · 밝기
uniform vec4 uShaft[12]; uniform float uCloud, uRise, uSword, uCharge, uGlow;                  // 1: 빛줄기(x, 너비, 기울기, 세기) · 구름 · 검
uniform float uShardP[8], uShardL[8], uBreath, uRingK, uCoreK, uEmbS, uBurstK, uFloor, uSpear; uniform vec2 uEmbC;   // 1·2: 여덟 날개 조각의 아우라
${GLSL_COMMON}
#if SHOT == 0
float chainAt(vec2 p, vec2 a, vec2 dir, vec3 c, float aa){                                     // 사슬: 마주 보는 고리와 옆으로 선 고리가 번갈아
  if (c.x <= 0.) return 0.; float u = dot(p - a, dir), v = dot(p - a, vec2(-dir.y, dir.x)) + sin(u * 11. + uT * 38.) * c.y; if (u < -.06 || u > c.x) return 0.;
  float L = .078, k0 = floor(u / L), m = 0.;
  for (int i = uZero - 1; i <= 1; i++){ float k = k0 + float(i), f = u - (k + .5) * L; if ((k + .5) * L > c.x) continue; bool odd = mod(k, 2.) > .5;
    float d = odd ? length(vec2(max(abs(f) - .032, 0.), v)) - .0085 : abs(length(vec2(max(abs(f) - .027, 0.), v)) - .024) - .0078; m = max(m, clamp(-d / aa + .5, 0., 1.) * (odd ? .8 : 1.)); }
  return m * c.z; }
#endif
#if SHOT >= 1
/* 날개 조각: 네 변이 안으로 휜 길쭉한 마름모(한쪽이 더 넓고 끝 쪽이 더 김) — 어두운 강철 몸체 · 능선을 경계로 다른 밝기 · 안쪽 겹 윤곽 · 밝은 테두리 */
void shard(vec2 p, float ang, float len, float wid, float prog, float land, float aa, inout vec3 col, inout vec3 glow){
  if (prog <= 0.) return; vec2 dir = vec2(cos(ang), sin(ang)); float off = .2 + uBreath * .035 + (1. - prog) * 3.2; vec2 q = p - dir * off; float y = dot(q, dir), x = dot(q, vec2(-dir.y, dir.x)) * (ang > 1.5708 && ang < 4.7124 ? -1. : 1.);
  float yc = .27 * len, yy = y - yc, b = yy > 0. ? .73 * len : .27 * len, a = x > 0. ? wid : wid * .55, d = pow(abs(x) / a, .86) + pow(abs(yy) / b, .86) - 1., sc = min(a, b) * .62, dist = d * sc;
  if (dist > .2) return; float body = clamp(-dist / aa + .5, 0., 1.);
  float along = clamp(y / len, 0., 1.), facet = x > 0. ? .55 : 1.; vec3 steel = mix(vec3(.02, .04, .1), vec3(.16, .26, .46), facet * (1. - along) * (1. - along)) + LIGHT * .5 * pow(1. - along, 6.);
  float inner = ln(d + .42, .0035 / sc, aa / sc), ridge = ln(x, .003, aa) * step(0., yy + b * .6) * step(d, -.05);
  vec3 c = steel + LIGHT * (inner * .55 + ridge * .5) + LIGHT * ln(dist, .0055, aa) * 1.5; col = mix(col, c * (1. + 2.5 * land), body * min(prog * 3., 1.)); glow += LIGHT * exp(-max(dist, 0.) * 40.) * (.13 + 1.3 * land) * min(prog * 3., 1.);
}
void emblem(vec2 p, float aa, inout vec3 col){                                                 // 큰 넷은 x, 작은 넷은 +, 광선 고리가 묶고, 가운데는 속 빈 솔 고리와 불꽃
  vec2 q = (p - uEmbC) / uEmbS; float r = length(q), an = atan(q.y, q.x), a2 = aa / uEmbS; vec3 glow = vec3(0.);
  float rays = pow(.5 + .5 * sin(an * 8. + 1.57), 6.) * .6 + pow(.5 + .5 * sin(an * 17. + uT * .3), 10.) * .4 + pow(.5 + .5 * sin(an * 31. - uT * .4), 14.) * .3;
  col += LIGHT * (rays * exp(-r * 1.7) * .2 + .016 / (r * r + .07)) * uBurstK;
  if (uSig > 0.){ vec2 h = (q - vec2(0., -.12)) / 1.25; col += LIGHT * sigil(h, a2 / 1.25, uT * .05) * .11 * uSig * smoothstep(1.2, .6, length(h)); }   // 조각들 뒤의 옅은 후광 문양
  shard(q, 1.5708, .66, .125, uShardP[4], uShardL[4], a2, col, glow); shard(q, 4.7124, .52, .115, uShardP[5], uShardL[5], a2, col, glow); shard(q, 0., .48, .105, uShardP[6], uShardL[6], a2, col, glow); shard(q, 3.1416, .48, .105, uShardP[7], uShardL[7], a2, col, glow);
  shard(q, .62, 1.22, .2, uShardP[0], uShardL[0], a2, col, glow); shard(q, 2.5216, 1.22, .2, uShardP[1], uShardL[1], a2, col, glow); shard(q, 3.93, .9, .17, uShardP[2], uShardL[2], a2, col, glow); shard(q, 5.495, .9, .17, uShardP[3], uShardL[3], a2, col, glow);
  col += glow;
  if (uRingK > 0.){ float tk = abs(fract(an / TAU * 64. + uT * .02) - .5), lenr = .05 + .07 * hash(vec2(floor(an / TAU * 64. + uT * .02), 3.)); float ray = ln(tk / 64. * TAU * r, .0035, a2) * step(.44, r) * step(r, .44 + lenr);   // 조각들을 묶는 광선 고리
    col += LIGHT * (ln(r - .44, .005, a2) * 1.2 + ray * .9 + ln(r - .4, .0018, a2) * .6) * uRingK; }
  if (uCoreK > 0.){ float sol = ln(r - .135, .02, a2), fl = fbm(q * 9. + vec2(0., -uT * 1.6)), flame = smoothstep(.11, .0, r - .05 * fl) ;                        // 속 빈 솔 고리 + 불꽃으로 덮인 핵
    col += (LIGHT * sol * 2.2 + vec3(.8, .9, 1.) * flame * (1.2 + 1.5 * fl) + LIGHT * .01 / (r * r + .008)) * uCoreK; }
}
#endif
void main(){
  float asp = uRes.x / uRes.y, aa = 2.4 / uRes.y; vec2 p = (vUv - .5) * vec2(asp, 1.) * 2.; vec3 col = NAVY * (.4 + .6 * smoothstep(1., -1., p.y));
#if SHOT == 0
  float r = length(p), an = atan(p.y, p.x);
  { vec2 g = vUv * uRes / (uRes.y / 60.), id = floor(g), f = fract(g) - .5; float h = hash(id); col += LIGHT * step(.93, h) * smoothstep(.16 * hash(id + 3.) + .05, 0., length(f - (vec2(hash(id + 1.3), hash(id + 2.9)) - .5) * .7)) * (.2 + .8 * hash(id + 7.)) * uDust * (.6 + .4 * sin(uT * 2. + h * 40.)); }          // 먼 먼지별
  if (uVortex > 0.){ float tw = an + 2.6 * log(r + .04) + uT * .9, sw = fbm(vec2(cos(tw), sin(tw)) * 2.2 + vec2(r * 3. + uT * 1.4, 0.)), arm = pow(.5 + .5 * sin(tw * 3. + sw * 4.), 3.);   // 별로 빨려드는 소용돌이
    col += LIGHT * sw * arm * smoothstep(1.5, .15, r) * smoothstep(.0, .3, r) * .55 * uVortex; }
  if (uSig > 0.){ vec2 q = p / uSigScale; float a2 = aa / uSigScale, l = 0.;
    if (uSigBlur > .02){ for (int i = uZero; i < 6; i++){ float fi = float(i) - 2.5; l += sigil(rot(fi * .09 * uSigBlur) * q * (1. + fi * .03 * uSigBlur), a2 * (1. + 14. * uSigBlur), uT * .06); } l /= 6.; l *= 1. + .3 * uSigBlur; }   // 소용돌이에서 또렷해지는 문양
    else l = sigil(q, a2, uT * .06);
    float tx = texture(uRing, rot(-uT * .04) * q * .5 + .5).r * (1. - uSigBlur) * step(length(q), 1.); col += (LIGHT * (l * 1.25 + tx * .95) * uSig + LIGHT * exp(-abs(length(q) - .85) * 5.) * .08 * uSig) * (1. - .88 * uBand * smoothstep(.17, .09, abs(p.y))); }
  col += vec3(.75, .88, 1.) * chainAt(p, vec2(-1.95, -.35), normalize(vec2(1., -.62)), uChain[0], aa) + vec3(.75, .88, 1.) * chainAt(p, vec2(1.95, -.95), normalize(vec2(-.42, 1.)), uChain[1], aa)
       + vec3(.75, .88, 1.) * chainAt(p, vec2(.35, 1.2), normalize(vec2(1., -.48)), uChain[2], aa);
  if (uStar > 0.){ float d = star4(p * vec2(1., 1.18), uStar), core = clamp(-d / aa + .5, 0., 1.);                                                        // 별
    col += vec3(.82, .92, 1.) * core * 2.4 * uStarI + LIGHT * (exp(-max(d, 0.) * 9. / (uStar + .2)) * .55 + .012 / (r * r + .01) * uStar + exp(-abs(p.y) * 60.) * exp(-abs(p.x) * 1.4 / (uStar + .3)) * .5) * uStarI; }
#endif
#if SHOT == 1
  vec2 pc = p / (1. + .12 * uRise); float rr = length(pc - uEmbC); col = mix(vec3(.02, .042, .095), vec3(.008, .016, .04), smoothstep(.0, 1.1, abs(p.y)));
  col += LIGHT * (.02 / (rr * rr + .03) * (.25 + uGlow) + exp(-rr * 1.3) * .06 * uGlow);                                                                  // 구름 너머의 빛
  col += LIGHT * sigil(pc / 1.9, aa / 1.9, uT * .02) * .05;                                                                                              // 아득히 큰 문양
  float far = fbm(pc * 1.1 + vec2(3., uT * .05 + uRise * .6) + fbm(pc * 2.3 + uT * .03) * .8); col = mix(col, vec3(.006, .011, .026) * (1. + 2. * uGlow / (1. + rr * 2.)), smoothstep(.42, .72, far) * .85 * uCloud);
  vec3 lit = vec3(0.); float litSum = 0.;
  for (int i = uZero; i < 12; i++){ vec4 s = uShaft[i]; if (s.w <= 0.) continue; float xs = pc.x - s.x - s.z * pc.y, w = s.y, band = smoothstep(w, w * .3, abs(xs)), core = smoothstep(w * .3, 0., abs(xs));   // 빛줄기
    float st = .75 + .25 * fbm(vec2(xs * 60., pc.y * .7 - uT * .6 + float(i))); lit += (LIGHT * band * .75 + vec3(.9, .96, 1.) * core * .9) * s.w * st; litSum += band * s.w; }
  col += lit;
  emblem(pc, aa, col);
  if (uSword > 0.){ vec2 q = (pc - uEmbC) / .95; float w = .062 * (1. - smoothstep(-.78, -1.02, q.y)) * (1. - .25 * smoothstep(-.1, -.78, q.y)), dB = max(abs(q.x) - w, max(q.y - .06, -1.02 - q.y));                          // 홀로 남은 검: 어두운 윤곽 · 빛에 물든 테두리 · 빛이 차오르는 혈조
    float gx = abs(q.x), dG = max(sdBox(q - vec2(0., .085), vec2(.25 - .6 * abs(q.y - .085), .028)), -1.), dW = length(vec2(max(gx - .2, 0.), q.y - .085 - (gx - .1) * .35)) - .02 * (1. - smoothstep(.2, .34, gx));
    float dH = sdBox(q - vec2(0., .27), vec2(.02, .17)), dP = abs(q.x) + abs(q.y - .49) - .055, d = min(min(dB, min(dG, dW)), min(dH, dP)), a2 = aa / .95, body = clamp(-d / a2 + .5, 0., 1.) * uSword;
    float edge = ln(d, .004, a2), fuller = ln(q.x, .0045, a2) * step(q.y, .0) * step(-.86 * uCharge, q.y) * step(-.9, q.y), runes = step(.6, hash(vec2(floor(q.y * 26.), 5.))) * ln(abs(q.x) - .028, .0025, a2) * step(q.y, -.05) * step(-.7 * uCharge, q.y);

    gl.uniform1f(u.uFlash, flash * flash); gl.uniform1f(u.uWhite, clamp(white)); gl.uniform1f(u.uFade, Math.max(1 - seg(t, .1, 1.2), eInOut(seg(t, T.OUT + .35, T.END - .25)))); });
}
