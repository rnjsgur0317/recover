     0      어둠과 바람, 멀리 작은 빛 하나

     19.62  점화: 정면 — 큰 날개 조각 넷(x) 19.62 19.90 20.23 20.46 · 작은 조각 넷(+) 21.11 21.45 21.87 22.27 이 타격점마다 날아와 검 뒤에 자리 잡고, 22.82 광선 고리가 묶는다   20.2 "As long as you're with me…"
     24.52  백색 → 아우라: 바닥의 두 문양 위에 떠 있는 검 · 여덟 날개 조각 · 광선 고리 · 속 빈 솔 고리와 불꽃 · 거대한 창 · 제목
     27.0   빛이 차올랐다가 암전 → 28.1 끝

   전부 시간의 함수(상태 없음). 시계·HUD·시작/종료 화면은 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t, eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const T = { WORDS: [3.13, 3.65, 4.13], TEXTOUT: 5.7, STAR: 6.32, CHAINS: [6.69, 6.9, 7.08], BURST: 9.66, SWORD: 14.77, SURGE: 16.44, IGNITE: 19.62,
  BIG: [19.62, 19.9, 20.23, 20.46], SMALL: [21.11, 21.45, 21.87, 22.27], RING: 22.82, FINAL: 24.52, OUT: 26.9, END: 28.1 };
const LINES = [{ a: 10.9, b: 14.45, en: "Well, you finally reached me.", ko: "드디어 내게 왔군." }, { a: 15.2, b: 19.35, en: "Now, don't be afraid of the dark.", ko: "이제 어둠을 두려워하지 마." }, { a: 20.2, b: 24.35, en: "As long as you're with me…", ko: "네가 나와 함께라면…" }];
const D = window.LUM_DATA || { fps: 30, total: [], high: [], onsets: [] };
const dat = (arr, t) => { const x = t * D.fps, i = Math.floor(x); return i < 0 || !arr.length ? 0 : lerp(arr[Math.min(arr.length - 1, i)], arr[Math.min(arr.length - 1, i + 1)], x - i); };

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm"), tcv = document.createElement("canvas"), tg = tcv.getContext("2d"), rcv = document.createElement("canvas");
let Wd = 0, Hd = 0, U = 0, DPR = 1, DPR_CAP = 1.5, SCALE = .72, slow = 0, time = 0, X = null, P = {}, RT = {}, txtTex = null, ringTex = null;

/* ═════════════════ 셰이더 ═════════════════ */
const GLSL_COMMON = `
${CSGL.NOISE}
#define TAU 6.28318
const vec3 LIGHT = vec3(.62, .8, 1.), NAVY = vec3(.004, .008, .022);
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float ln(float d, float w, float aa){ return clamp((w - abs(d)) / aa + .5, 0., 1.); }
float sdBox(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, d.y), 0.); }
float star4(vec2 p, float s){ p = abs(p) / s; return (pow(p.x, .45) + pow(p.y, .45) - 1.) * s * .5; }                         // 네 갈래 별 (안쪽 < 0)
/* 문양: 겹고리 · 엇갈린 두 정사각(팔각 별) · 안쪽 두 정사각 · 눈금. 바깥 고리 반지름 = 1. 글자 고리는 텍스처(uRing) */
float sigil(vec2 p, float aa, float spin){
  float r = length(p), l = max(max(ln(r - 1., .011, aa), ln(r - .955, .004, aa)), max(ln(r - .745, .008, aa), ln(r - .715, .003, aa)));
  vec2 q = rot(spin) * p; float h = .715 / 1.41421; l = max(l, max(ln(sdBox(q, vec2(h)), .0055, aa), ln(sdBox(rot(.7854) * q, vec2(h)), .0055, aa)));
  vec2 q2 = rot(-spin * 1.6) * p; l = max(l, max(ln(sdBox(q2, vec2(.355)), .0045, aa), ln(sdBox(rot(.7854) * q2, vec2(.355)), .0045, aa)));
  l = max(l, max(ln(r - .335, .006, aa), ln(r - .2, .003, aa)));
  float tk = abs(fract(atan(p.y, p.x) / TAU * 72. + spin) - .5) / 72. * TAU * r; return max(l, ln(tk, .004, aa) * step(.955, r) * step(r, 1.));
}`;
const FS_SCENE = (shot) => `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
#define SHOT ${shot}
uniform vec2 uRes; uniform float uT, uLvl; uniform sampler2D uRing; uniform int uZero;
uniform float uSig, uSigBlur, uSigScale, uStar, uStarI, uVortex, uDust, uBand;                       // 0: 문양 · 별 · 소용돌이
uniform vec3 uChain[3];                                                                        //    사슬: 뻗은 정도 · 떨림 · 밝기
${GLSL_COMMON}
#if SHOT == 0
float chainAt(vec2 p, vec2 a, vec2 dir, vec3 c, float aa){                                     // 사슬: 마주 보는 고리와 옆으로 선 고리가 번갈아
  if (c.x <= 0.) return 0.; float u = dot(p - a, dir), v = dot(p - a, vec2(-dir.y, dir.x)) + sin(u * 11. + uT * 38.) * c.y; if (u < -.06 || u > c.x) return 0.;
  float L = .078, k0 = floor(u / L), m = 0.;
  for (int i = uZero - 1; i <= 1; i++){ float k = k0 + float(i), f = u - (k + .5) * L; if ((k + .5) * L > c.x) continue; bool odd = mod(k, 2.) > .5;
    float d = odd ? length(vec2(max(abs(f) - .032, 0.), v)) - .0085 : abs(length(vec2(max(abs(f) - .027, 0.), v)) - .024) - .0078; m = max(m, clamp(-d / aa + .5, 0., 1.) * (odd ? .8 : 1.)); }
  return m * c.z; }
#endif
#if SHOT == 1
uniform vec3 uCamPos, uSwP, uLightP, uEmbC3, uEmbN; uniform mat3 uCam, uSwR; uniform float uFocal, uSwS, uCharge, uEmit, uHeat, uDebris, uEmbS, uRingK, uCoreK, uFloorK, uFloorY, uSpearK, uFogK;
uniform vec4 uSeed[5], uFlare[4]; uniform vec2 uWing[8];
const float WANG[8] = float[8](.62, 2.5216, 3.93, 5.495, 1.5708, 4.7124, 0., 3.1416), WLEN[8] = float[8](1.22, 1.22, .9, .9, .66, .52, .48, .48), WWID[8] = float[8](.2, .2, .17, .17, .125, .115, .105, .105);
mat3 rotY3(float a){ float c = cos(a), s = sin(a); return mat3(c, 0., -s, 0., 1., 0., s, 0., c); }
mat3 rotX3(float a){ float c = cos(a), s = sin(a); return mat3(1., 0., 0., 0., c, s, 0., -s, c); }
mat3 rotZ3(float a){ float c = cos(a), s = sin(a); return mat3(c, s, 0., -s, c, 0., 0., 0., 1.); }
float sdBox3(vec3 p, vec3 b){ vec3 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, max(d.y, d.z)), 0.); }
/* 날개 조각(3D): 네 변이 안으로 휜 길쭉한 마름모 판 — 가운데가 두껍고 가장자리로 갈수록 얇아지는 보석 단면 */
float sdWing(vec3 p, float len, float wid){ float yc = .27 * len, yy = p.y - yc, b = yy > 0. ? .73 * len : .27 * len, a = p.x > 0. ? wid : wid * .55;
  float d = (pow(abs(p.x) / a, .86) + pow(abs(yy) / b, .86) - 1.) * min(a, b) * .38, th = .03 * (1. - clamp(abs(p.x) / a, 0., 1.)) + .005; return max(d, abs(p.z) - th); }   // 거듭제곱 꼴이라 거리 과대평가 → 얇은 판을 뚫고 지나가지 않게 .38 로 줄임
/* 수정 검(검 좌표: y 가 날 방향, 0 = 코등이, 2.6 = 끝): 마름모 단면의 날 · 코등이와 젖힌 끝 · 감은 손잡이 · 팔면체 자루끝 */
float sdSword(vec3 p, out float part){
  float L = 2.6, ky = clamp(p.y / L, 0., 1.), tip = smoothstep(1.5, L, p.y), w = .17 * (1. - .12 * ky) * (1. - tip) + .004, th = .05 * (1. - .15 * ky);
  float dB = max(max(abs(p.z) + abs(p.x) * th / w - th, abs(p.x) - w), max(.02 - p.y, p.y - L));
  float dG = sdBox3(p - vec3(0., -.03, 0.), vec3(.5, .05, .075)); dG = min(dG, sdBox3(rotZ3(-.4) * (p - vec3(.56, .04, 0.)), vec3(.13, .04, .06))); dG = min(dG, sdBox3(rotZ3(.4) * (p - vec3(-.56, .04, 0.)), vec3(.13, .04, .06)));
  float dH = max(length(p.xz) - (.062 + .01 * sin(p.y * 46.)), max(-.74 - p.y, p.y + .08)), dP = (abs(p.x) + abs(p.y + .86) + abs(p.z)) * .577 - .12;
  float dM = min(dG, min(dH, dP)); part = dB < dM ? 1. : 2.; return min(dB, dM);
}
vec2 map(vec3 p){
  vec3 q = (p - uSwP) * uSwR / uSwS; float part; vec2 r = vec2(sdSword(q, part) * uSwS, part);
  vec3 e = q - vec3(0., 1.05, -.16);
  for (int i = uZero; i < 8; i++){ vec2 wg = uWing[i]; if (wg.x <= 0.) continue; float a = WANG[i]; vec2 dir = vec2(cos(a), sin(a)); float off = (.2 + .03 * sin(uT * 2.2 + float(i)) + (1. - wg.x) * 3.4) * uEmbS;     // 여덟 날개 조각: 검 뒤 평면에서 x · + 로
    vec2 e2 = e.xy - dir * off; vec3 w = vec3(dot(e2, vec2(-dir.y, dir.x)) * (a > 1.5708 && a < 4.7124 ? -1. : 1.), dot(e2, dir), e.z + (1. - wg.x) * .9) / uEmbS;
    float dw = sdWing(rotX3((1. - wg.x) * 1.4) * w, WLEN[i], WWID[i]) * uEmbS * uSwS; if (dw < r.x) r = vec2(dw, 3. + float(i) * .01); }
  for (int i = uZero; i < 5; i++){ vec4 sd = uSeed[i]; if (sd.w <= 0.) continue; vec3 v = p - sd.xyz;                                                                                        // 혼돈의 씨앗: 일렁이는 검은 구
    float ds = length(v) - sd.w * (1. + .2 * sin(v.x * 9. / sd.w + uT * 2.) * sin(v.y * 8. / sd.w - uT * 1.5) * sin(v.z * 10. / sd.w + uT)); if (ds < r.x) r = vec2(ds, 4.); }
  if (uDebris > 0.){ float C = 2.6; vec3 id = floor(p / C), lp = p - (id + .5) * C; float h = hash(id.xy + id.z * 7.1);                                                               // 잔해: 부서진 동족의 날개 조각들이 어둠에 떠돈다
    if (h > 1. - .55 * uDebris && length(p - uSwP) > 2.4 * uSwS){ vec3 o = (vec3(hash(id.xy + 1.), hash(id.yz + 2.), hash(id.xz + 3.)) - .5) * 1.3; float sz = .22 + .5 * hash(id.xy + 5.);
      vec3 lq = rotX3(h * 9. + uT * .12) * rotY3(h * 6.28 + uT * (.08 + .15 * h)) * (lp - o); float dd = sdWing(lq / sz, 1., .22) * sz; if (dd < r.x) r = vec2(dd, 5.); } }
  if (uSpearK > 0.){ vec3 sp = rotZ3(.1) * (q - vec3(.15, -1.72, .55)); float hx = sp.x + 1.9, dS = max(length(sp.yz) - .038, abs(sp.x) - 1.9);                                        // 거대한 창: 자루 · 창날 · 꼬리 날
    float dHd = max(abs(hx) * .3 + abs(sp.y) + abs(sp.z) * 1.6 - .22, abs(hx) - .72), dT = abs(sp.x - 1.9) * .45 + abs(sp.y) + abs(sp.z) * 1.6 - .09, dSp = min(dS, min(dHd, dT)) * uSwS; if (dSp < r.x) r = vec2(dSp, 6.); }
  return r;
}
vec3 normalAt(vec3 p){ vec3 n = vec3(0.); for (int i = uZero; i < 4; i++){ vec3 e = .5773 * (2. * vec3(float(((i + 3) >> 1) & 1), float((i >> 1) & 1), float(i & 1)) - 1.); n += e * map(p + .0015 * e).x; } return normalize(n); }
float aoAt(vec3 p, vec3 n){ float a = 0., s = 1.; for (int i = uZero; i < 4; i++){ float h = .02 + .06 * float(i); a += (h - map(p + n * h).x) * s; s *= .7; } return clamp(1. - 3. * a, 0., 1.); }
vec3 bgCol(vec3 rd){ vec3 c = NAVY * (.6 + .6 * smoothstep(1., -1., rd.y)); vec2 sp = vec2(atan(rd.z, rd.x), asin(clamp(rd.y, -1., 1.))) * 26.; vec2 id = floor(sp), f = fract(sp) - .5; float h = hash(id);
  c += LIGHT * step(.955, h) * smoothstep(.12 + .12 * hash(id + 3.), 0., length(f - (vec2(hash(id + 1.3), hash(id + 2.9)) - .5) * .6)) * (.15 + .85 * hash(id + 7.)) * (.6 + .4 * sin(uT * 1.5 + h * 40.)); return c; }
vec3 shade(vec3 p, vec3 n, vec3 rd, float id, float ao){
  vec3 lv = uLightP - p, l = normalize(lv); float dl = length(lv), att = uEmit * 2.2 / (1. + dl * dl * .3), ndl = max(dot(n, l), 0.), spec = pow(max(dot(n, normalize(l - rd)), 0.), 80.), fres = pow(1. - max(dot(n, -rd), 0.), 4.);
  vec3 refl = reflect(rd, n), envR = mix(vec3(.008, .016, .04), vec3(.3, .45, .75), .5 + .5 * refl.y) + LIGHT * pow(max(dot(refl, l), 0.), 30.) * uEmit * .8;
  if (id < 1.5){ vec3 q = (p - uSwP) * uSwR / uSwS; float along = clamp(q.y / 2.6, 0., 1.), lit = clamp((uCharge - along) * 10., 0., 1.), front = exp(-abs(uCharge - along) * 18.) * step(.01, uCharge) * (1. - step(.995, uCharge));        // 검날: 어두운 수정 · 혈조에 차오르는 빛 · 능선의 빛
    float fuller = smoothstep(.035, .012, abs(q.x)) * step(.15, q.y) * step(q.y, 2.1), ridge = smoothstep(.3, 0., abs(n.z)) + smoothstep(.2, 0., abs(abs(n.x) - 1.)) * .0;
    vec3 c = vec3(.01, .02, .045) * (1. + 2. * ao) + envR * (.2 + .8 * fres) * .55 + LIGHT * spec * (1. + 1.2 * uEmit);
    c += LIGHT * (fuller * (.4 + 1.4 * lit) + lit * (.08 + .22 * uHeat) + front * 2.5 + ridge * (.1 + .4 * lit + .2 * uEmit)); return c; }
  if (id < 2.5){ vec3 c = vec3(.05, .07, .12) * (.4 + .6 * ao) + envR * .45 + LIGHT * (spec * 1.8 + ndl * att * .35); return c; }                                                                                   // 코등이 · 손잡이: 금속
  if (id < 3.5){ int wi = int((id - 3.) * 100. + .5); float land = uWing[wi].y; vec3 c = vec3(.012, .022, .05) * (1. + 2. * ao) + envR * (.15 + .85 * fres) * .6 + LIGHT * spec * (1.2 + 2. * uEmit);                    // 날개 조각: 수정 — 능선과 가장자리에 빛, 내려앉을 때 번쩍
    c += LIGHT * (smoothstep(.35, 0., abs(n.z)) * (.2 + .6 * uHeat) + (.06 + .4 * uHeat) * (1. - fres) * (.7 + .3 * step(0., n.x * n.y)) + land * 2.5); return c; }
  if (id < 4.5){ return vec3(.002, .002, .005) + vec3(.05, .025, .1) * fres * fres + LIGHT * spec * att * .2; }                                                                                                  // 씨앗: 검은 구, 가장자리에 옅은 보랏빛
  if (id < 5.5){ return vec3(.006, .012, .03) * (1. + ao) + envR * fres * .7 + LIGHT * (spec * 1.6 + ndl * .15) * att; }                                                                                   // 잔해
  return vec3(.55, .65, .9) * (.35 + .65 * ndl + .3 * fres) + LIGHT * spec * 3.;                                                                                                                          // 창
}
float floorPattern(vec2 fp, float aa){ vec2 w = vec2(aa) * 1.3, g = smoothstep(w, vec2(0.), abs(fract(fp * .7 - .5) - .5) / .7); float l = max(g.x, g.y) * .07;
  return l + sigil(fp / 2.9, aa / 2.9, uT * .08) * .5 + sigil(rot(.4) * fp / 4.6, aa / 4.6, -uT * .05) * .22; }
#endif
void main(){
  float asp = uRes.x / uRes.y, aa = 2.4 / uRes.y; vec2 p = (vUv - .5) * vec2(asp, 1.) * 2.; vec3 col = NAVY * (.4 + .6 * smoothstep(1., -1., p.y));
#if SHOT == 0
  float r = length(p), an = atan(p.y, p.x);
