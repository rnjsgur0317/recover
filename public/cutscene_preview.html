<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히든 컷씬 테스트 — 다섯 번째 봉인</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: #0b0b0f; color: #e4e4e7;
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.demo { max-width: 460px; width: 100%; background: #15151b; border: 1px solid #26262e; border-radius: 16px; padding: 26px 24px; }
.demo h1 { margin: 0 0 6px; font-size: 1.15rem; }
.demo p { margin: 0 0 18px; color: #8b8b96; font-size: .86rem; line-height: 1.6; }
.demo label { display: block; font-size: .78rem; font-weight: 600; color: #8b8b96; margin: 12px 0 6px; }
.demo select { width: 100%; background: #0e0e13; color: #e4e4e7; border: 1px solid #30303a; border-radius: 9px; padding: 11px 12px; font-size: .92rem; font-family: inherit; }
.demo .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .86rem; color: #b4b4be; }
.demo button.play {
  width: 100%; margin-top: 18px; border: 0; border-radius: 11px; padding: 14px; font-size: 1rem; font-weight: 800; cursor: pointer;
  color: #fff; background: linear-gradient(180deg, #e11d48, #9f1239); box-shadow: 0 8px 24px rgba(225,29,72,.35); font-family: inherit;
}
.demo .note { margin-top: 14px; font-size: .76rem; color: #6b6b76; }

/* ── 컷씬 오버레이 ── */
.cs { position: fixed; inset: 0; z-index: 9999; background: #000; overflow: hidden; opacity: 0; transition: opacity .7s; }
.cs.on { opacity: 1; }
.cs[hidden] { display: none; }
.cs canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cs-bar { position: absolute; left: 0; right: 0; height: 11vh; background: #000; z-index: 3; transform: scaleY(0); transition: transform 1.1s cubic-bezier(.6,0,.2,1); }
.cs-bar.top { top: 0; transform-origin: top; } .cs-bar.bottom { bottom: 0; transform-origin: bottom; }
.cs.on .cs-bar { transform: scaleY(1); }
.cs-sub {
  position: absolute; left: 0; right: 0; bottom: calc(11vh + 26px); z-index: 4; text-align: center; padding: 0 20px;
  font-family: "Nanum Myeongjo", "Noto Serif KR", "Batang", "바탕", serif; font-size: clamp(1rem, 2.4vw, 1.45rem); letter-spacing: .06em;
  color: #f4f4f5; text-shadow: 0 2px 14px #000, 0 0 30px rgba(0,0,0,.9); opacity: 0; transform: translateY(8px);
  transition: opacity .8s ease, transform .8s ease;
}
.cs-sub.show { opacity: 1; transform: translateY(0); }
.cs-sub .c1 { color: #b9bcc6; } .cs-sub .c2 { color: #7fb0ff; } .cs-sub .c3 { color: #b89bff; } .cs-sub .c4 { color: #ffc95e; } .cs-sub .c5 { color: #ff5d7d; }
.cs-skip {
  position: absolute; right: 18px; top: calc(11vh + 14px); z-index: 6; background: rgba(0,0,0,.35); color: #d4d4d8; border: 1px solid rgba(255,255,255,.25);
  border-radius: 999px; padding: 7px 14px; font-size: .78rem; cursor: pointer; font-family: inherit; backdrop-filter: blur(4px);
}
.cs-skip:hover { border-color: #fff; color: #fff; }
.cs-card {
  position: absolute; left: 50%; top: 40%; z-index: 5; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center; width: min(88vw, 520px);
  transition: transform .9s cubic-bezier(.2,1.5,.35,1), opacity .7s ease; pointer-events: none;
}
.cs-card.show { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
.cs-badge {
  display: inline-block; font-size: .78rem; font-weight: 900; letter-spacing: .5em; padding: 6px 14px 6px 22px; border-radius: 999px;
  color: #fff; background: linear-gradient(90deg, #9f1239, #e11d48, #9f1239); box-shadow: 0 0 26px rgba(225,29,72,.7);
}
.cs-over { margin-top: 16px; font-family: "Nanum Myeongjo", "Batang", serif; font-size: clamp(.9rem, 2vw, 1.05rem); letter-spacing: .3em; color: #f3d9a4; text-shadow: 0 0 18px rgba(0,0,0,.9); }
.cs-item {
  margin-top: 10px; font-size: clamp(1.9rem, 6vw, 3.4rem); font-weight: 900; letter-spacing: -.01em; line-height: 1.15;
  background: linear-gradient(100deg, #fff4d6 0%, #ffd166 22%, #fff 40%, #ff8fa3 58%, #ffd166 78%, #fff4d6 100%); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: cs-shine 3.2s linear infinite;
  filter: drop-shadow(0 4px 22px rgba(225,29,72,.55));
}
@keyframes cs-shine { 0% { background-position: 200% 0; } 100% { background-position: -20% 0; } }
.cs-desc { margin-top: 12px; font-size: .88rem; color: #e4e4e7; text-shadow: 0 1px 10px #000; }
.cs-ok {
  margin-top: 22px; border: 1px solid rgba(255,255,255,.55); background: rgba(0,0,0,.35); color: #fff; border-radius: 999px; padding: 11px 38px;
  font-size: .95rem; font-weight: 700; cursor: pointer; font-family: inherit; backdrop-filter: blur(4px); opacity: 0; transition: opacity .8s 1.4s, background .2s;
}
.cs-card.show .cs-ok { opacity: 1; }
.cs-ok:hover { background: rgba(255,255,255,.18); }
</style>
</head>
<body>

<div class="demo">
  <h1>히든 컷씬 테스트 — 「다섯 번째 봉인」</h1>
  <p>최상급(히든) 보상이 나왔을 때 재생할 컷씬 시안입니다. 약 21초, 건너뛰기 가능. 사이트에는 아직 연결하지 않은 독립 페이지예요.</p>
  <label>뽑힌 보상 (예시)</label>
  <select id="demoItem">
    <option>잔액 30,000원</option>
    <option>게임패스 30일권</option>
    <option>게임 50% 할인쿠폰</option>
    <option>잔액 50,000원</option>
  </select>
  <div class="row"><input type="checkbox" id="demoSound" checked> <label for="demoSound" style="margin:0;color:inherit">효과음 켜기 (브라우저에서 합성)</label></div>
  <button class="play" id="demoPlay">▶ 컷씬 재생</button>
  <div class="note">팁: 주소 뒤에 <code>?t=17.4</code> 처럼 붙이면 그 시점의 정지 화면을 볼 수 있어요 (검수용).</div>
</div>

<div class="cs" id="cs" hidden>
  <canvas id="csCanvas"></canvas>
  <div class="cs-bar top"></div><div class="cs-bar bottom"></div>
  <button class="cs-skip" id="csSkip">건너뛰기 ▸▸</button>
  <div class="cs-sub" id="csSub"></div>
  <div class="cs-card" id="csCard">
    <span class="cs-badge">HIDDEN</span>
    <div class="cs-over">다섯 번째 봉인의 주인</div>
    <div class="cs-item" id="csItem">잔액 30,000원</div>
    <div class="cs-desc" id="csDesc">히든 등급 보상을 획득했습니다</div>
    <button class="cs-ok" id="csOk">확인</button>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   히든 컷씬 「다섯 번째 봉인」
   사용법: playHiddenCutscene({ item: "잔액 30,000원", sound: true, onDone(){} })
   타임라인(초):  0 암전→별   4.5 상자 등장·네 봉인   8.4~10.8 봉인 해제
                 12.2 다섯 번째 봉인·심장박동   14.5 균열   16.8 파열·개봉
                 20.2 보상 카드
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3);
const eIn = (t) => t * t * t;
const eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const T = { boxIn: 4.5, seals: [8.4, 9.3, 10.1, 10.8], fifth: 12.2, crack: 14.5, burst: 16.8, lid: 16.95, reveal: 20.2 };
const HEART = [12.8, 13.9, 14.8, 15.5, 16.0, 16.35, 16.6];
const SEAL_COLORS = ["#b9bcc6", "#5b9bff", "#a57bff", "#ffb938"];
const CRIMSON = "#ff2d55";
const SUBS = [
  { a: 0.9, b: 4.2, html: "아주 오래전, 상자 하나가 별들 사이에 버려졌다." },
  { a: 4.8, b: 7.9, html: "누구도 열지 못하도록, 네 겹의 봉인과 함께." },
  { a: 8.3, b: 11.7, html: '수많은 손이 봉인을 풀어냈다. <span class="c1">잿빛</span>, <span class="c2">푸른빛</span>, <span class="c3">보랏빛</span>, <span class="c4">황금빛</span> —' },
  { a: 12.4, b: 16.2, html: '하지만 <span class="c5">다섯 번째 봉인</span>은, 아무도 본 적이 없었다.' },
  { a: 17.7, b: 20.0, html: "…오늘, 당신이 열기 전까지는." },
];

const el = (id) => document.getElementById(id);
const cv = el("csCanvas"), g = cv.getContext("2d");
let W = 0, H = 0, U = 0, DPR = 1, nebulaA = null, nebulaB = null;
let stars = [], parts = [], cracks = [], events = [], time = 0, running = false, raf = 0, startAt = 0, offset = 0, subIdx = -1, opts = {}, audio = null;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight; U = Math.min(W, H) / 10;
  cv.width = W * DPR; cv.height = H * DPR;
  nebulaA = makeNebula([["#1b2a6b", .3, .35, .55], ["#3b1b6b", .72, .6, .5], ["#0c3a55", .5, .85, .45]], 11);
  nebulaB = makeNebula([["#7a0b26", .5, .5, .7], ["#4a0620", .2, .3, .45], ["#a3123a", .8, .72, .4]], 23);
}
function makeNebula(blobs, seed) {
  const c = document.createElement("canvas"); c.width = 480; c.height = 480 * (H / W || 1);
  const x = c.getContext("2d"); const r = rng(seed);
  for (const [col, px, py, rad] of blobs) {
    const gr = x.createRadialGradient(px * c.width, py * c.height, 0, px * c.width, py * c.height, rad * c.width);
    gr.addColorStop(0, col); gr.addColorStop(1, "transparent");
    x.globalAlpha = .55 + r() * .25; x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
  }
  return c;
}

function init() {
  const r = rng(7);
  stars = Array.from({ length: 420 }, () => ({ x: r() * 2 - 1, y: r() * 2 - 1, z: .25 + r() * .75, ph: r() * TAU }));
  // 균열: 중심에서 바깥으로 뻗는 들쭉날쭉한 선 + 곁가지
  cracks = [];
  const rc = rng(99);
  for (let i = 0; i < 11; i++) {
    let ang = i / 11 * TAU + (rc() - .5) * .4, x = 0, y = 0;
    const pts = [[0, 0]];
    for (let k = 0; k < 16; k++) {
      ang += (rc() - .5) * .9;
      const step = .45 + rc() * .55;
      x += Math.cos(ang) * step; y += Math.sin(ang) * step;
      pts.push([x, y]);
      if (k > 3 && rc() < .28) {            // 곁가지
        let bx = x, by = y, ba = ang + (rc() < .5 ? 1 : -1) * (.6 + rc() * .5); const bp = [[bx, by]];
        for (let j = 0; j < 5; j++) { ba += (rc() - .5) * .8; bx += Math.cos(ba) * .4; by += Math.sin(ba) * .4; bp.push([bx, by]); }
        cracks.push({ pts: bp, start: k / 16 });
      }
    }
    cracks.push({ pts, start: 0 });
  }
  parts = [];
  events = [
    ...T.seals.map((t, i) => ({ t, fn: () => sealBreak(i) })),
    { t: T.burst, fn: bigBurst },
    { t: T.burst + .5, fn: () => ring(1) },
  ].map((e) => ({ ...e, done: false }));
}

/* ── 파티클 ── */
function spawn(p) { parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 1, max: 1, size: 2, color: "#fff", drag: .98, grav: 0, rot: 0, vr: 0, type: "spark" }, p)); }
function sealPos(i, t) {
  const a = i / 4 * TAU + .6 + t * .16;
  return [Math.cos(a) * Math.min(3.5 * U, W * .4), Math.sin(a) * 1.55 * U - .3 * U];
}
function sealBreak(i) {
  const [x, y] = sealPos(i, T.seals[i]); const r = rng(i * 31 + 5);
  for (let k = 0; k < 26; k++) {
    const a = r() * TAU, sp = (1.5 + r() * 5) * U / 10;
    spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, max: .6 + r() * .9, size: (2 + r() * 5) * U / 60, color: SEAL_COLORS[i], type: k % 3 ? "spark" : "shard", rot: r() * TAU, vr: (r() - .5) * .4, drag: .955 });
  }
  parts.push({ type: "ring", x, y, life: .7, max: .7, color: SEAL_COLORS[i], r0: .55 * U, r1: 2.2 * U });
}
function ring(kind) { parts.push({ type: "ring", x: 0, y: boxCenterY(time), life: 1.5, max: 1.5, color: kind ? "#ffd166" : "#fff", r0: .4 * U, r1: Math.hypot(W, H) * .7, wide: true }); }
function bigBurst() {
  const r = rng(404); const cy = boxCenterY(T.burst);
  ring(0);
  for (let k = 0; k < 300; k++) {
    const a = r() * TAU, sp = (2 + r() * r() * 22) * U / 10;
    spawn({ x: 0, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .8, max: 1.4 + r() * 2.8, size: (1.5 + r() * 4.5) * U / 60,
      color: r() < .45 ? CRIMSON : r() < .6 ? "#ffd166" : "#fff", type: k % 5 === 0 ? "shard" : "spark", rot: r() * TAU, vr: (r() - .5) * .5, drag: .972 });
  }
}
function boxCenterY(t) { return lerp(.04, .2, eInOut(seg(t, 18.4, 20.2))) * H + Math.sin(t * .9) * .08 * U; }

function update(t, dt) {
  for (const e of events) if (!e.done && t >= e.t) { e.done = true; e.fn(); }
  // 개봉 후: 상자에서 피어오르는 불씨
  if (t > T.lid + .4) {
    const n = t < 19 ? 3 : 1;
    for (let k = 0; k < n; k++) if (Math.random() < .8) {
      spawn({ x: (Math.random() - .5) * 1.6 * U, y: boxCenterY(t) - .5 * U, vx: (Math.random() - .5) * U / 14, vy: -(1 + Math.random() * 2.4) * U / 9,
        max: 2 + Math.random() * 2.5, size: (1 + Math.random() * 3) * U / 60, color: Math.random() < .5 ? "#ffd166" : CRIMSON, drag: .992, type: "ember" });
    }
  }
  for (const p of parts) {
    p.life -= dt;
    if (p.type === "ring") continue;
    p.vx *= p.drag; p.vy *= p.drag; p.vy += p.grav;
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.rot += p.vr;
    if (p.type === "ember") p.vx += Math.sin(t * 3 + p.y * .02) * .01 * U / 10;
  }
  if (parts.length > 900) parts.splice(0, parts.length - 900);
  parts = parts.filter((p) => p.life > 0);
}

/* ── 3D 상자 투영 ── */
function makeCam(t) {
  const zoom = lerp(1, 1.16, seg(t, 0, T.burst)) + .22 * pulse(t, T.burst, .12, 1.6) - .2 * eInOut(seg(t, 18.4, 20.2));
  const appear = eOut(seg(t, T.boxIn, T.boxIn + 2));
  return { ry: -.55 + .13 * Math.sin(t * .31), rx: -.34 + .04 * Math.sin(t * .23), f: 7, S: U * 1.25 * zoom * lerp(.3, 1, appear), cx: 0, cy: boxCenterY(t), alpha: seg(t, T.boxIn, T.boxIn + 1.4), zoom };
}
function proj(p, c) {
  const cy = Math.cos(c.ry), sy = Math.sin(c.ry), cx = Math.cos(c.rx), sx = Math.sin(c.rx);
  const x1 = p[0] * cy + p[2] * sy, z1 = -p[0] * sy + p[2] * cy;
  const y2 = p[1] * cx - z1 * sx, z2 = p[1] * sx + z1 * cx;
  const s = c.f / (c.f - z2);
  return [c.cx + x1 * c.S * s, c.cy + y2 * c.S * s];
}
function area(q) { let a = 0; for (let i = 0; i < q.length; i++) { const [x1, y1] = q[i], [x2, y2] = q[(i + 1) % q.length]; a += x1 * y2 - x2 * y1; } return a; }
function quad(q, fill, stroke, lw) {
  g.beginPath(); g.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) g.lineTo(q[i][0], q[i][1]); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 2; g.lineJoin = "round"; g.stroke(); }
}
function vGrad(q, c0, c1) {
  const top = [(q[0][0] + q[1][0]) / 2, (q[0][1] + q[1][1]) / 2], bot = [(q[2][0] + q[3][0]) / 2, (q[2][1] + q[3][1]) / 2];
  const gr = g.createLinearGradient(top[0], top[1], bot[0], bot[1]); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr;
}

function drawBox(t, cam) {
  if (cam.alpha <= 0) return;
  const w = 1.15, h = .58, d = .62, open = 1.9 * eBack(seg(t, T.lid, T.lid + .95));
  const glow = seg(t, T.lid, T.lid + .6);
  const P = (x, y, z) => proj([x, y, z], cam);
  const gold = "#e9c46a", lw = Math.max(1.4, cam.S / 42);
  const front = [P(-w, -h, d), P(w, -h, d), P(w, h, d), P(-w, h, d)];
  const right = [P(w, -h, d), P(w, -h, -d), P(w, h, -d), P(w, h, d)];
  const hole = [P(-w, -h, -d), P(w, -h, -d), P(w, -h, d), P(-w, -h, d)];
  // 뚜껑: 경첩(뒷변) 기준 회전. (x, v=아래로, u=경첩에서 앞으로)
  const wl = w + .04, Ud = 2 * d + .05, F = .24;
  const L = (x, v, u) => P(x, -h + v * Math.cos(open) - u * Math.sin(open), -d + u * Math.cos(open) + v * Math.sin(open));
  const lidTop = [L(-wl, 0, 0), L(wl, 0, 0), L(wl, 0, Ud), L(-wl, 0, Ud)];
  const lidFront = [L(-wl, 0, Ud), L(wl, 0, Ud), L(wl, F, Ud), L(-wl, F, Ud)];
  const lidRight = [L(wl, 0, Ud), L(wl, 0, 0), L(wl, F, 0), L(wl, F, Ud)];
  const drawLid = () => {
    const facingUp = area(lidTop) > 0;   // 닫힌 상태의 부호와 같으면 윗면이 보임
    quad(lidTop, facingUp ? vGrad(lidTop, "#2b2530", "#17131b") : vGrad(lidTop, "#5a1024", "#2a0812"), gold, lw);
    if (area(lidRight) > 0) quad(lidRight, "#120f16", gold, lw);
    if (area(lidFront) > 0) quad(lidFront, vGrad(lidFront, "#33293a", "#1a151f"), gold, lw);
  };
  g.save(); g.globalAlpha = cam.alpha;
  // 바닥 그림자 빛
  if (open > .9) drawLid();
  // 상자 속
  if (open > .02) {
    quad(hole, "#08060a");
    if (glow > 0) {
      const c = P(0, -h, 0), gr = g.createRadialGradient(c[0], c[1], 0, c[0], c[1], cam.S * 1.3);
      gr.addColorStop(0, `rgba(255,240,220,${.95 * glow})`); gr.addColorStop(.35, `rgba(255,80,110,${.7 * glow})`); gr.addColorStop(1, "rgba(255,45,85,0)");
      g.save(); g.beginPath(); g.moveTo(hole[0][0], hole[0][1]); for (let i = 1; i < 4; i++) g.lineTo(hole[i][0], hole[i][1]); g.closePath(); g.clip();

  el("csCard").classList.remove("show"); el("csSub").classList.remove("show"); el("csSub").innerHTML = ""; el("csSkip").hidden = false;
  root.hidden = false; resize(); init();
  subIdx = -1; time = 0; offset = o.from || 0; startAt = performance.now(); running = true;
  if (offset > 0) for (let t = 0; t < offset; t += 1 / 60) update(t, 1 / 60);

}
function skipCutscene() {

}

}
