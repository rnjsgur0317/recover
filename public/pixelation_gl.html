/* ═════════════════ 셰이더 ═════════════════ */
const FS_SCENE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uPx, uVec; uniform vec2 uRes; uniform float uT, uBlock, uGlitch, uScene, uMood, uKick, uSpace, uWarp, uPhase, uFall, uHue; uniform vec3 uHueCol; uniform float uWave[6];
${CSGL.NOISE}
vec3 hsv(float h, float s, float v){ vec3 k = clamp(abs(fract(h + vec3(0., .6667, .3333)) * 6. - 3.) - 1., 0., 1.); return v * mix(vec3(1.), k, s); }
vec3 space(vec2 uv, float asp){                                                                     // 광활한 우주: 성운 + 먼 별 + 중심에서 쏟아져 나오는 별 줄기(날아가는 속도감)

  for (int i = 0; i < 3; i++){ float fi = float(i), N = 110. + 70. * fi, ca = floor(a / 6.2832 * N), fa = fract(a / 6.2832 * N) - .5, h = hash(vec2(ca, fi * 7.3 + 1.)), z = fract(h * 13. + uPhase * (.3 + .3 * h)), rr = z * z * 1.25 + .02, len = (.015 + .3 * z * z) * uWarp;

void main(){
  vec2 uv = vUv; float asp = uRes.x / uRes.y;
  if (uBlock > 1.5) uv = (floor(uv * uRes / uBlock) + .5) * uBlock / uRes;                       // 화면 전체가 말 그대로 '픽셀화'
  float tick = floor(uT * 24.), row = floor(uv.y * 36.), gr = hash(vec2(row, tick));
  if (gr < uGlitch * .55) uv.x += (hash(vec2(row, tick + 3.)) - .5) * .16 * uGlitch;               // 가로 줄 단위로 찢어지는 글리치
  vec3 col = vec3(.004, .006, .018) + vec3(.0, .004, .02) * (1. - uv.y); vec3 spc = uSpace > 0. ? space(uv, asp) * uSpace : vec3(0.); float sky = 1.;
  vec2 sg = floor(uv * vec2(asp, 1.) * 90.); float sr = hash(sg); col += vec3(.5, .6, 1.) * step(.994, sr) * (.04 + .1 * hash(sg + 9.)) * step(.47, uv.y) * (1. - uSpace);
  float hy = .47;
  if (uv.y < hy){                                                                                // 원근 격자 바닥 + 킥마다 번지는 픽셀 파동
    float z = .2 / (hy - uv.y), x = (uv.x - .5) * z * asp * 2.4; vec2 fp = vec2(x, z);
    vec2 w = fwidth(fp) * 1.2, l = smoothstep(w, vec2(0.), abs(fract(fp - .5) - .5)); float fade = exp(-z * .1);
    vec2 tile = floor(fp - .5); float fk = uFall - (min(length(tile + .5 - vec2(0., 3.2)), 16.) * .075 + hash(tile) * .3), gone = uFall < 0. ? 0. : smoothstep(0., .45, fk); sky = gone;   // 바닥 붕괴: 가운데에서 바깥으로 타일이 번쩍이며 떨어져 나간다
    col += uHueCol * exp(-max(fk, 0.) * 9.) * step(0., fk) * step(0., uFall) * fade * .9; fade *= 1. - gone;

const FS_FINAL = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uBloom; uniform vec2 uRes, uShake; uniform float uT, uZoom, uCA, uBloomK, uFlash, uCrt, uFade, uInvert, uStatic;
${CSGL.NOISE}
void main(){
  float sy = clamp(uCrt * 1.7, .004, 1.), sx = clamp(uCrt * 5., .002, 1.);                        // CRT 켜짐/꺼짐: 세로로 접힌 뒤 점으로
  vec2 c = vUv - .5; c.x /= sx; c.y /= sy; vec2 uv = c / uZoom + .5 + uShake;
  vec2 bz = uv - .5; uv = .5 + bz * (1. + .045 * dot(bz, bz));                                     // 살짝 볼록한 화면
  if (abs(c.x) > .5 || abs(c.y) > .5 || uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.){ o = vec4(0., 0., 0., 1.); return; }
  if (uStatic > 0.){ float rw = floor(uv.y * 140.), tk = floor(uT * 60.); uv.x += (hash(vec2(rw, tk)) - .5) * .09 * uStatic * step(.55, hash(vec2(rw * .13, tk * .7)));      // 잡음: 가로 줄이 찢기고
    uv.y = fract(uv.y + uStatic * uStatic * .25 * sin(uT * 23.)); }                                                                                      // 화면이 위아래로 구름
  vec2 dir = uv - .5; float ca = uCA * (.3 + length(dir) * 1.8);
  vec3 col = vec3(texture(uScene, uv + dir * ca).r, texture(uScene, uv).g, texture(uScene, uv - dir * ca).b);
  vec3 bl = texture(uBloom, uv).rgb; col += bl * uBloomK + bl * vec3(.12, .06, 0.) * uBloomK;
  if (uStatic > 0.){ vec2 sp = floor(gl_FragCoord.xy / max(2., uRes.y / 360.)); float sn = fract(sin(dot(sp, vec2(12.9898, 78.233)) + floor(uT * 60.) * 3.7) * 43758.5453), band = smoothstep(.0, .12, abs(fract(uv.y * 1.3 - uT * 1.7) - .5) - .3);
    col = mix(col, vec3(sn) * (.55 + .45 * band) * vec3(1., .98, .9), clamp(uStatic * (.75 + .5 * sn), 0., 1.)); }                                  // 치지직 — TV 눈
  col *= 1. + (1. - sy) * 5.; col = mix(col, vec3(1.) - min(col, vec3(1.)), uInvert); col += vec3(1., .95, .7) * uFlash;
  col = (col * (2.51 * col + .03)) / (col * (2.43 * col + .59) + .14); col = pow(clamp(col, 0., 1.), vec3(1. / 2.2));
  col *= .93 + .07 * sin(uv.y * uRes.y * 1.9);                                                    // 주사선
  col += (hash(gl_FragCoord.xy + fract(uT) * 91.7) - .5) * .04;
  float v = length((vUv - .5) * vec2(1., .85)); col *= 1. - smoothstep(.4, 1., v) * .6;

function initGL() { if (X) return; X = CSGL.create(glc); P.scene = X.compile(CSGL.VS_FULL, FS_SCENE); P.final = X.compile(CSGL.VS_FULL, FS_FINAL); pxTex = X.canvasTexture(); vecTex = X.canvasTexture(); }
function resize() {
  DPR = Math.min(DPR_CAP, window.devicePixelRatio || 1); Wd = glc.clientWidth || 1280; Hd = glc.clientHeight || 720; U = Math.min(Wd, Hd) / 10;        // 창이 숨겨져 0이어도 동작하게 기본값
  const pw = Math.max(2, Math.round(Wd * DPR)), ph = Math.max(2, Math.round(Hd * DPR)); glc.width = vcv.width = pw; glc.height = vcv.height = ph;
  initGL(); X.resize(pw, ph); X.free(RT.scene); RT.scene = X.target(pw, ph);
}
function render(t) {
  drawPixels(t); drawVector(t);
  const gl = X.gl, pw = glc.width, ph = glc.height, kick = dat(D.kick, t), build = seg(t, T.BUILD, T.DROP), slam = t >= T.SLAM, brk = t >= T.BREAK && !slam, dropped = t >= T.DROP && !brk;
  X.upload(pxTex, pcv, false); X.upload(vecTex, vcv, false);
  const evilNow = evil(t) && t < T.DROP, glitch = t < T.AD ? .04 : brk ? (t >= T.CLICK ? .5 : .02) : slam ? .08 + .2 * kick + .9 * pulse(t, T.SLAM, .01, .3) : Math.max(evilNow ? .85 : 0, .03 + (t < T.DROP ? .5 * build * build : 0) + (dropped ? .012 + .04 * kick + .9 * pulse(t, T.DROP, .01, .45) + .5 * pulse(t, T.TITLE, .01, .22) : 0), .7 * pulse(t, T.AD, .01, .3), .5 * pulse(t, T.KICK, .01, .3));
  const stepB = [1, 1, 4, 7, 11][Math.min(4, Math.floor(build * 5))], block = (t >= T.DROP - BEAT && t < T.DROP ? 26 : t >= T.BUILD && t < T.DROP ? stepB : slam && t < T.SLAM + .08 ? 12 : 1) * ph / 720;
  const waves = new Float32Array(6).fill(-1); let wi = 0; for (let i = KICKS.length - 1; i >= 0 && wi < 6; i--) { const a = t - KICKS[i]; if (a < 0) continue; if (a > 2) break; waves[wi++] = a; }
  X.pass(P.scene, RT.scene, (u) => { X.bindTex(0, pxTex, u.uPx); X.bindTex(1, vecTex, u.uVec); gl.uniform2f(u.uRes, pw, ph); gl.uniform1f(u.uT, t); gl.uniform1f(u.uBlock, block); gl.uniform1f(u.uGlitch, glitch);
    gl.uniform1f(u.uScene, t < T.AD ? 0 : brk ? .12 : eOut(seg(t, T.AD, T.AD + .6))); gl.uniform1f(u.uMood, dropped || slam ? 1 : .15 + .5 * build + (t >= T.KICK ? .25 * kick : 0)); gl.uniform1f(u.uKick, t >= T.KICK ? kick : 0); gl.uniform1fv(u.uWave, waves);
    const hc = evilNow ? [1, .25, .38] : hsv(hueAt(t), .85, 1); gl.uniform3f(u.uHueCol, hc[0], hc[1], hc[2]); gl.uniform1f(u.uHue, hueAt(t) / 360); gl.uniform1f(u.uSpace, eOut(seg(t, T.KICK, T.KICK + .5))); gl.uniform1f(u.uFall, t - T.KICK);
    gl.uniform1f(u.uWarp, t < T.KICK ? 0 : (.55 + .45 * build + (t >= T.DROP ? .5 : 0) + .25 * kick) * eOut(seg(t, T.KICK, T.KICK + .8))); gl.uniform1f(u.uPhase, warpPhase(t)); });
  const bloomTex = X.bloom(RT.scene.tex, .8), r0 = rng(Math.floor(t * 60));
  const hit = (t >= T.KICK && !brk ? .12 * kick : 0) + .8 * pulse(t, T.DROP, .02, .6) + (dropped ? .25 * kick : 0) + .5 * pulse(t, T.KICK, .02, .4) + (slam ? .3 * kick + .9 * pulse(t, T.SLAM, .02, .4) : 0) + (evilNow ? .3 : 0);
  const flash = Math.max(.9 * pulse(t, T.DROP, .02, .45), .35 * pulse(t, T.KICK, .02, .3), .3 * pulse(t, T.AD, .02, .25), .8 * pulse(t, T.SLAM, .01, .2), .25 * pulse(t, T.TITLE, .02, .3));
  const crt = t < .45 ? eOut(seg(t, .05, .45)) : t >= T.OFF ? 1 - eInOut(seg(t, T.OFF, T.OFF + .18)) : 1;
  X.pass(P.final, null, (u) => { X.bindTex(0, RT.scene.tex, u.uScene); X.bindTex(1, bloomTex, u.uBloom); gl.uniform2f(u.uRes, pw, ph); gl.uniform1f(u.uT, t);
    gl.uniform2f(u.uShake, (r0() - .5) * hit * .016, (r0() - .5) * hit * .016); gl.uniform1f(u.uZoom, 1 + .035 * hit + (dropped ? .015 * kick : 0)); gl.uniform1f(u.uCA, .0012 + .01 * hit); gl.uniform1f(u.uBloomK, brk ? .3 : .42 + .3 * (dropped ? kick : 0));
    gl.uniform1f(u.uFlash, flash * flash); gl.uniform1f(u.uCrt, crt); gl.uniform1f(u.uFade, t >= T.END - .02 ? 1 : 0); gl.uniform1f(u.uInvert, (dropped && t < T.DROP + .07) || (slam && t < T.SLAM + .06) ? 1 : 0);
    gl.uniform1f(u.uStatic, t < T.NOISE ? 0 : t < T.STOP ? .45 * Math.pow(seg(t, T.NOISE, T.STOP), 2) * (.6 + .4 * Math.sin(t * 90)) : Math.min(1, .6 + 1.2 * (t - T.STOP))); });
}

/* ═════════════════ 재생: 시계·HUD·시작/종료 화면은 공용 키트(cs_ui.js) ═════════════════ */
const player = CSUI.create({
  stage: $("cs"), audio: bgm, volume: .8, duration: T.END, theme: "pixel", capBlend: false,
  no: "03", title: "PIXELATION", sub: "픽셀레이션", hero: "/thumbs/pixelation_hero.jpg",

window.addEventListener("resize", () => { if (!$("cs").hidden && X) { resize(); render(time); } });
window.playPixelationCutscene = (o) => player.play(o);
function renderStill(tt) { time = tt; render(tt); }
