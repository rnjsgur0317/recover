"use strict";
/* ═══════════════════════════════════════════════════════════════
   GLITCH — 평범한 아침이 조금씩 망가진다 (실시간 3D · 대사 없음 · 30.4초 · 4K 저장)
   음원: tools/make_glitch_audio.py 로 직접 합성한 오리지널(피아노 · 새소리 · 치지직 · 드론 · 120 BPM). 시각 상수 T 는 그 스크립트와 같다.
     0      눈을 뜬다 — 따뜻한 아침 햇살이 드는 방(1인칭, 두 번 깜빡임)
     4.0    알람시계 — 07:30 → 4.75 88:88 → 07:30 (치지직, 1~2프레임 흔들림)
     6.0    책상을 따라 걷는다 — 6.45 컵이 조각조각 사라졌다 나타남 · 7.45 책장이 빠르게 넘어가며 글자가 깨짐 · 8.5 컴퓨터에 알 수 없는 오류창이 쏟아짐
     9.6    창문 — 10.4 바깥이 한순간 다른 공간으로 · 11.2 하늘이 검정·보라 잡음으로 갈라지고 건물·나무가 픽셀로 일그러짐 (음악이 뚝 끊김) · 12.4 한 발짝 물러남
     13.6   방 전체가 동시에 — 벽과 가구가 픽셀처럼 흔들리고, 시야에 검은 잡음이 번지고 → 14.9 눈을 감는다 → 15.5 정적
     16.8   눈을 뜬다 — 글리치 세계: 보라·검정 잡음 하늘, 불안정한 픽셀 지형, 떠다니는 오류 코드, 되풀이되며 나타났다 사라지는 방의 물건들 · 19.8 거대한 파동
     21.8   눈앞에 검정·보라 에너지가 모인다 → 23.0 픽셀 조각으로 분해 → 다시 하나로 → 24.0 에너지가 하늘로 솟고, 공허 하늘에 거대한 GLITCH 가 떠오른다(올려다봄):
            겹겹의 선으로 된 두 외곽선 큐브가 빠르게 돌며 가로로 잘려 어긋나고, 가운데 네온 별 속 검은 별, 둘레의 검은 조각들, 소용돌이치는 성운. 발밑의 밝은 원에서 입자가 솟구쳐 GLITCH 로 빨려 든다
            25.0 / 26.3 별이 터진다(거대한 검은 큐브 · 숫자) · 제목은 0.1초마다 글꼴·크기·방향이 바뀐다 · 1 in !@#$%^&*()
     26.6   모든 것을 삼킨다 — 먼 곳부터 지형이 하늘로 빨려 오르고, 방의 물건·글자·입자도 끌려 들고, 검은 별이 부풀어 네온 별을 삼키고, 화면이 소용돌이친다
     28.9   플레이어의 화면이 먹힌다 — 별 쪽부터 화면이 블록째 사라지고, 위아래가 닫히며 → 29.7 암전 → 30.4 끝
   셰이더는 장면별 프로그램(#define SHOT): 0 방(태양 그림자 · 창 면광원 · 먼지 빛줄기 · 창밖 풍경 · 물건별 글리치) / 1 글리치 세계. 전부 시간의 함수(상태 없음).
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t, eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
const h1 = (x) => { const v = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }, mix3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
function camera(pos, tgt, roll) { const f = norm(sub(tgt, pos)), r0 = norm(cross(f, [0, 1, 0])), u0 = cross(r0, f), c = Math.cos(roll), s = Math.sin(roll); return { pos, r: [r0[0] * c + u0[0] * s, r0[1] * c + u0[1] * s, r0[2] * c + u0[2] * s], u: [u0[0] * c - r0[0] * s, u0[1] * c - r0[1] * s, u0[2] * c - r0[2] * s], f }; }
function rotM(rx, ry, rz) { const cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry), cz = Math.cos(rz), sz = Math.sin(rz); return [cz * cy, sz * cy, -sy, cz * sy * sx - sz * cx, sz * sy * sx + cz * cx, cy * sx, cz * sy * cx + sz * sx, sz * sy * cx - cz * sx, cy * cx]; }

const T = { OPEN: .5, CLOCK: 4.0, CG: 4.75, DESK: 6.0, CUP: 6.45, BOOK: 7.45, PC: 8.5, WIN: 9.6, WINF: 10.4, CRACK: 11.2, BACK: 12.4, ALL: 13.6, CLOSE: 14.9, DARK: 15.5, WAKE: 16.8, WAVE: 19.8,
  GATHER: 21.8, FORM: 23.0, AURA: 24.0, B1: 25.0, B2: 26.3, DEVOUR: 26.6, FINAL: 28.9, BLACK: 29.7, END: 30.4 };
const NEON = [[1, .17, .84], [0, .94, 1], [.49, 1, .23], [1, .9, 0], [.62, .3, 1], [1, .42, 0], [.18, .42, 1], [1, .13, .27]];
const F0 = [0, 0, -1], S0 = [0, 38, -30], E0 = [0, 1.6, -5], W0 = [60, 0, -90], LSUN = norm([.25, .42, -1]);

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm"), tcv = document.createElement("canvas"), tg = tcv.getContext("2d");
const scv = document.createElement("canvas"), sg = scv.getContext("2d"); scv.width = 512; scv.height = 288;                    // 컴퓨터 화면
const acv = document.createElement("canvas"), ag = acv.getContext("2d"); acv.width = 1024; acv.height = 1024;                  // 떠다니는 오류 코드 16줄
let Wd = 0, Hd = 0, U = 0, DPR = 1, DPR_CAP = 2, SCALE = 1, slow = 0, time = 0, X = null, P = {}, RT = {}, txtTex = null, scrTex = null, atlasTex = null;

/* ═════════════════ 셰이더 ═════════════════ */
const GL_COMMON = `
vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
float sdRBox(vec3 p, vec3 b, float r){ return sdBox(p, b - r) - r; }
float sdFrame(vec3 p, vec3 b, float e){ p = abs(p) - b; vec3 q = abs(p + e) - e;
  return min(min(length(max(vec3(p.x, q.y, q.z), 0.)) + min(max(p.x, max(q.y, q.z)), 0.), length(max(vec3(q.x, p.y, q.z), 0.)) + min(max(q.x, max(p.y, q.z)), 0.)), length(max(vec3(q.x, q.y, p.z), 0.)) + min(max(q.x, max(q.y, p.z)), 0.)); }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h) - r; }
float sdStar5(vec2 p, float r, float rf){ const vec2 k1 = vec2(.809016994375, -.587785252292), k2 = vec2(-.809016994375, -.587785252292); p.x = abs(p.x); p -= 2. * max(dot(k1, p), 0.) * k1; p -= 2. * max(dot(k2, p), 0.) * k2; p.x = abs(p.x); p.y -= r;
  vec2 ba = rf * vec2(-k1.y, k1.x) - vec2(0., 1.); float h = clamp(dot(p, ba) / dot(ba, ba), 0., r); return length(p - ba * h) * sign(p.y * ba.x - p.x * ba.y); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h); }
const vec2 SA[7] = vec2[7](vec2(-.3, .92), vec2(.4, .84), vec2(.4, -.08), vec2(-.3, -.92), vec2(-.4, -.08), vec2(-.4, .84), vec2(-.3, 0.));
const vec2 SB[7] = vec2[7](vec2(.3, .92), vec2(.4, .08), vec2(.4, -.84), vec2(.3, -.92), vec2(-.4, -.84), vec2(-.4, .08), vec2(.3, 0.));
vec2 seg7(vec2 p, float dv, float seed){ p.x -= p.y * .09; int m = int(dv + .5); int bits = m == 0 ? 63 : m == 1 ? 6 : m == 2 ? 91 : m == 3 ? 79 : m == 4 ? 102 : m == 5 ? 109 : m == 6 ? 125 : m == 7 ? 7 : m == 8 ? 127 : m == 9 ? 111 : int(hash(vec2(seed, floor(uT * 30.))) * 127.);
  float on = 0., all = 0.; for (int i = 0; i < 7; i++){ float v = smoothstep(.14, .07, sdSeg(p, SA[i], SB[i])); all = max(all, v); if (((bits >> i) & 1) == 1) on = max(on, v); } return vec2(on, all); }
vec2 clockFace(vec2 uv, vec4 dg){ vec2 r = vec2(0.); float cx[4] = float[4](-.063, -.03, .03, .063);          // 7세그먼트 4자리 + 가운데 콜론 (uv: 가로 ±.085, 세로 ±.045)
  for (int i = 0; i < 4; i++){ vec2 q = (uv - vec2(cx[i], 0.)) / vec2(.026, .024); if (abs(q.x) < .8 && abs(q.y) < 1.2) r = max(r, seg7(q, dg[i], float(i))); }
  float col = smoothstep(.0045, .0025, min(length(uv - vec2(0., .011)), length(uv - vec2(0., -.011)))); r = max(r, vec2(col)); return r; }
`;
const FS_SCENE = (shot) => `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
#define SHOT ${shot}
uniform vec2 uRes; uniform float uT, uFocal, uTick; uniform vec3 uCamPos; uniform mat3 uCam; uniform int uZero; uniform vec4 uDigits;
uniform float uClockG, uCupG, uBookG, uBookFlip, uWinSwap, uCrack, uRoomG, uScrOn;
uniform vec3 uCol, uCol2, uE, uS, uF, uW0; uniform float uEat, uBuild, uBlackK, uFragOn, uAura, uGather, uForm, uWaveR, uSpin, uFlare, uStarK, uGhost, uWorldG; uniform vec4 uFrag[24], uBits[16], uTxtP[12]; uniform mat3 uR1, uR2;
uniform sampler2D uScr, uAtlas;
${CSGL.NOISE}
${GL_COMMON}
#if SHOT == 0
/* ══ 방: 뒤쪽 벽(z=-2.07)에 창, 해는 창 너머 위쪽. 단위는 미터 ══ */
const vec3 LS = vec3(${LSUN.map((v) => v.toFixed(5)).join(", ")}), WC = vec3(.6, 1.5, -2.07), CLK = vec3(-.56, .6, 1.66), CUP = vec3(1.78, .76, .82), BOOK = vec3(1.8, .76, .3), MON = vec3(2.03, 1.1, -.3);
const vec2 WH = vec2(.7, .55);
const vec3 SUNC = vec3(1., .77, .52) * 8.5, SKYC = vec3(.55, .66, .88);
bool gNoB = false;                                                                                              // 그림자·AO 에서는 경계 상자를 무시한다
float gone(float k){ return (uRoomG > 0. && hash(vec2(k, uTick)) < uRoomG * .22) ? 1. : 0.; }
vec3 gp(vec3 p){ if (uRoomG > 0.){ float sl = floor(p.y * 16.), h = hash(vec2(sl, uTick)); if (h < uRoomG * .5) p.x += (hash(vec2(sl + 3., uTick)) - .5) * .3 * uRoomG;       // 방 전체가 픽셀처럼 가로로 밀린다
  float sz = floor(p.z * 10.), h2 = hash(vec2(sz, uTick + 9.)); if (h2 < uRoomG * .25) p.y += (hash(vec2(sz, uTick + 4.)) - .5) * .15 * uRoomG; } return p; }
float cupSDF(vec3 q){
  if (uCupG > 0.){ float band = floor(q.y * 70.), h = hash(vec2(band, uTick)); if (h < uCupG * .5) return .004; if (h < uCupG * .8) q.z += (hash(vec2(band, uTick + 2.)) - .5) * .05; }   // 컵: 가로 조각이 사라지고 어긋난다
  float r = length(q.xz), d = max(abs(r - .041) - .0035, abs(q.y - .05) - .05); d = min(d, max(r - .0445, abs(q.y - .003) - .003));
  vec3 h = q - vec3(0., .05, .052); d = min(d, length(vec2(length(h.yz) - .026, h.x)) - .006); return d; }
vec2 bookSDF(vec3 q){
  vec2 r = vec2(sdBox(q - vec3(0., .003, 0.), vec3(.105, .003, .15)), 22.);
  vec3 b = q; float cz = clamp(abs(b.z) / .14, 0., 1.); b.y -= .006 + .011 * sin(cz * 3.1416) * (1. - cz * .3);
  r = opU(r, vec2(sdBox(vec3(b.x, b.y - .005, abs(b.z) - .072), vec3(.098, .005, .068)) * .8, 14.));
  if (uBookFlip > 0.){ vec3 f = q - vec3(0., .024, 0.); float a = uBookFlip; vec2 dr = vec2(sin(a), -cos(a)); float pz = dot(f.yz, dr), py = dot(f.yz, vec2(-dr.y, dr.x));   // 넘어가는 책장
    r = opU(r, vec2(sdBox(vec3(f.x, py, pz - .07), vec3(.097, .0007, .068)) * .8, 14.)); }
  return r; }
vec2 map(vec3 p){
  p = gp(p);
  vec2 r = vec2(p.y, 2.); r = opU(r, vec2(2.7 - p.y, 3.)); r = opU(r, vec2(min(p.x + 2.2, min(2.2 - p.x, 2. - p.z)), 1.));
  r = opU(r, vec2(max(sdBox(p - vec3(0., 1.35, -2.07), vec3(2.3, 1.45, .07)), -sdBox(p - WC, vec3(WH, .2))), 1.));
  float bd = sdBox(p - vec3(.6, 1.775, -1.935), vec3(1.3, .925, .135));                                                         // 창틀 · 창턱 · 커튼
  if (bd < .05){ vec3 w = p - WC; float fr = max(sdBox(w, vec3(WH, .05)), -sdBox(w, vec3(WH - .045, .1))); fr = min(fr, sdBox(w, vec3(.022, WH.y, .03))); fr = min(fr, sdBox(w - vec3(0., .1, 0.), vec3(WH.x, .016, .03)));
    fr = min(fr, sdRBox(p - vec3(.6, .935, -1.97), vec3(.8, .02, .1), .006)); r = opU(r, vec2(fr, 15.));
    float cx = abs(p.x - .6) - 1.0; vec3 cq = vec3(cx, p.y - 1.5, p.z + 1.88 - .018 * sin(p.x * 42. + p.y * .6) - .006 * sin(p.y * 7. + uT * .6)); r = opU(r, vec2(sdBox(cq, vec3(.17, 1.15, .01)) * .7, 16.));
    r = opU(r, vec2(sdCap(p, vec3(-.65, 2.62, -1.88), vec3(1.85, 2.62, -1.88), .012), 8.)); }
  else if (!gNoB) r = opU(r, vec2(bd, -1.));
  bd = sdBox(p - vec3(-1.24, .6, .85), vec3(.96, .6, 1.15));                                                                    // 침대 · 협탁 · 알람시계
  if (bd < .05){ r = opU(r, vec2(sdRBox(p - vec3(-1.525, .17, .95), vec3(.675, .17, 1.05), .015), 4.)); r = opU(r, vec2(sdRBox(p - vec3(-1.525, .56, 1.97), vec3(.675, .56, .03), .012), 4.));
    r = opU(r, vec2(sdRBox(p - vec3(-1.525, .42, .95), vec3(.64, .08, 1.0), .05), 6.));
    vec3 dq = p - vec3(-1.525, .52, .55); float fold = (noise(p.xz * vec2(5., 9.)) - .5) * .045 + (noise(p.xz * vec2(13., 21.)) - .5) * .012; r = opU(r, vec2((sdRBox(dq, vec3(.7, .06, .72), .06) + fold) * .8, 5.));
    if (gone(3.) < .5) r = opU(r, vec2(sdRBox(p - vec3(-1.53, .6, 1.66), vec3(.42, .05, .2), .07) + (noise(p.xz * 14.) - .5) * .01, 6.));
    r = opU(r, vec2(sdRBox(p - vec3(-.54, .27, 1.7), vec3(.24, .27, .24), .008), 7.));
    if (gone(1.) < .5){ vec3 cp = p - CLK; r = opU(r, vec2(sdRBox(cp, vec3(.05, .06, .1), .016), 8.)); } }
  else if (!gNoB) r = opU(r, vec2(bd, -1.));
  bd = sdBox(p - vec3(1.825, .95, .2), vec3(.375, .95, .95));                                                                   // 책상 · 모니터 · 키보드 · 컵 · 책 · 선반
  if (bd < .05){ r = opU(r, vec2(sdRBox(p - vec3(1.85, .74, .2), vec3(.35, .02, .9), .004), 10.)); r = opU(r, vec2(sdBox(vec3(abs(p.x - 1.85) - .3, p.y - .36, abs(p.z - .2) - .85), vec3(.022, .36, .022)), 10.));
    if (gone(4.) < .5){ r = opU(r, vec2(sdRBox(p - MON, vec3(.022, .2, .34), .01), 11.)); r = opU(r, vec2(sdBox(p - vec3(2.07, .9, -.3), vec3(.018, .15, .028)), 11.)); r = opU(r, vec2(sdRBox(p - vec3(2.04, .765, -.3), vec3(.09, .006, .12), .005), 11.)); }
    r = opU(r, vec2(sdRBox(p - vec3(1.72, .772, -.3), vec3(.07, .008, .22), .004), 17.));
    vec3 cq = p - CUP; if (gone(2.) < .5){ if (length(cq - vec3(0., .05, .02)) < .13){ r = opU(r, vec2(cupSDF(cq), 13.)); r = opU(r, vec2(max(length(cq.xz) - .038, abs(cq.y - .082) - .002), 21.)); } else r = opU(r, vec2(length(cq - vec3(0., .05, .02)) - .12, -1.)); }
    vec3 bq = p - BOOK; if (gone(5.) < .5){ if (sdBox(bq, vec3(.12, .18, .17)) < .02) r = opU(r, bookSDF(bq)); else r = opU(r, vec2(sdBox(bq, vec3(.12, .18, .17)), -1.)); }
    r = opU(r, vec2(sdBox(p - vec3(2.05, 1.62, .55), vec3(.15, .012, .5)), 10.));
    float z0 = p.z - .12, bi = clamp(floor(z0 / .052), 0., 15.), hb = .15 + .08 * hash(vec2(bi, 4.)); vec3 kq = vec3(p.x - 2.08, p.y - 1.632 - hb * .5, z0 - (bi + .5) * .052);
    r = opU(r, vec2(sdRBox(kq, vec3(.1, hb * .5, .021), .003), 19.)); }
  else if (!gNoB) r = opU(r, vec2(bd, -1.));
  r = opU(r, vec2(sdBox(p - vec3(.35, .004, .45), vec3(1., .004, 1.1)), 18.));
  if (gone(6.) < .5) r = opU(r, vec2(sdRBox(p - vec3(-2.18, 1.62, .9), vec3(.025, .3, .42), .005), 20.));
