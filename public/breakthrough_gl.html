"use strict";
/* ═══════════════════════════════════════════════════════════════
   BREAKTHROUGH — 블록이 하나씩 빠져나가는 결정 모놀리스 (실시간 3D 레이마칭)
   사운드: 참고 영상에서 추출(앞 4.5초 제거). 128 BPM · 박 0.46875s · 마디 첫 박 1.04 + 1.875n
     0.1   S1  i   - started with few            모놀리스(채움 88%) 클로즈업, 기울어진 구도
     3.8   S2  ii  - only less it gets.          아래에서 올려다봄(55%)
     7.5   S3  iii - time by time, now empty     뼈대만 남음(20%), 별빛이 정면으로
     11.25 S4        빛만 남은 공허
     13.13 S5  iv  - and there was nothing left. 같은 빛을 뒤집어 먹물 자국으로 (흰 바탕)
     14.07 S6        get out of my head
     15.02 섬광 → 16.0 S7  it wasn't gone / with only 5 fragments left — 밝은 안개 속 빛의 십자와 다섯 조각
     22.60 how·much·do·you·believe·in·this·world? (박마다 한 단어)
     27.5  S8  잿빛으로 식으며 화면이 닫힘 → 29.6 끝
   패스: ① 레이마칭(해상도 0.75배, 유리 반사 1회, 깊이를 알파에 기록) ② 3D 먼지 입자(가산) ③ 블룸 ④ 최종(피사계 심도 · 렌즈 고스트 · 아나모픽 줄무늬 · 먹물 반전 · 슬릿 · 글자 합성)
   전부 시간의 함수(상태 없음). 시계·HUD·자막·시작/종료 화면은 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t;
const eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const LABELS = [                                         // 기울어진 띠 글자: 시작·끝, 문구, 위치(U), 기울기, 뒤집힌 색
  { a: 1.85, b: 3.5, s: "i - started with few", x: -3.4, y: 1.0, r: -.05 },
  { a: 5.15, b: 7.2, s: "ii - only less it gets.", x: 2.4, y: 1.7, r: -.04 },
  { a: 8.95, b: 10.95, s: "iii - time by time, now empty", x: -2.2, y: 1.35, r: -.3 },
  { a: 13.2, b: 14.05, s: "iv - and there was nothing left.", x: 3.0, y: 2.3, r: -.27 },
  { a: 17.0, b: 22.3, s: "it wasn't gone", x: -4.6, y: .35, r: -.035 },
  { a: 20.5, b: 22.3, s: "with only 5 fragments left", x: 3.6, y: .55, r: .06 },
];
const CAPS = [{ a: 1.85, b: 3.5, s: "처음부터 얼마 없었다" }, { a: 5.15, b: 7.2, s: "갈수록 줄어들 뿐." }, { a: 8.95, b: 10.95, s: "시간이 흐르고, 이제 텅 비었다" }, { a: 13.2, b: 14.05, s: "그리고 아무것도 남지 않았다." },
  { a: 14.2, b: 15.0, s: "내 머릿속에서 나가" }, { a: 17.0, b: 20.3, s: "사라진 게 아니었다" }, { a: 20.5, b: 22.4, s: "단 다섯 조각만 남은 채로" }, { a: 22.7, b: 27.2, s: "너는 이 세계를 얼마나 믿는가?" }];
const D = window.BT_DATA || { fps: 60, low: [], hit: [], lvl: [] };
const dat = (arr, t) => { const i = Math.floor(t * D.fps); return i < 0 || !arr.length ? 0 : arr[Math.min(arr.length - 1, i)]; };

const $ = (id) => document.getElementById(id);
const glc = $("glc"), bgm = $("bgm"), tcv = document.createElement("canvas"), tg = tcv.getContext("2d");
let Wd = 0, Hd = 0, U = 0, DPR = 1, DPR_CAP = 1.5, SCALE = .75, slow = 0, time = 0, X = null, P = {}, RT = {}, seedVAO = null, txtTex = null;

/* ═════════════════ 셰이더 ═════════════════ */
const GLSL_CAM = `uniform vec3 uCamPos; uniform mat3 uCam; uniform float uFocal;`;
const FS_SCENE = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform float uT; ${GLSL_CAM}
uniform int uN, uZero; uniform vec4 uSlabP[5]; uniform mat3 uSlabR[5]; uniform vec4 uSlabM[5];
uniform vec3 uStar; uniform vec2 uStarS; uniform float uStarI, uBright, uRib, uBeat, uCross, uSeed, uFocus;
${CSGL.NOISE}
float sdBox(vec3 p, vec3 b){ vec3 d = abs(p) - b; return length(max(d, 0.)) + min(max(d.x, max(d.y, d.z)), 0.); }
const vec3 B = vec3(1., 2.6, .3); const vec2 G = vec2(.2, .2), LIM = vec2(5., 13.);
/* 모놀리스: 10 x 26 칸, 칸마다 깊이가 다른 블록(2x2 묶음 + 낱칸 두 단계). 채움(fill)보다 큰 해시의 칸은 비어 있다 → 시간이 갈수록 빠져나감.
   테두리 칸은 더 오래 버텨서, 속이 비어도 뼈대가 남는다 */
float cellHash(vec2 id, float seed){ return mix(hash(id + seed * 17.3), hash(floor(id * .5) + seed * 5.1 + 40.), .6); }
float present(vec2 id, float fill, float seed){ vec2 a = abs(id + .5); if (a.x > LIM.x || a.y > LIM.y) return 0.;
  float border = step(LIM.x - 1., a.x) + step(LIM.y - 1., a.y), h = cellHash(id, seed); return step(h, border > .5 ? fill * 1.5 + .3 : fill); }
float cellDepth(vec2 id, float seed){ return B.z * (.35 + .55 * hash(floor(id * .5) * 1.31 + seed + 3.) + .45 * hash(id * 2.7 + seed)); }
float slabD(vec3 p, float fill, float seed){
  float db = sdBox(p, B + vec3(.02, .02, .25)); if (db > .3) return db;
  vec2 id = floor(p.xy / G), q = p.xy - (id + .5) * G, w = G * .5 - abs(q); float wall = min(w.x, w.y) + .01;
  if (present(id, fill, seed) < .5) return wall;
  return min(sdBox(vec3(q, p.z), vec3(G * .5 - .014, cellDepth(id, seed))) - .008, wall);
}
vec2 map(vec3 p){ float d = 1e9, idx = -1.;
  for (int i = uZero; i < uN; i++){ vec3 q = ((p - uSlabP[i].xyz) * uSlabR[i]) / uSlabP[i].w; float di = slabD(q, uSlabM[i].x, uSlabM[i].y) * uSlabP[i].w; if (di < d){ d = di; idx = float(i); } }
  return vec2(d, idx); }
vec3 normalAt(vec3 p){ vec3 n = vec3(0.); for (int i = uZero; i < 4; i++){ vec3 e = .5773 * (2. * vec3(float(((i + 3) >> 1) & 1), float((i >> 1) & 1), float(i & 1)) - 1.); n += e * map(p + .0016 * e).x; } return normalize(n); }
float aoAt(vec3 p, vec3 n){ float a = 0., s = 1.; for (int i = uZero; i < 4; i++){ float h = .02 + .07 * float(i); a += (h - map(p + n * h).x) * s; s *= .7; } return clamp(1. - 3.2 * a, 0., 1.); }

/* 배경: 어둠(또는 밝은 안개) + 별빛 + 빛 리본 + 빛의 십자 — 화면 좌표 s(세로 ±1) */
vec3 ribbons(vec2 s, vec2 c, float I){
  vec3 acc = vec3(0.);
  for (int i = 0; i < 9; i++){ float fi = float(i), h = hash(vec2(fi, uSeed)), h2 = hash(vec2(fi + 9., uSeed)), R = .7 + 2.6 * h, a = h2 * 6.283 + uT * (.05 + .07 * h) * (mod(fi, 2.) < 1. ? 1. : -1.);
    vec2 cc = c + vec2(cos(a), sin(a)) * R * (1. - .04 * sin(uT * .6 + fi)); vec2 v = s - cc; float d = abs(length(v) - R), ang = atan(v.y, v.x) - a - 3.1416;
    float along = exp(-pow(sin(ang * .5) * (1.6 + 2. * h), 2.) * 3.);                                  // 별빛 가까이서 밝고 멀어지며 사라지는 호
    float w = .004 + .012 * h2; acc += (vec3(.62, .72, 1.) * exp(-d / (w * 6.)) * .35 + vec3(1.) * exp(-d * d / (w * w))) * along * (.35 + .65 * h); }
  return acc * I;
}
vec3 starGlow(vec2 s, vec2 c, float I){ vec2 v = s - c; float r = length(v);
  vec3 g = vec3(.7, .8, 1.) * (.03 / (r * r + .004)) + vec3(.3, .4, .9) * .016 / (r + .06);
  float sp = 0.; for (int i = 0; i < 4; i++){ float a = float(i) * .7854 + .3 + uT * .03; vec2 d = vec2(cos(a), sin(a)); float along = abs(dot(v, d)), across = abs(dot(v, vec2(-d.y, d.x))); sp += exp(-across * (i == 0 ? 90. : 140.)) * exp(-along * (i == 0 ? .9 : 2.2)); }
  float streak = exp(-abs(v.y) * 60.) * exp(-abs(v.x) * .55);                                           // 아나모픽 가로 줄
  return (g + vec3(.85, .92, 1.) * sp * .9 + vec3(.6, .75, 1.) * streak * 1.2) * I;
}
vec3 background(vec3 rd, vec2 s){
  vec3 dark = vec3(.0008, .001, .003) + vec3(.002, .003, .012) * fbm(rd.xy * 3. + uT * .02);
  vec3 bright = mix(vec3(.1, .12, .2), vec3(.42, .47, .6), smoothstep(-.7, .8, rd.y)) * (.75 + .5 * fbm(rd.xy * 2.5 + vec2(uT * .03, 0.)));
  vec3 col = mix(dark, bright, uBright);
  float haze = fbm(s * 1.6 + vec2(uT * .04, -uT * .02)) ; vec2 v = s - uStarS; float r = length(v);
  col += vec3(.4, .5, 1.) * haze * haze * .1 / (r * 2.2 + .3) * uStarI;             // 별빛에 물든 안개
  col += starGlow(s, uStarS, uStarI) + ribbons(s, uStarS, uRib);
  if (uCross > 0.){ float cx = exp(-abs(v.x) * 9.) + exp(-v.x * v.x * 900.) * 2., cy = exp(-abs(v.y) * 14.) + exp(-v.y * v.y * 1400.) * 2.;                    // 빛의 십자
    col += vec3(.9, .94, 1.) * (cx * (.55 + .2 * sin(s.y * 9. - uT * 2.)) + cy * .8) * uCross; }
  return col;
}
vec3 surface(vec3 p, vec3 n, vec3 rd, float idx, float ao){                         // 결정 블록의 색: 어두운 유리 몸체 + 회로 무늬 + 빛나는 칸 + 별빛 투과
  int k = int(idx + .5); vec3 v = -rd, l = normalize(uStar - p), q = ((p - uSlabP[k].xyz) * uSlabR[k]) / uSlabP[k].w; vec2 id = floor(q.xy / G), cq = q.xy / G - id - .5;
  float seed = uSlabM[k].y, ch = hash(id * 2.17 + seed + 9.), ndl = max(dot(n, l), 0.), spec = pow(max(dot(n, normalize(l + v)), 0.), 120.);
  vec3 nl = n * uSlabR[k]; float front = smoothstep(.6, .9, abs(nl.z)), m = max(abs(cq.x), abs(cq.y));
  vec3 alb = mix(vec3(.018, .022, .04), vec3(.07, .085, .13), uBright) * (.6 + .8 * ch);
  float fine = step(.55, hash(floor(q.xy / G * 3.) + seed)) * front, inset = smoothstep(.36, .33, m) * front; alb *= .7 + .5 * fine;
  vec3 c = alb * (.1 + 1.8 * ndl * uStarI) * ao + vec3(.8, .88, 1.) * spec * 4. * uStarI;
  c += vec3(.7, .8, 1.) * pow(max(dot(rd, l), 0.), 5.) * .5 * uStarI * (1. - ndl) * ao;
  float lit = step(.87 - .08 * uBeat, ch) * inset; c += vec3(.72, .85, 1.) * lit * (1.6 + 2.2 * uBeat) * uSlabM[k].z * (.55 + .45 * sin(uT * (2. + 6. * ch) + ch * 40.));
  c += mix(vec3(.04, .06, .15), vec3(.5, .55, .65), uBright) * smoothstep(.4, .47, m) * front * .5 * ao;                                              // 블록 모서리의 옅은 빛
  return c;
}
void main(){
  vec2 s = (vUv - .5) * vec2(uRes.x / uRes.y, 1.) * 2.; vec3 ro = uCamPos, rd = normalize(uCam * vec3(s, uFocal));
  vec3 col = background(rd, s); float t = .2, idx = -1., depth = uFocus * 1.7; bool hit = false;
  if (uN > 0) for (int i = uZero; i < 120; i++){ vec2 m = map(ro + rd * t); if (m.x < .001 * t){ hit = true; idx = m.y; break; } t += m.x * .92; if (t > 28.) break; }
  if (hit){
    vec3 p = ro + rd * t, n = normalAt(p); float ao = aoAt(p, n), fres = pow(1. - max(dot(n, -rd), 0.), 4.);
    vec3 c = surface(p, n, rd, idx, ao);
    vec3 rr = reflect(rd, n), rp = p + n * .01; float tr = .02, ridx = -1.; bool rhit = false;                                                          // 유리 반사 1회
    for (int i = uZero; i < 44; i++){ vec2 m = map(rp + rr * tr); if (m.x < .003){ rhit = true; ridx = m.y; break; } tr += m.x; if (tr > 8.) break; }
    vec3 rc; if (rhit){ vec3 p2 = rp + rr * tr; rc = surface(p2, normalAt(p2), rr, ridx, 1.) * .8; }
    else { vec3 lc = rr * uCam; rc = lc.z > .05 ? background(rr, lc.xy / lc.z * uFocal) : mix(vec3(.004, .006, .015), vec3(.55, .6, .7), uBright); }
    c += rc * (.05 + .95 * fres) * (.55 + .25 * uBright) * ao;
    float fog = 1. - exp(-t * mix(.035, .05, uBright)); col = mix(c, col, fog * (.5 + .3 * uBright)); depth = t;
  }
  o = vec4(max(col, 0.), depth);
}`;
const VS_PART = `#version 300 es
precision highp float; layout(location = 0) in vec4 aSeed; out float vA; uniform vec2 uRes; uniform float uT, uSize, uBright; uniform vec3 uStar; ${GLSL_CAM}
void main(){
  vec3 p = (aSeed.xyz - .5) * vec3(16., 10., 14.) + vec3(sin(uT * .13 + aSeed.w * 40.), cos(uT * .11 + aSeed.x * 40.), sin(uT * .09 + aSeed.y * 40.)) * .5;
  vec3 v = p - uCamPos; float z = dot(v, uCam[2]); if (z < .3){ gl_Position = vec4(2., 2., 0., 1.); gl_PointSize = 0.; vA = 0.; return; }
  vec2 s = vec2(dot(v, uCam[0]), dot(v, uCam[1])) / z * uFocal; gl_Position = vec4(s / vec2(uRes.x / uRes.y, 1.), 0., 1.);
  float blur = abs(z - 4.5) * .5; gl_PointSize = max(1.5, (.8 + blur * 1.6 + 1.6 * aSeed.w * aSeed.w) * uSize / max(z * .4, .5));                                            // 초점에서 멀수록 큰 보케
  float near = 1. / (1. + .15 * dot(p - uStar, p - uStar)); vA = (.012 + .5 * near) * (.3 + .7 * aSeed.w) / (1. + blur * 2.5) * (1. - .4 * uBright);
}`;
const FS_PART = `#version 300 es
precision highp float; in float vA; out vec4 o;
void main(){ vec2 d = gl_PointCoord - .5; float r = length(d) * 2., a = smoothstep(1., .75, r) * (.55 + .45 * smoothstep(.4, .95, r)) * vA; o = vec4(vec3(.7, .8, 1.) * a, 1.); }`;
const FS_FINAL = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uBloom, uTxt; uniform vec2 uRes, uShake; uniform float uT, uZoom, uCA, uBloomK, uFlash, uSlit, uFade, uInk, uGrey, uRoll, uFocus, uAper, uGhost; uniform vec2 uStarS;
${CSGL.NOISE}
vec3 scene(vec2 uv){                                                                       // 피사계 심도: 초점 거리에서 멀수록 원반 모양으로 흐려짐
  vec4 c0 = texture(uScene, uv); float coc = clamp(abs(c0.a - uFocus) / max(c0.a, .1) * uAper, 0., 1.) * .011; if (coc < .0006) return c0.rgb;
  vec3 acc = c0.rgb; float n = 1.; for (int i = 0; i < 14; i++){ float fi = float(i) + .5, a = fi * 2.39996, r = sqrt(fi / 14.) * coc; vec2 d = vec2(cos(a), sin(a)) * r * vec2(uRes.y / uRes.x, 1.); vec4 sx = texture(uScene, uv + d); float w = 1. + 2. * max(max(sx.r, sx.g), sx.b); acc += sx.rgb * w; n += w; }
  return acc / n; }
void main(){
  vec2 c = vUv - .5; float cr = cos(uRoll), sr = sin(uRoll), asp = uRes.x / uRes.y; c = vec2(c.x * asp, c.y); c = vec2(c.x * cr - c.y * sr, c.x * sr + c.y * cr); c = vec2(c.x / asp, c.y);
  vec2 uv = c / uZoom + .5 + uShake, dir = uv - .5; float ca = uCA * (.3 + length(dir) * 2.);
  vec3 col = vec3(scene(uv + dir * ca).r, scene(uv).g, scene(uv - dir * ca).b);
  vec3 bl = texture(uBloom, uv).rgb, st = vec3(0.); for (int i = -7; i <= 7; i++){ float fi = float(i); st += texture(uBloom, uv + vec2(fi * .012, 0.)).rgb * exp(-fi * fi * .07); }
  col += bl * uBloomK + st * vec3(.5, .65, 1.) * .055 * uBloomK;                                          // 블룸 + 아나모픽 가로 번짐
  { vec2 sc = vec2((uv.x - .5) * asp, uv.y - .5) * 2., sp = uStarS; float g = 0.;                                                                     // 렌즈 고스트 · 헤일로
    for (int i = 0; i < 4; i++){ float k = -.35 - .45 * float(i), rad = .05 + .045 * float(i); float d = length(sc - sp * k); g += smoothstep(rad, rad * .8, d) * (.4 + .6 * smoothstep(rad * .5, rad, d)) * (.5 - .1 * float(i)); }
    float halo = exp(-pow((length(sc - sp) - .62) * 9., 2.)); col += (vec3(.35, .5, 1.) * g * .09 + vec3(.5, .6, 1.) * halo * .05) * uGhost; }
  col = col * (1. + 6. * uFlash) + vec3(1.) * uFlash * .35;
  col = (col * (2.51 * col + .03)) / (col * (2.43 * col + .59) + .14); col = pow(clamp(col, 0., 1.), vec3(1. / 2.2));
  if (uInk > 0.){ float l = dot(col, vec3(.3, .55, .15)), n = fbm(uv * vec2(asp, 1.) * 22.) * .22; col = mix(col, vec3(1. - smoothstep(.6, .66, l + n - .11)), uInk); }   // 빛을 뒤집은 먹물 자국
  col = mix(col, vec3(dot(col, vec3(.3, .55, .15))) * vec3(.98, 1., 1.03), uGrey);
  vec4 tx = texture(uTxt, vUv); col = mix(col, tx.rgb, tx.a);
  col += (hash(gl_FragCoord.xy + fract(uT) * 91.7) - .5) * .045; float v = length((vUv - .5) * vec2(1., .82)); col *= 1. - smoothstep(.4, 1., v) * .55;
  float open = (1. - uSlit) * .5, band = smoothstep(open, open - .004, abs(vUv.y - .5)); col *= band; col += vec3(.7, .8, 1.) * exp(-pow((abs(vUv.y - .5) - open) * 160., 2.)) * uSlit * (1. - uSlit) * 2.5 * step(.001, uSlit);
  o = vec4(max(col, 0.) * (1. - uFade), 1.);
}`;

/* 컷마다 큰 셰이더를 기다리지 않게: 컴파일만 걸어 두고 결과는 처음 쓸 때 확인 (드라이버가 뒤에서 병렬 컴파일) */
function lazyProgram(vs, fs) {

});

window.playBreakthroughCutscene = (o) => player.play(o);
function renderStill(tt) { time = tt; render(tt); }
