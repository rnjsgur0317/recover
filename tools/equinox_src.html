<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQUINOX 컷씬 테스트 — 陰陽</title>
<link rel="stylesheet" href="/cs_ui.css">
</head>
<body>
<div id="cs" hidden><canvas id="cv"></canvas></div>
<audio id="bgm" src="/equinox_cut.mp3" preload="auto"></audio>
<script src="/equinox_data.js"></script>
<script src="/cs_ui.js"></script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   EQUINOX 「陰陽」 — 음악 동기 컷씬 (20초 + 페이드 1초)
   곡 분석: 90 BPM · 3/4박 → 박 0.6667s, 마디 2.0s, 16분음 0.1667s, 첫 강박 1.02s, 드롭 11.02s
   1막 0~11.02  분리: 거대한 태극의 '안쪽'에서 시작 — 화면은 어둠/빛 두 쪽, 두 구슬이 서로를 돈다.
                 아르페지오 16분음마다 음·양 구슬에서 번갈아 파문. 9.02부터 소용돌이치며 멀어짐(줌아웃).
   2막 11.02~19.02 합일: 태극이 한 점으로 맞물림. 박마다 ①충격파 ②양(빛살) ③음(먹) 폭발, 팔괘·해·달·위성 태극.
   종막 19.02~   춘분: 태극의 S곡선이 수평선으로 펴져 낮과 밤이 반반 — 타이틀 EQU◐NOX.
        21.02    펑(다음 마디 첫 박): 전부 한 점으로 빨려들었다가 터지고, 그대로 암전.
   API: playEquinoxCutscene({ sound: true, onDone(){} })   ※ 시계·HUD·자막·시작/종료 화면은 공용 키트 cs_ui.js
   ═══════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3), eIn = (t) => t * t * t;
const eInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const pulse = (t, t0, rise, fall) => (t < t0 ? 0 : t < t0 + rise ? (t - t0) / rise : Math.max(0, 1 - (t - t0 - rise) / fall));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const SPIN = 1.5;                                    // 회전 속도 배율
const VOLUME = .7;                                   // 음악 음량 (0~1)
const BEAT = 2 / 3, T0 = 1.02, BUILD = 9.02, DROP = 11.02, SAT = 15.02, CONV = 17.02, TITLE = 19.02, POP = 21.02, FADE = 21.4, END = 21.9;
const D = window.EQ_DATA || { fps: 30, low: [], high: [], onsets: [] };
const CAPS = [
  { a: 1.5, b: 4.7, s: "陰 — 어둠은 빛을 품고" },
  { a: 5.2, b: 8.7, s: "陽 — 빛은 어둠을 품는다" },
  { a: 9.1, b: 10.85, s: "둘이 같아지는 단 하루" },
];
const TRIGRAMS = [7, 3, 5, 1, 0, 4, 2, 6];          // 건·태·리·진·곤·간·감·손 (비트: 1=이어진 효)

const $ = (id) => document.getElementById(id);
const cv = $("cv"), g = cv.getContext("2d"), bgm = $("bgm");
let W = 0, H = 0, U = 0, DPR = 1, stars = [], parts = [], events = [], rotTab = null, time = 0, running = false, raf = 0, anchor = 0, useAudio = false, opts = {};

function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth || 1280; H = cv.clientHeight || 720; U = Math.min(W, H) / 10; cv.width = W * DPR; cv.height = H * DPR; }   // 창이 숨겨져 크기가 0이어도 NaN 이 나지 않게 기본값
function band(arr, t) { const i = t * D.fps, i0 = Math.floor(i); if (i0 < 0 || !arr.length) return .5; const a = arr[Math.min(arr.length - 1, i0)], b = arr[Math.min(arr.length - 1, i0 + 1)]; return a + (b - a) * (i - i0); }
const lowN = (t) => clamp((band(D.low, t) - .35) / .45), highN = (t) => clamp((band(D.high, t) - .25) / .45);

/* 회전: 각속도를 적분해 표로 (1막 느리게 → 빌드에서 소용돌이 → 2막은 박마다 툭툭 밀림) */
function omega0(t) {
  if (t < T0) return 0;
  if (t < BUILD) { const ph = ((t - T0) / BEAT) % 1, grow = seg(t, T0, BUILD); return .55 + .5 * grow + (1.6 + 1.3 * grow) * Math.exp(-ph * 5); }
  if (t < DROP) return lerp(2.0, 12, eIn(seg(t, BUILD, DROP)));
  if (t < TITLE) { const ph = ((t - DROP) / BEAT) % 1; return 1.0 + 6 * Math.exp(-ph * 6); }
  return .45;
}
function omega(t) { return omega0(t) * SPIN * (t >= CONV && t < TITLE ? 1 + 2.5 * eIn(seg(t, CONV, TITLE)) : 1); }
function buildRot() { const n = Math.ceil(END * 240) + 2; rotTab = new Float32Array(n); let a = PI / 2; for (let i = 0; i < n; i++) { rotTab[i] = a; a += omega(i / 240) / 240; } }
function rotAt(t) { const i = clamp(t, 0, END) * 240, i0 = Math.floor(i); return lerp(rotTab[i0], rotTab[Math.min(rotTab.length - 1, i0 + 1)], i - i0); }
function beatPulse(t) { if (t < DROP || t >= TITLE) return 0; return Math.exp(-(((t - DROP) / BEAT) % 1) * 5); }
function barPulse(t) { if (t < DROP || t >= TITLE) return 0; return Math.exp(-(((t - DROP) / 2) % 1) * 7); }
const imp = (t) => eIn(seg(t, POP - .38, POP));         // 펑 직전: 전부 한 점으로 빨려듦 (0 → 1)
function radiusAt(t) {
  if (t < BUILD) return Math.exp(lerp(Math.log(45 * U), Math.log(10 * U), eOut(seg(t, T0, BUILD))));
  if (t < DROP) return Math.exp(lerp(Math.log(10 * U), Math.log(2.7 * U), eIn(seg(t, BUILD, DROP))));
  const toTitle = eInOut(seg(t, TITLE, TITLE + .55));
  return lerp(2.7 * U * (1 + .1 * beatPulse(t) + .05 * lowN(t)) * (1 + .3 * pulse(t, DROP, .01, .45)), 1.15 * U, toTitle) * (1 - .9 * imp(t));
}
function centerY(t) { return 0; }
/* 종막: 도는 태극이 수평으로 멈추고(phi → 2π 배수), S자 경계가 곧은 수평선으로 펴진다(amp 1 → 0) */
function finale(t) { const r0 = rotAt(TITLE) - PI / 2, target = Math.ceil((r0 + 1.2) / TAU) * TAU;
  return { phi: lerp(r0, target, eOut(seg(t, TITLE, TITLE + .5))), amp: 1 - eInOut(seg(t, TITLE + .1, TITLE + .6)) }; }
function orbR(t) { return Math.min(lerp(3.3 * U, 2.3 * U, seg(t, 3, BUILD)), radiusAt(t) / 2); }
function orbPos(t, yang) {
  if (t >= TITLE) { const f = finale(t), th = (1 - f.amp) * PI / 2, R = radiusAt(t) / 2, lx = (yang ? 1 : -1) * R * Math.cos(th), ly = (yang ? -1 : 1) * R * Math.sin(th), c = Math.cos(f.phi), sn = Math.sin(f.phi); return [lx * c - ly * sn, lx * sn + ly * c]; }
  const a = rotAt(t), r = orbR(t) * (yang ? 1 : -1); return [Math.sin(a) * r, -Math.cos(a) * r + centerY(t)]; }

function init() {
  buildRot();
  const r = rng(12);
  stars = Array.from({ length: 260 }, () => ({ x: (r() * 2 - 1) * 1.1, y: (r() * 2 - 1) * 1.1, z: .3 + r() * .7, ph: r() * TAU }));
  parts = []; events = [];
  // 아르페지오 온셋 → 음·양 구슬에서 번갈아 파문 (2막에서는 강한 음만)
  D.onsets.forEach(([ot, s], i) => {
    if (ot < DROP - .05) events.push({ t: ot, fn: () => ripple(ot, i % 2 === 0, s) });
    else if (ot < TITLE && s > .8) events.push({ t: ot, fn: () => ringAt(0, centerY(ot), radiusAt(ot) * 1.02, radiusAt(ot) * 1.7, .5, .05) });
  });
  events.push({ t: DROP, fn: () => { ringAt(0, 0, 2 * U, 16 * U, 1.1, .3); ringAt(0, 0, 1 * U, 11 * U, 1.4, .12); inkBurst(DROP, 70, 1.6); rayBurst(DROP, 40); } });
  for (let n = 1, bt = DROP + BEAT; bt < TITLE - .05; n++, bt = DROP + n * BEAT) {
    const tt = bt, k = n % 3;
    events.push({ t: tt, fn: k === 0 ? () => ringAt(0, 0, radiusAt(tt), 12 * U, .9, .16) : k === 1 ? () => rayBurst(tt, 26) : () => inkBurst(tt, 38, 1) });
  }
  events.push({ t: TITLE, fn: () => { ringAt(0, centerY(TITLE + .6), 1.5 * U, 18 * U, 1.3, .22); rayBurst(TITLE, 48); } });
  events.push({ t: POP, fn: () => { ringAt(0, 0, .2 * U, 22 * U, .8, .42); ringAt(0, 0, .1 * U, 14 * U, .7, .2); ringAt(0, 0, .1 * U, 8 * U, .6, .1); rayBurst(POP, 120, 2.1); inkBurst(POP, 90, 2.8, .4); } });
  events.sort((a, b) => a.t - b.t); events.forEach((e) => (e.done = false));
}

/* ── 파티클 (전부 'difference' 로 그려서 흰 바탕에선 검게, 검은 바탕에선 희게) ── */
function ripple(t, yang, s) { const [x, y] = t < T0 ? [0, 0] : orbPos(t, yang); parts.push({ type: "ring", x, y, r0: .45 * U, r1: (2.0 + s * 2.8) * U, life: .55, max: .55, lw: .06 + s * .06 }); }
function ringAt(x, y, r0, r1, life, lw) { parts.push({ type: "ring", x, y, r0, r1, life, max: life, lw }); }
function rayBurst(t, n, pw = 1) { const r = rng(Math.round(t * 100)), cy = centerY(t), R = radiusAt(t); for (let i = 0; i < n; i++) { const a = r() * TAU, sp = (14 + r() * 22) * pw * U / 60; parts.push({ type: "ray", age: 0, x: Math.cos(a) * R, y: cy + Math.sin(a) * R, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .45 + r() * .3, max: .75, len: (.6 + r() * 1.6) * U, lw: (.03 + r() * .06) * U, drag: .985 }); } }
function inkBurst(t, n, pw, sz = 1) { const r = rng(Math.round(t * 100) + 7), cy = centerY(t), R = radiusAt(t); for (let i = 0; i < n; i++) { const a = r() * TAU, sp = (3 + r() * r() * 16) * pw * U / 60, d = Math.sqrt(r()) * R * .85; parts.push({ type: "ink", age: 0, x: Math.cos(a) * d, y: cy + Math.sin(a) * d, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .7 + r() * .9, max: 1.6, size: (.08 + r() * r() * .5) * sz * U, drag: .95 }); } }
function update(t, dt) {
  for (const e of events) { if (e.done || t < e.t) continue; e.done = true; e.fn(); }
  for (const p of parts) { p.life -= dt; if (p.type === "ring") continue; p.age += dt; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; }
  parts = parts.filter((p) => p.life > 0);
}

/* ── 그리기 도구 ── */
function taiji(cx, cy, R, rot, whiteAlpha, outline) {
  g.save(); g.translate(cx, cy); g.rotate(rot);
  g.globalAlpha = whiteAlpha; g.fillStyle = "#fff"; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  g.globalAlpha = 1; g.fillStyle = "#000"; g.beginPath();
  g.arc(0, 0, R, -PI / 2, PI / 2); g.arc(0, R / 2, R / 2, PI / 2, -PI / 2, true); g.arc(0, -R / 2, R / 2, PI / 2, -PI / 2, false); g.closePath(); g.fill();
  if (outline) { g.strokeStyle = "#fff"; g.lineWidth = outline; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke(); }
  g.restore();
}
function taijiMorph(R, phi, amp, outline) {       // amp=1: 보통 태극(흰 머리 왼쪽·검은 머리 오른쪽), amp=0: 위는 검고 아래는 흰 반원
  const k = R * 2 / 3 * amp;
  g.save(); g.rotate(phi); g.fillStyle = "#fff"; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();
  g.fillStyle = "#000"; g.beginPath(); g.moveTo(-R, 0); g.arc(0, 0, R, PI, 0, false); g.bezierCurveTo(R, k, 0, k, 0, 0); g.bezierCurveTo(0, -k, -R, -k, -R, 0); g.closePath(); g.fill();
  if (outline) { g.strokeStyle = "#fff"; g.lineWidth = outline; g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke(); }
  g.restore();
}
function orb(x, y, r, yang, glow) {
  if (yang) { const gr = g.createRadialGradient(x, y, r * .6, x, y, r * (2.6 + glow * 2)); gr.addColorStop(0, `rgba(255,255,255,${.5 + .4 * glow})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.globalCompositeOperation = "lighter"; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * (2.6 + glow * 2), 0, TAU); g.fill(); g.globalCompositeOperation = "source-over"; }
  else { const gr = g.createRadialGradient(x, y, r * .6, x, y, r * (2.4 + glow * 1.6)); gr.addColorStop(0, `rgba(0,0,0,${.45 + .35 * glow})`); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * (2.4 + glow * 1.6), 0, TAU); g.fill(); }
  g.fillStyle = yang ? "#fff" : "#000"; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
function trail(t, yang, wMax) {                    // 구슬 뒤로 흐르는 혜성 꼬리 (잉어처럼) — 궤도 호를 따라 가늘어지는 한 덩어리
  const n = 28, a1 = rotAt(t) + (yang ? 0 : PI), dA = clamp(omega(t) * .42, t >= DROP ? 1.0 : .35, 2.2) * eOut(seg(t, T0 + .2, T0 + 1.2));
  const ro = orbR(t), cy = centerY(t), outer = [], inner = [];
  for (let i = 0; i <= n; i++) { const k = i / n, a = a1 - dA * (1 - k), w = wMax * k * k * .5; outer.push([Math.sin(a) * (ro + w), -Math.cos(a) * (ro + w) + cy]); inner.push([Math.sin(a) * (ro - w), -Math.cos(a) * (ro - w) + cy]); }
  g.globalAlpha = .85; g.beginPath(); g.moveTo(outer[0][0], outer[0][1]);
  for (let i = 1; i <= n; i++) g.lineTo(outer[i][0], outer[i][1]);
  for (let i = n; i >= 0; i--) g.lineTo(inner[i][0], inner[i][1]);
  g.closePath(); g.fill(); g.globalAlpha = 1;
}
function text(s, x, y, px, font, alpha, align) { g.globalAlpha = alpha; g.font = `${font || ""} ${px}px "Nanum Myeongjo","Batang","바탕",serif`; g.textAlign = align || "center"; g.textBaseline = "middle"; g.fillText(s, x, y); g.globalAlpha = 1; }

/* ── 한 프레임 ── */
function draw(t) {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const bp = beatPulse(t), bar = barPulse(t), lo = lowN(t), hi = highN(t);
  const zoom = 1 + .05 * bar + .28 * pulse(t, DROP, .01, .5) + .12 * pulse(t, TITLE, .01, .4) + .3 * pulse(t, POP, .01, .5);
  const shake = U * (.35 * pulse(t, DROP, .02, .6) + .05 * bp + .2 * pulse(t, TITLE, .02, .4) + .5 * pulse(t, POP, .02, .5) + .06 * seg(t, BUILD + 1, DROP));
  const r0 = rng(Math.floor(t * 60));
  g.translate(W / 2 + (r0() - .5) * shake, H / 2 + (r0() - .5) * shake); g.scale(zoom, zoom);
  { const cz = 1 + (t < TITLE ? .24 * eIn(seg(t, CONV, TITLE)) : .14 * imp(t)); g.scale(cz, cz); }        // 마지막 마디: 빨려 들어가듯
  const R = radiusAt(t), rot = rotAt(t), cy = centerY(t), titleK = eInOut(seg(t, TITLE, TITLE + .55));

  /* 배경: 2막 = 밤하늘 + 역회전 빛살, 종막 = 정확히 반반(왼쪽 밤 / 오른쪽 낮) */
  if (t >= BUILD + .8) {
    const M = Math.max(W, H) * .6;
    const blast = 1 + 1.6 * eOut(seg(t, POP, END));
    for (const s of stars) { g.globalAlpha = (.3 + .7 * s.z) * (.55 + .45 * Math.sin(t * (1.5 + s.z) + s.ph)) * (1 - titleK * .4); g.fillStyle = "#fff"; g.beginPath(); g.arc(s.x * M * blast, s.y * M * blast, s.z * 1.3 * (1 + hi * .6), 0, TAU); g.fill(); }
    g.globalAlpha = 1;
    if (t >= DROP) {                                 // 빛살 (박마다 밝아짐)
      const Rr = Math.hypot(W, H) * .7, a0 = -rot * .4, k = (.07 + .16 * bp + .1 * bar) * (1 - titleK);
      if (k > .005) { const gr = g.createRadialGradient(0, cy, R, 0, cy, Rr); gr.addColorStop(0, `rgba(255,255,255,${k * 1.6})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath();
        for (let i = 0; i < 18; i++) { const a = a0 + i / 18 * TAU, w = .07 + .03 * Math.sin(i * 1.7); g.moveTo(0, cy); g.lineTo(Math.cos(a - w) * Rr, cy + Math.sin(a - w) * Rr); g.lineTo(Math.cos(a + w) * Rr, cy + Math.sin(a + w) * Rr); g.closePath(); } g.fill(); }
    }
  }
  if (t >= TITLE && t < POP) { const k = eOut(seg(t, TITLE + .1, TITLE + .65)) * (1 - imp(t)); g.fillStyle = "#fff"; g.fillRect(-W, -H * k, 2 * W, H * k); }   // 수평선 위 = 낮, 아래 = 밤

  /* 서막 0~1.02: 어둠 속 한 점, 위아래로 자라는 빛의 금 */
  if (t < T0 + .3) {
    const k = eInOut(seg(t, .02, T0)), a = 1 - seg(t, T0, T0 + .3);
    g.globalAlpha = a; g.strokeStyle = "#fff"; g.lineWidth = Math.max(1, U * .018); g.beginPath(); g.moveTo(0, -H * .6 * k); g.lineTo(0, H * .6 * k); g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(0, 0, U * (.07 + .05 * lo), 0, TAU); g.fill(); g.globalAlpha = 1;
  }

  /* 태극 본체 — 1막에서는 화면보다 훨씬 커서 '경계선'만 보인다 */
  if (t >= T0) {
    if (t >= DROP && t < POP) { const gl = g.createRadialGradient(0, cy, R * .9, 0, cy, R * (1.7 + bp * .5)); gl.addColorStop(0, `rgba(255,255,255,${.3 + .35 * bp})`); gl.addColorStop(1, "rgba(255,255,255,0)"); g.globalCompositeOperation = "lighter"; g.fillStyle = gl; g.beginPath(); g.arc(0, cy, R * 2.3, 0, TAU); g.fill(); g.globalCompositeOperation = "source-over"; }
    if (t >= POP) { /* 터져서 사라짐 */ }
    else if (t >= TITLE) { const f = finale(t); taijiMorph(R, f.phi, f.amp, Math.max(1.5, U * .045)); }
    else taiji(0, cy, R, rot, eOut(seg(t, T0, T0 + .22)), R < 20 * U ? Math.max(1.5, U * .045) : 0);
  }

  /* 팔괘 — 박마다 하나씩 차례로 번쩍 */
  if (t >= DROP) {
    g.fillStyle = "#fff";
    const appear = eBack(seg(t, DROP, DROP + .5)) * (1 - titleK), beatN = Math.floor((t - DROP) / BEAT);
    if (appear > .01) for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU - rot * .35, hot = beatN % 8 === i ? bp : 0, rr = 4.05 * U * appear * (1 + .04 * bar) * (1 - .3 * eIn(seg(t, CONV, TITLE)));
      g.save(); g.translate(Math.cos(a) * rr, Math.sin(a) * rr + cy); g.rotate(a + PI / 2); g.scale(1 + hot * .35, 1 + hot * .35);

    }
  }

  /* 위성 태극 (15.02부터 박마다 하나씩, 19.02에 중심으로 빨려듦) */
  if (t >= SAT && t < TITLE + .5) {
    for (let i = 0; i < 6; i++) {
      const born = SAT + i * BEAT; if (t < born) continue;
      const k = eBack(seg(t, born, born + .4)), conv = eIn(seg(t, TITLE - .7, TITLE)), a = i / 6 * TAU + (t - SAT) * .9 * (1 + conv * 3);
      const rad = 1 - conv, x = Math.cos(a) * 6.3 * U * rad, y = Math.sin(a) * 3.5 * U * rad + cy;
      if (rad > .02) taiji(x, y, .62 * U * k * (1 + .25 * bp) * (1 - conv * .5), -rot * 1.5 + i, 1, Math.max(1, U * .03));
    }
  }

  /* 이하 전부 difference: 바탕색의 반대로 찍힌다 → 음 속의 양, 양 속의 음 */
  g.globalCompositeOperation = "difference"; g.fillStyle = "#fff"; g.strokeStyle = "#fff";
  if (t >= T0 + .2 && t < TITLE) { const ow = lerp(.4 * U, R * .14, seg(t, BUILD, DROP)) * 1.7; trail(t, true, ow); trail(t, false, ow); }
  // 해와 달 — 서로 반대편에서 돌다가 종막에 수평으로 정렬(춘분)
  if (t >= DROP + .3 && t < TITLE) {
    const k = eOut(seg(t, DROP + .3, DROP + 1.2)), cvg = eInOut(seg(t, CONV + .3, TITLE - .05)), th = -(t - DROP) * .55 * (1 + 2 * cvg) + PI, ex = 6.6 * U * (1 - cvg * .55), ey = 2.5 * U * (1 - cvg * .2), sr = .5 * U * k * (1 - .45 * cvg);
    const [ox1, oy1] = orbPos(t, true), [ox2, oy2] = orbPos(t, false), pull = eIn(cvg);
    const sx = lerp(Math.cos(th) * ex, ox1, pull), sy = lerp(Math.sin(th) * ey + cy, oy1, pull), mx = lerp(-Math.cos(th) * ex, ox2, pull), my = lerp(-Math.sin(th) * ey + cy, oy2, pull);
    g.beginPath(); g.arc(sx, sy, sr, 0, TAU); g.fill();
    g.lineWidth = Math.max(1, U * .05); g.lineCap = "round";
    for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + t * .5, l = sr * (1.35 + .25 * (i % 2) + .3 * bp); g.beginPath(); g.moveTo(sx + Math.cos(a) * sr * 1.2, sy + Math.sin(a) * sr * 1.2); g.lineTo(sx + Math.cos(a) * l, sy + Math.sin(a) * l); g.stroke(); }
    g.save(); g.beginPath(); g.arc(mx, my, sr, 0, TAU); g.clip(); g.beginPath(); g.arc(mx, my, sr, 0, TAU); g.arc(mx + sr * .45, my - sr * .12, sr * .85, 0, TAU, true); g.fill("evenodd"); g.restore();
  }

  g.lineCap = "round";
  for (const p of parts) {
    const k = clamp(p.life / p.max);
    if (p.type === "ring") { const q = 1 - p.life / p.max; g.globalAlpha = Math.min(1, k * 1.5); g.lineWidth = Math.max(1, p.lw * U * (1.2 - q)); g.beginPath(); g.arc(p.x, p.y, lerp(p.r0, p.r1, eOut(q)), 0, TAU); g.stroke(); }
    else if (p.type === "ray") { const m = Math.hypot(p.vx, p.vy) || 1; g.globalAlpha = Math.min(1, k * 2); g.lineWidth = p.lw; g.beginPath(); g.moveTo(p.x, p.y); const L = p.len * k * Math.min(1, p.age * 9); g.lineTo(p.x - p.vx / m * L, p.y - p.vy / m * L); g.stroke(); }
    else { g.globalAlpha = 1; g.beginPath(); g.arc(p.x, p.y, p.size * Math.min(1, k * 1.8) * Math.min(1, p.age * 12), 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;
  // 종막 — 수평선에 걸친 글자는 위는 검게(낮 위), 아래는 희게(밤 위) 찍힌다. 가운데 I 자리는 펴진 태극이 대신한다
  if (t >= TITLE + .2 && t < POP) {
    const im = imp(t), k2 = eOut(seg(t, TITLE + .22, TITLE + .65)), Rr = radiusAt(t), sc = Math.min(1, W / (13.2 * U)), live = 1 - im * im;
    g.globalAlpha = k2 * live; g.lineWidth = Math.max(1, U * .022);
    for (const m of [1.4, 1.62]) { g.beginPath(); g.arc(0, 0, Rr * m * (1.6 - .6 * k2), 0, TAU); g.stroke(); }          // 천문 눈금 고리
    for (let i = 0; i < 48; i++) { const a = i / 48 * TAU + t * .15 + im * 2.5, l = i % 4 ? .08 : .17; g.beginPath(); g.moveTo(Math.cos(a) * Rr * 1.4, Math.sin(a) * Rr * 1.4); g.lineTo(Math.cos(a) * Rr * (1.4 + l), Math.sin(a) * Rr * (1.4 + l)); g.stroke(); }
    const L = "EQU NOX", xs = [-5.75, -4.25, -2.85, 0, 2.85, 4.25, 5.75];
    g.textBaseline = "middle"; g.textAlign = "center"; g.font = `800 ${1.3 * U * sc * (1 - .55 * im)}px "Pretendard","Segoe UI","Malgun Gothic",sans-serif`;
    for (let i = 0; i < 7; i++) { if (i === 3) continue; const d = Math.abs(i - 3), k = eOut(seg(t, TITLE + .24 + d * .05, TITLE + .52 + d * .05)); g.globalAlpha = k * live; g.fillText(L[i], xs[i] * U * sc * lerp(.5, 1, k) * (1 - .94 * im), .09 * U * sc); }
    const ka = eOut(seg(t, TITLE + .55, TITLE + .9)) * .85 * live;
    text("陽", 0, -2.55 * U * (1 - im), .46 * U, "", ka); text("陰", 0, 2.55 * U * (1 - im), .46 * U, "", ka);      // 낮 위의 陽, 밤 아래의 陰
    g.globalAlpha = 1;
  }
  g.globalCompositeOperation = "source-over";

  /* 음·양 구슬 (태극의 두 눈) */
  if (t >= T0 && t < POP) {
    const r = lerp(.4 * U, R * .14, seg(t, BUILD, DROP)) * (1 + .12 * lo), [yx, yy] = orbPos(t, true), [nx, ny] = orbPos(t, false);
    const ya = eOut(seg(t, T0, T0 + .4)), na = eOut(seg(t, T0 + BEAT, T0 + BEAT + .4));
    g.globalAlpha = ya; orb(yx, yy, r * ya, true, lo * .6 + bp * .6); g.globalAlpha = na; orb(nx, ny, r * na, false, lo * .6 + bp * .6); g.globalAlpha = 1;
  }

  if (t >= POP - .38 && t < POP + .25) { const k = t < POP ? imp(t) : 1 - seg(t, POP, POP + .25), rr = U * (.6 + 2.4 * k); const gr = g.createRadialGradient(0, 0, 0, 0, 0, rr); gr.addColorStop(0, `rgba(255,255,255,${k})`); gr.addColorStop(1, "rgba(255,255,255,0)"); g.globalCompositeOperation = "lighter"; g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.fill(); g.globalCompositeOperation = "source-over"; }

  /* 후처리: 드롭 순간 전체 반전(1회) + 섬광, 색보정(흰색→상아, 검정→남빛), 비네트, 페이드 */
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if ((t >= DROP && t < DROP + .07) || (t >= POP && t < POP + .06)) { g.globalCompositeOperation = "difference"; g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.globalCompositeOperation = "source-over"; }
  const fl = Math.max(pulse(t, DROP + .07, .01, .5), .8 * pulse(t, TITLE, .02, .4), 1.08 * pulse(t, POP + .06, .01, .42), .5 * pulse(t, T0, .01, .3)); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl * fl * .85})`; g.fillRect(0, 0, W, H); }

  g.globalCompositeOperation = "screen"; g.fillStyle = "#08071a"; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "source-over";
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.hypot(W, H) * .62); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.5)"); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const black = Math.max(1 - seg(t, 0, .25), seg(t, FADE, END)); if (black > 0) { g.fillStyle = `rgba(0,0,0,${black})`; g.fillRect(0, 0, W, H); }
}

/* ── 재생: 시계·HUD·자막·시작/종료 화면은 공용 키트(cs_ui.js)가 맡는다 ── */
const VARIANT = "2d";
function simulate(tt) { init(); for (let t = 0; t < tt; t += 1 / 60) { time = t; update(t, 1 / 60); } time = tt; }
const player = CSUI.create({
  stage: $("cs"), audio: bgm, volume: VOLUME, duration: END, theme: "ink", capBlend: true,
  no: "01", title: "EQUINOX", sub: "陰陽", hero: "/thumbs/equinox_hero.jpg",
  tagline: "거대한 태극의 안쪽에서 시작해, 음과 양이 맞물려 하나가 되는 순간까지.\n90 BPM · 3/4박의 음악에 박자 단위로 맞춘 흑백 연출.",
  meta: [["0:22", "Length"], ["90 BPM · 3/4", "Tempo"], [VARIANT === "gl" ? "WebGL2" : "Canvas 2D", "Renderer"]],
  chapters: [{ t: 0, name: "分 · 분리" }, { t: BUILD, name: "渦 · 소용돌이" }, { t: DROP, name: "合 · 합일" }, { t: CONV, name: "歸 · 수렴" }, { t: TITLE, name: "春分 · 춘분" }],
  captions: CAPS,
